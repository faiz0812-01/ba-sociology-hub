const QUESTIONS=[{"id":1,"question":"Where did Martin Luther King Jr. deliver the “I Have a Dream” speech?","options":[{"value":"A","text":"Montgomery, Alabama"},{"value":"B","text":"Washington, D.C."},{"value":"C","text":"Atlanta, Georgia"},{"value":"D","text":"Chicago, Illinois"}],"answer":"B"},{"id":2,"question":"What major theme does King emphasize in his “dream”?","options":[{"value":"A","text":"Economic prosperity for all Americans"},{"value":"B","text":"A world without any political conflict"},{"value":"C","text":"Racial equality and harmony"},{"value":"D","text":"The expansion of American territory"}],"answer":"C"},{"id":3,"question":"Which rhetorical device is most famously used throughout the speech?","options":[{"value":"A","text":"Irony"},{"value":"B","text":"Repetition"},{"value":"C","text":"Hyperbole"},{"value":"D","text":"Alliteration"}],"answer":"B"},{"id":4,"question":"King refers to the Declaration of Independence to emphasize which idea?","options":[{"value":"A","text":"America should become a monarchy"},{"value":"B","text":"All citizens must follow strict laws"},{"value":"C","text":"The promise of equal rights for all"},{"value":"D","text":"The need for more economic reforms"}],"answer":"C"},{"id":5,"question":"According to the speech, what should people be judged by?","options":[{"value":"A","text":"Their wealth"},{"value":"B","text":"Their education level"},{"value":"C","text":"Their character"},{"value":"D","text":"Their political views"}],"answer":"C"},{"id":6,"question":"According to the poem, what instruction is heard at the break of day that encourages renewal and resilience?","options":[{"value":"A","text":"Focus only on what is yet to be."},{"value":"B","text":"Start again, and do not dwell on the past or future."},{"value":"C","text":"Ring the bells that still can ring, ignoring the past."},{"value":"D","text":"Fight the wars that will be fought again."}],"answer":"B"},{"id":7,"question":"What specific critique is offered regarding the \"holy dove,\" often symbolising peace or innocence?","options":[{"value":"A","text":"It is often forgotten when the wars are fought."},{"value":"B","text":"It sings to announce the need to start again."},{"value":"C","text":"It is continually caught, bought, and sold, confirming it is \"never free\"."},{"value":"D","text":"It represents the perfect offering that must be forgotten."}],"answer":"C"},{"id":8,"question":"The speaker rejects complicity with the \"lawless crowd\" and highlights the hypocrisy of the powerful by noting that the \"killers in high places\" are doing what action?","options":[{"value":"A","text":"Summoning a thundercloud."},{"value":"B","text":"Running away from the battle."},{"value":"C","text":"Saying their prayers out loud."},{"value":"D","text":"Adding up the parts to find the sum."}],"answer":"C"},{"id":9,"question":"What metaphorical element is identified as the necessary channel for \"the light\" to enter, reflecting the central theme of grace through imperfection?","options":[{"value":"A","text":"The ringing of the bells that still can ring."},{"value":"B","text":"The birth betrayed or the marriage spent."},{"value":"C","text":"A crack, a crack in everything."},{"value":"D","text":"The finding of a drum for the march."}],"answer":"C"},{"id":10,"question":"The poem states that \"Every heart, every heart / To love will come.\" However, how is the arrival of this love characterised, indicating a sense of vulnerability?","options":[{"value":"A","text":"Like a perfect offering."},{"value":"B","text":"Like a lawless crowd."},{"value":"C","text":"Like a thundercloud."},{"value":"D","text":"But like a refugee."}],"answer":"D"},{"id":11,"question":"Leonard Cohen's \"Anthem\" is often interpreted as a call for:","options":[{"value":"A","text":"Revolution"},{"value":"B","text":"Acceptance of flaws and imperfections"},{"value":"C","text":"Economic reform"},{"value":"D","text":"Political change"}],"answer":"B"},{"id":12,"question":"In \"Anthem,\" Cohen mentions \"the bells,\" which can be interpreted as a metaphor for:","options":[{"value":"A","text":"War and conflict"},{"value":"B","text":"Joy and celebration"},{"value":"C","text":"Tradition and routine"},{"value":"D","text":"Change and awakening"}],"answer":"D"},{"id":13,"question":"Leonard Cohen's \"Anthem\" encourages listeners to:","options":[{"value":"A","text":"Strive for perfection in all things"},{"value":"B","text":"Embrace imperfection as a part of life"},{"value":"C","text":"Ignore the world's problems"},{"value":"D","text":"Seek wealth and success above all else"}],"answer":"B"},{"id":14,"question":"How does Amy Morales Lara personally define art in the context of her discussion?","options":[{"value":"A","text":"A skill that requires a professional certification."},{"value":"B","text":"A practice-based discipline that promotes social change."},{"value":"C","text":"A form of creative expression that can help you tell a story."},{"value":"D","text":"Only specialized creative fields like painting and sculpture."}],"answer":"C"},{"id":15,"question":"According to Amy Morales Lara, what is the primary role of a \"helper\" in the context of social work?","options":[{"value":"A","text":"To rescue someone from their problems and provide definitive solutions."},{"value":"B","text":"To manage equitable outcomes and access to care for a community."},{"value":"C","text":"To partner with someone in their own process of self-development and growth."},{"value":"D","text":"To challenge negative self-narratives through music and songwriting."}],"answer":"C"},{"id":16,"question":"What phrase, spoken by her professor, validated Amy Morales Lara's idea of combining creative arts and social work?","options":[{"value":"A","text":"\"The intersection is not impossible, only requires courage.\""},{"value":"B","text":"\"In many ways, many social workers are also frustrated artists.”"},{"value":"C","text":"\"Art is accessible to everyone, regardless of skill level.\""},{"value":"D","text":"\"You must lean into the principles of compassion, empathy, and curiosity.\""}],"answer":"B"},{"id":17,"question":"Amy Morales Lara notes that art is present in advocacy. What specific example does she cite to show how creative people use art in advocacy?","options":[{"value":"A","text":"Creating digital art to explore identity and injustice."},{"value":"B","text":"Organizing community mural projects."},{"value":"C","text":"Utilizing beautiful images and words on picket signs."},{"value":"D","text":"Implementing art therapy for anxiety and depression."}],"answer":"C"},{"id":18,"question":"Amy Morales Lara highlights that the Bronx had a meaningful art renaissance that brought about things that changed the world as we know it. Name any two of the few things she mentions that have been ground-breaking developments that have been cultivated in the Bronx:","options":[{"value":"A","text":"Abstract painting and modern poetry."},{"value":"B","text":"Jazz and classical music theory."},{"value":"C","text":"Hip-hop and salsa."},{"value":"D","text":"Film-making and traditional theater."}],"answer":"C"},{"id":19,"question":"When encouraging the audience to enter an art space, what key quality does Amy Morales Lara explicitly state is not the goal?","options":[{"value":"A","text":"Courageousness."},{"value":"B","text":"Openness."},{"value":"C","text":"Bravery."},{"value":"D","text":"Perfection."}],"answer":"D"},{"id":20,"question":"In \"Art as Social Work,\" Amy Morales Lara likely emphasizes the role of art in:","options":[{"value":"A","text":"Generating profit"},{"value":"B","text":"Providing entertainment"},{"value":"C","text":"Facilitating healing and liberation"},{"value":"D","text":"Creating political propaganda"}],"answer":"C"},{"id":21,"question":"How does Amy Morales Lara view the intersection of art and social work?","options":[{"value":"A","text":"As two unrelated fields"},{"value":"B","text":"As a way to monetize creative talents"},{"value":"C","text":"As a powerful tool for community building and emotional support"},{"value":"D","text":"As a form of traditional therapy"}],"answer":"C"},{"id":22,"question":"What is the central theme of George Carlin's \"Soft Language\"?","options":[{"value":"A","text":"The importance of learning new vocabulary"},{"value":"B","text":"The history of the English language"},{"value":"C","text":"The use of euphemisms to conceal reality"},{"value":"D","text":"The development of modern comedy"}],"answer":"C"},{"id":23,"question":"According to Carlin, why do people use soft language?","options":[{"value":"A","text":"To make communication more accurate"},{"value":"B","text":"To make reality easier to face"},{"value":"C","text":"To improve grammar and pronunciation"},{"value":"D","text":"To increase the length of conversations"}],"answer":"B"},{"id":24,"question":"What was the term used during World War I to describe psychological trauma experienced by soldiers?","options":[{"value":"A","text":"Battle Fatigue"},{"value":"B","text":"Operational Exhaustion"},{"value":"C","text":"Post-Traumatic Stress Disorder"},{"value":"D","text":"Shell Shock"}],"answer":"D"},{"id":25,"question":"Which term replaced \"Shell Shock\" during World War II?","options":[{"value":"A","text":"Post-Traumatic Stress Disorder"},{"value":"B","text":"Battle Fatigue"},{"value":"C","text":"Operational Exhaustion"},{"value":"D","text":"Combat Disorder"}],"answer":"B"},{"id":26,"question":"According to Carlin, what happened to the term describing combat trauma over time?","options":[{"value":"A","text":"It became simpler and more direct."},{"value":"B","text":"It became more emotional."},{"value":"C","text":"It became longer and more technical."},{"value":"D","text":"It disappeared completely."}],"answer":"C"},{"id":27,"question":"What does Carlin suggest about euphemistic language?","options":[{"value":"A","text":"It makes communication clearer."},{"value":"B","text":"It strengthens emotional expression."},{"value":"C","text":"It often hides unpleasant truths."},{"value":"D","text":"It improves social harmony in all situations."}],"answer":"C"},{"id":28,"question":"Which literary technique is most prominent in Carlin's performance?","options":[{"value":"A","text":"Romantic imagery"},{"value":"B","text":"Satire and irony"},{"value":"C","text":"Epic narration"},{"value":"D","text":"Symbolism"}],"answer":"B"},{"id":29,"question":"What broader message does Carlin convey through his stand-up routine?","options":[{"value":"A","text":"Language has little influence on society."},{"value":"B","text":"Humour should avoid serious topics."},{"value":"C","text":"Words can shape how people perceive reality."},{"value":"D","text":"Technical language is always superior to ordinary language."}],"answer":"C"},{"id":30,"question":"What major historical event significantly influenced Arthur Miller's understanding of society and shaped his dramatic works?","options":[{"value":"A","text":"The First World War"},{"value":"B","text":"The American Civil War"},{"value":"C","text":"The Great Depression"},{"value":"D","text":"The Cold War"}],"answer":"C"},{"id":31,"question":"Which of the following works established Arthur Miller's international reputation and won both the Pulitzer Prize and the Tony Award?","options":[{"value":"A","text":"The Crucible"},{"value":"B","text":"All My Sons"},{"value":"C","text":"A View from the Bridge"},{"value":"D","text":"Death of a Salesman"}],"answer":"D"},{"id":32,"question":"Who was the primary inspiration for the character of Willy Loman?","options":[{"value":"A","text":"Arthur Miller's father"},{"value":"B","text":"Arthur Miller's brother"},{"value":"C","text":"Arthur Miller's uncle, Manny Newman"},{"value":"D","text":"Arthur Miller's college professor"}],"answer":"C"},{"id":33,"question":"Which theme is most central to Death of a Salesman?","options":[{"value":"A","text":"Colonialism and nationalism"},{"value":"B","text":"The American Dream and its limitations"},{"value":"C","text":"War and heroism"},{"value":"D","text":"Scientific progress and technology"}],"answer":"B"},{"id":34,"question":"Why does Biff lose his admiration for Willy?","options":[{"value":"A","text":"Willy loses his job"},{"value":"B","text":"Willy refuses to support him financially"},{"value":"C","text":"Biff discovers Willy's extramarital affair"},{"value":"D","text":"Willy forces him to leave home"}],"answer":"C"},{"id":35,"question":"What does the transformation of Willy's neighbourhood symbolize in the play?","options":[{"value":"A","text":"Economic prosperity and urban success"},{"value":"B","text":"The growth of American democracy"},{"value":"C","text":"The loss of personal freedom, security, and connection with nature"},{"value":"D","text":"The rise of industrial employment opportunities"}],"answer":"C"},{"id":36,"question":"In the prescribed extract, what problem causes Willy to return home unexpectedly?","options":[{"value":"A","text":"He loses an important business contract."},{"value":"B","text":"His car breaks down on the highway."},{"value":"C","text":"He becomes unable to concentrate while driving and nearly causes an accident."},{"value":"D","text":"He receives news of a family emergency."}],"answer":"C"},{"id":37,"question":"Who is the teacher conducting the English literature class in the “Rip It Out” scene?","options":[{"value":"A","text":"Dr. J. Evans Pritchard"},{"value":"B","text":"Mr. McAllister"},{"value":"C","text":"John Keating"},{"value":"D","text":"Mr. Perry"}],"answer":"C"},{"id":38,"question":"What does Dr. J. Evans Pritchard’s method attempt to do?","options":[{"value":"A","text":"Teach students to write their own poetry"},{"value":"B","text":"Measure the greatness of poetry through charts, formulas, and analysis"},{"value":"C","text":"Encourage students to perform poetry on stage"},{"value":"D","text":"Explain the historical background of poetry"}],"answer":"B"},{"id":39,"question":"Why does Keating ask the students to tear out the introduction to their poetry textbook?","options":[{"value":"A","text":"Because the textbook is outdated"},{"value":"B","text":"Because he wants the students to memorize the poems"},{"value":"C","text":"Because he rejects the rigid method of reducing poetry to formulas and measurements"},{"value":"D","text":"Because the textbook contains incorrect biographical information"}],"answer":"C"},{"id":40,"question":"According to Keating, why do people read and write poetry?","options":[{"value":"A","text":"To get better examination marks"},{"value":"B","text":"To prepare for professional careers"},{"value":"C","text":"Because human beings are filled with passion and poetry gives meaning to life"},{"value":"D","text":"Because poetry is easier to understand than other subjects"}],"answer":"C"},{"id":41,"question":"Which poet does Keating quote toward the end of the scene?","options":[{"value":"A","text":"Lord Byron"},{"value":"B","text":"William Shakespeare"},{"value":"C","text":"Walt Whitman"},{"value":"D","text":"J. Evans Pritchard"}],"answer":"C"},{"id":42,"question":"What does Keating mean by asking, “What will your verse be?”","options":[{"value":"A","text":"He asks students to memorize a particular poem."},{"value":"B","text":"He encourages students to discover their own identity and make a meaningful contribution to life."},{"value":"C","text":"He wants students to become professional poets."},{"value":"D","text":"He asks students to write a poem for their next examination."}],"answer":"B"},{"id":43,"question":"\"The Second Coming\" was written by W. B. Yeats in the aftermath of:","options":[{"value":"A","text":"The French Revolution"},{"value":"B","text":"The First World War"},{"value":"C","text":"The Second World War"},{"value":"D","text":"The Irish Potato Famine"}],"answer":"B"},{"id":44,"question":"In the poem, the \"falcon\" primarily symbolizes:","options":[{"value":"A","text":"Nature"},{"value":"B","text":"Humanity"},{"value":"C","text":"Christianity"},{"value":"D","text":"The poet himself"}],"answer":"B"},{"id":45,"question":"What does the line \"Things fall apart; the centre cannot hold\" suggest?","options":[{"value":"A","text":"Society is becoming more united."},{"value":"B","text":"Civilization is collapsing and order is breaking down."},{"value":"C","text":"Nature is returning to its original state."},{"value":"D","text":"Peace has finally been restored."}],"answer":"B"},{"id":46,"question":"The phrase Spiritus Mundi refers to:","options":[{"value":"A","text":"The Kingdom of Heaven"},{"value":"B","text":"A mythical kingdom"},{"value":"C","text":"The collective memory and imagination of humanity"},{"value":"D","text":"The Roman Empire"}],"answer":"C"},{"id":47,"question":"The \"rough beast\" in the poem symbolizes:","options":[{"value":"A","text":"The return of Christ"},{"value":"B","text":"Hope and redemption"},{"value":"C","text":"A terrifying new historical age"},{"value":"D","text":"The triumph of Christianity"}],"answer":"C"},{"id":48,"question":"Which of the following is a major theme of “The Second Coming”?","options":[{"value":"A","text":"Romantic love and beauty"},{"value":"B","text":"Nature and pastoral life"},{"value":"C","text":"Chaos, violence, and the collapse of civilization"},{"value":"D","text":"Adventure and heroism"}],"answer":"C"},{"id":49,"question":"The poem ends with a rhetorical question about the \"rough beast\" slouching towards Bethlehem. What is the effect of this ending?","options":[{"value":"A","text":"It provides a clear solution to the world's problems."},{"value":"B","text":"It celebrates the return of peace and harmony."},{"value":"C","text":"It leaves readers with uncertainty and a sense of fear about the future."},{"value":"D","text":"It confirms that Christ has already returned."}],"answer":"C"},{"id":50,"question":"James Finn Garner's “The Frog Prince” is a modern retelling of the fairy tale originally popularized by:","options":[{"value":"A","text":"Hans Christian Andersen"},{"value":"B","text":"Charles Perrault"},{"value":"C","text":"The Grimm Brothers"},{"value":"D","text":"Lewis Carroll"}],"answer":"C"},{"id":51,"question":"In Garner's version of the story, the princess is portrayed as:","options":[{"value":"A","text":"Helpless and dependent on the prince"},{"value":"B","text":"Intelligent, independent, and eco-feminist"},{"value":"C","text":"A selfish and spoiled royal child"},{"value":"D","text":"A powerless victim of the sorcerer"}],"answer":"B"},{"id":52,"question":"After the spell is broken, the frog is transformed into:","options":[{"value":"A","text":"A handsome prince"},{"value":"B","text":"A brave knight"},{"value":"C","text":"A wealthy merchant"},{"value":"D","text":"A greedy real estate developer"}],"answer":"D"},{"id":53,"question":"Which of the following themes is most strongly represented by the transformed frog's plan to drain the pond and cut down the forest?","options":[{"value":"A","text":"Romantic love"},{"value":"B","text":"Capitalism and corporate greed"},{"value":"C","text":"Friendship and loyalty"},{"value":"D","text":"Religious faith"}],"answer":"B"},{"id":54,"question":"Which literary devices are most prominently used by James Finn Garner in “The Frog Prince?”","options":[{"value":"A","text":"Allegory and epic"},{"value":"B","text":"Satire and parody"},{"value":"C","text":"Tragedy and realism"},{"value":"D","text":"Myth and legend"}],"answer":"B"},{"id":55,"question":"What is the main purpose of Garner's retelling of “The Frog Prince?”","options":[{"value":"A","text":"To preserve the traditional fairy tale without any changes"},{"value":"B","text":"To celebrate monarchy and royal traditions"},{"value":"C","text":"To entertain readers while criticizing modern social issues and traditional stereotypes"},{"value":"D","text":"To provide a historical account of medieval Europe"}],"answer":"C"},{"id":56,"question":"According to Helen Keller, what is the universal desire shared by all human beings?","options":[{"value":"A","text":"Wealth"},{"value":"B","text":"Fame"},{"value":"C","text":"Happiness"},{"value":"D","text":"Power"}],"answer":"C"},{"id":57,"question":"According to Keller, true happiness comes primarily from:","options":[{"value":"A","text":"Material possessions and luxury"},{"value":"B","text":"Social status and success"},{"value":"C","text":"Inner strength, hope, and meaningful work"},{"value":"D","text":"Physical comfort and pleasure"}],"answer":"C"},{"id":58,"question":"What transformed Helen Keller's life from \"darkness and stillness\" to \"hope and joy\"?","options":[{"value":"A","text":"Travelling around the world"},{"value":"B","text":"Learning language through Anne Sullivan"},{"value":"C","text":"Becoming a famous writer"},{"value":"D","text":"Earning a university degree"}],"answer":"B"},{"id":59,"question":"What does Helen Keller mean by \"false optimism\"?","options":[{"value":"A","text":"Believing that wealth guarantees happiness"},{"value":"B","text":"Ignoring suffering and injustice while pretending everything is fine"},{"value":"C","text":"Working hard without expecting rewards"},{"value":"D","text":"Having confidence in difficult situations"}],"answer":"B"},{"id":60,"question":"According to Keller, what does suffering help develop in human beings?","options":[{"value":"A","text":"Fear and dependence"},{"value":"B","text":"Anger and revenge"},{"value":"C","text":"Patience, courage, and compassion"},{"value":"D","text":"Pride and ambition"}],"answer":"C"},{"id":61,"question":"Which statement best reflects Keller's view of work?","options":[{"value":"A","text":"Work is only a means of earning money."},{"value":"B","text":"Only great achievements are valuable."},{"value":"C","text":"The desire and willingness to work is itself an expression of optimism."},{"value":"D","text":"Work should be avoided whenever possible."}],"answer":"C"},{"id":62,"question":"How does Helen Keller describe optimism at the end of the essay?","options":[{"value":"A","text":"As a temporary emotion"},{"value":"B","text":"As blind faith without reason"},{"value":"C","text":"As her religion and guiding philosophy of life"},{"value":"D","text":"As a form of material success"}],"answer":"C"},{"id":63,"question":"According to Dr. B.R. Ambedkar, the caste system is not merely a division of labour because it is also a:","options":[{"value":"A","text":"Division of wealth"},{"value":"B","text":"Division of religion"},{"value":"C","text":"Division of labourers"},{"value":"D","text":"Division of language"}],"answer":"C"},{"id":64,"question":"Why does Ambedkar criticise the caste system's method of assigning occupations?","options":[{"value":"A","text":"It encourages competition among workers."},{"value":"B","text":"It is based on the social status of one's parents rather than individual ability."},{"value":"C","text":"It allows people to choose their professions freely."},{"value":"D","text":"It increases industrial productivity."}],"answer":"B"},{"id":65,"question":"According to the speech, what does the caste system prevent individuals from doing?","options":[{"value":"A","text":"Receiving higher education"},{"value":"B","text":"Participating in politics"},{"value":"C","text":"Changing occupations according to changing circumstances"},{"value":"D","text":"Owning property"}],"answer":"C"},{"id":66,"question":"Ambedkar argues that the caste system contributes to unemployment because it:","options":[{"value":"A","text":"Discourages industrial development."},{"value":"B","text":"Prevents people from taking occupations outside their hereditary caste."},{"value":"C","text":"Promotes excessive competition."},{"value":"D","text":"Encourages migration to cities."}],"answer":"B"},{"id":67,"question":"According to Ambedkar, many occupations in India provoke \"aversion\" among workers because they are:","options":[{"value":"A","text":"Poorly paid."},{"value":"B","text":"Difficult to perform."},{"value":"C","text":"Considered degrading and carry social stigma."},{"value":"D","text":"Located in rural areas."}],"answer":"C"},{"id":68,"question":"What is Ambedkar's final assessment of the caste system as an economic organisation?","options":[{"value":"A","text":"It is beneficial because it preserves traditional occupations."},{"value":"B","text":"It is necessary for maintaining social order."},{"value":"C","text":"It is harmful because it suppresses people's natural abilities and interests."},{"value":"D","text":"It is suitable only for agricultural societies."}],"answer":"C"},{"id":69,"question":"What is the main reason for the cook's sudden fame in the story?","options":[{"value":"A","text":"He writes a famous book."},{"value":"B","text":"He delivers a powerful political speech."},{"value":"C","text":"His nose grows unusually long."},{"value":"D","text":"He wins a national award."}],"answer":"C"},{"id":70,"question":"Which institution is most sharply criticized for turning the cook into a public spectacle?","options":[{"value":"A","text":"The educational system"},{"value":"B","text":"The media"},{"value":"C","text":"The judiciary"},{"value":"D","text":"The military"}],"answer":"B"},{"id":71,"question":"What does the extraordinarily long nose primarily symbolize in the story?","options":[{"value":"A","text":"Physical strength and courage"},{"value":"B","text":"Society's obsession with fame and spectacle"},{"value":"C","text":"Scientific progress and innovation"},{"value":"D","text":"Religious devotion"}],"answer":"B"},{"id":72,"question":"Which of the following best describes the character of the cook?","options":[{"value":"A","text":"Ambitious, educated, and politically active"},{"value":"B","text":"Wealthy, influential, and manipulative"},{"value":"C","text":"Innocent, simple, and easily exploited"},{"value":"D","text":"Proud, arrogant, and power-hungry"}],"answer":"C"},{"id":73,"question":"How does Basheer mainly criticize politics in The World-Renowned Nose?","options":[{"value":"A","text":"By portraying politicians as heroic leaders"},{"value":"B","text":"By showing political parties exploiting the cook's fame for their own interests"},{"value":"C","text":"By encouraging citizens to participate in elections"},{"value":"D","text":"By describing detailed government policies"}],"answer":"B"},{"id":74,"question":"Which literary device is most prominently employed throughout The World-Renowned Nose?","options":[{"value":"A","text":"Tragedy"},{"value":"B","text":"Romanticism"},{"value":"C","text":"Satire combined with humour and exaggeration"},{"value":"D","text":"Detective fiction"}],"answer":"C"},{"id":75,"question":"What is the primary setting of Cinema Paradiso?","options":[{"value":"A","text":"A bustling city in Rome"},{"value":"B","text":"A small Sicilian town named Giancaldo"},{"value":"C","text":"A village in northern France"},{"value":"D","text":"A coastal town in Spain"}],"answer":"B"},{"id":76,"question":"What role does Alfredo play in Toto's life?","options":[{"value":"A","text":"He is Toto's schoolteacher."},{"value":"B","text":"He is Toto's elder brother."},{"value":"C","text":"He becomes Toto's mentor and father figure."},{"value":"D","text":"He is a famous film director."}],"answer":"C"},{"id":77,"question":"According to Kusali Rupasinghe's review, what makes Cinema Paradiso a \"love letter to cinema\"?","options":[{"value":"A","text":"It focuses mainly on filmmaking technology."},{"value":"B","text":"It celebrates the joy, nostalgia, and communal experience of watching films."},{"value":"C","text":"It criticises modern cinema and television."},{"value":"D","text":"It tells the history of Italian cinema in detail."}],"answer":"B"},{"id":78,"question":"In the film, what does the priest do whenever a kissing scene appears on the screen?","options":[{"value":"A","text":"He leaves the cinema hall."},{"value":"B","text":"He applauds the audience."},{"value":"C","text":"He rings a bell to have the scene censored."},{"value":"D","text":"He stops the film permanently."}],"answer":"C"},{"id":79,"question":"Which of the following qualities of Kusali Rupasinghe's review best demonstrates effective movie review writing?","options":[{"value":"A","text":"Revealing the entire ending of the film"},{"value":"B","text":"Focusing only on the plot without analysis"},{"value":"C","text":"Combining personal memories with critical evaluation and avoiding spoilers"},{"value":"D","text":"Criticising every aspect of the film without evidence"}],"answer":"C"},{"id":80,"question":"Which major theme is most strongly conveyed through Toto's return to Giancaldo after Alfredo's death?","options":[{"value":"A","text":"Political revolution"},{"value":"B","text":"Scientific progress"},{"value":"C","text":"Nostalgia and the lasting influence of childhood memories"},{"value":"D","text":"Competition in the film industry"}],"answer":"C"}];
