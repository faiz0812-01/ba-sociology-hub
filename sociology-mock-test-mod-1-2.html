hich intellectual movement emphasized reason and rational thinking in Europe during the 17th and 18th centuries?","options":[{"value":"A","text":"Renaissance"},{"value":"B","text":"Enlightenment"},{"value":"C","text":"Reformation"},{"value":"D","text":"Industrial Revolution"}],"answer":"B"},{"id":18,"question":"Which intellectual movement is known as the 'Age of Reason'?","options":[{"value":"A","text":"Renaissance"},{"value":"B","text":"Enlightenment"},{"value":"C","text":"Reformation"},{"value":"D","text":"Romanticism"}],"answer":"B"},{"id":19,"question":"Which historical period is known as the 'Rebirth of Classical Learning' in Europe?","options":[{"value":"A","text":"Enlightenment"},{"value":"B","text":"Renaissance"},{"value":"C","text":"Reformation"},{"value":"D","text":"Modernism"}],"answer":"B"},{"id":20,"question":"Who is known as the Father of Humanism?","options":[{"value":"A","text":"Erasmus"},{"value":"B","text":"Galileo"},{"value":"C","text":"Francesco Petrarch"},{"value":"D","text":"Leonardo da Vinci"}],"answer":"C"},{"id":21,"question":"Which Renaissance scholar was a famous Dutch Humanist?","options":[{"value":"A","text":"Erasmus"},{"value":"B","text":"Petrarch"},{"value":"C","text":"Locke"},{"value":"D","text":"Bacon"}],"answer":"A"},{"id":22,"question":"Which concept emphasizes the importance and freedom of the individual?","options":[{"value":"A","text":"Humanism"},{"value":"B","text":"Secularism"},{"value":"C","text":"Individualism"},{"value":"D","text":"Empiricism"}],"answer":"C"},{"id":23,"question":"What term refers to the separation of religion from social and political life?","options":[{"value":"A","text":"Humanism"},{"value":"B","text":"Secularism"},{"value":"C","text":"Liberalism"},{"value":"D","text":"Rationalism"}],"answer":"B"},{"id":24,"question":"Which philosophical movement emphasizes knowledge through sensory experience?","options":[{"value":"A","text":"Positivism"},{"value":"B","text":"Humanism"},{"value":"C","text":"Rationalism"} ":"Population and structure"},{"value":"C","text":"Social control"},{"value":"D","text":"Social behaviour"}],"answer":"B"},{"id":49,"question":"Sociology helps in:","options":[{"value":"A","text":"Ignoring problems"},{"value":"B","text":"Solving social problems"},{"value":"C","text":"Creating conflicts"},{"value":"D","text":"Avoiding society"}],"answer":"B"},{"id":50,"question":"Sociology uses which method for study?","options":[{"value":"A","text":"Religious method"},{"value":"B","text":"Scientific method"},{"value":"C","text":"Mythological method"},{"value":"D","text":"Philosophical guessing"}],"answer":"B"},{"id":51,"question":"Observation in sociology means:","options":[{"value":"A","text":"Random watching"},{"value":"B","text":"Scientific and systematic watching"},{"value":"C","text":"Guessing facts"},{"value":"D","text":"Imagining reality"}],"answer":"B"},{"id":52,"question":"Experimental method in sociology is:","options":[{"value":"A","text":"Always easy"},{"value":"B","text":"Impossible"},{"value":"C","text":"Difficult to apply strictly"},{"value":"D","text":"Not used"}],"answer":"C"},{"id":53,"question":"Sociology is considered a general science because it studies:","options":[{"value":"A","text":"Only economy"},{"value":"B","text":"Only politics"},{"value":"C","text":"Society as a whole"},{"value":"D","text":"Only culture"}],"answer":"C"},{"id":54,"question":"Alfred Vierkandt belonged to the:","options":[{"value":"A","text":"Synthetic School"},{"value":"B","text":"Historical School"},{"value":"C","text":"Specialistic (Formalistic) School"},{"value":"D","text":"Positivist School"}],"answer":"C"},{"id":55,"question":"Medical Sociology primarily studies:","options":[{"value":"A","text":"Workplaces and industries"},{"value":"B","text":"Health, illness, and healthcare"},{"value":"C","text":"Village life and agriculture"},{"value":"D","text":"Urban development"}],"answer":"B"},{"id":56,"question":"Industrial Sociology originated in:","options":[{"value":"A","text":"USA"},{"value":"B","text":"India"},{"value":"C","text":"Europe"},{"value":"D","text":"Japan"}],"answer":"C"},{"id":57,"question":"Which of the following is NOT an area of Industrial Sociology?","options":[{"value":"A","text":"Industrial organization and structure"},{"value":"B","text":"Social impact of industrialization"},{"value":"C","text":"Rural community life"},{"value":"D","text":"Conflict and cooperation"}],"answer":"C"},{"id":58,"question":"The study of how social factors like poverty, stress, and environment affect health is part of:","options":[{"value":"A","text":"Industrial Sociology"},{"value":"B","text":"Rural Sociology"},{"value":"C","text":"Medical Sociology"},{"value":"D","text":"Urban Sociology"}],"answer":"C"},{"id":59,"question":"Sociological techniques include all of the following EXCEPT:","options":[{"value":"A","text":"Sociogram"},{"value":"B","text":"Sociometry"},{"value":"C","text":"Social Survey"},{"value":"D","text":"Laboratory Experiment"}],"answer":"D"},{"id":60,"question":"Sociology promotes the welfare of marginalized groups such as ________ communities.","options":[{"value":"A","text":"Industrial"},{"value":"B","text":"Urban"},{"value":"C","text":"Tribal"},{"value":"D","text":"Corporate"}],"answer":"C"},{"id":61,"question":"Talcott Parsons' book ________ introduced the concept of the Sick Role.","options":[{"value":"A","text":"The Structure of Social Action"},{"value":"B","text":"The Social System"},{"value":"C","text":"Society and Culture"},{"value":"D","text":"Social Theory"}],"answer":"B"},{"id":72,"question":"Who introduced the concept of Sociological Imagination?","options":[{"value":"A","text":"Karl Marx"},{"value":"B","text":"Max Weber"},{"value":"C","text":"C. Wright Mills"},{"value":"D","text":"Émile Durkheim"}],"answer":"C"},{"id":73,"question":"Sociological Imagination mainly helps to connect:","options":[{"value":"A","text":"Religion and economy"},{"value":"B","text":"Personal troubles and public issues"},{"value":"C", lue":"B","text":"Human social behaviour and society"},{"value":"C","text":"Physical laws"},{"value":"D","text":"Biological systems"}],"answer":"B"},{"id":89,"question":"Which of the following is NOT a characteristic of sociological research?","options":[{"value":"A","text":"Objectivity"},{"value":"B","text":"Empirical basis"},{"value":"C","text":"Personal bias"},{"value":"D","text":"Verifiability"}],"answer":"C"},{"id":90,"question":"Pure research mainly aims at:","options":[{"value":"A","text":"Immediate problem-solving"},{"value":"B","text":"Profit making"},{"value":"C","text":"Knowledge creation"},{"value":"D","text":"Social control"}],"answer":"C"},{"id":91,"question":"Qualitative research deals with:","options":[{"value":"A","text":"Numbers"},{"value":"B","text":"Measurement"},{"value":"C","text":"Qualities and experiences"},{"value":"D","text":"Statistics only"}],"answer":"C"},{"id":92,"question":"The first step in the research process is:","options":[{"value":"A","text":"Data collection"},{"value":"B","text":"Hypothesis formulation"},{"value":"C","text":"Identification of research problem"},{"value":"D","text":"Reporting"}],"answer":"C"},{"id":93,"question":"A hypothesis is:","options":[{"value":"A","text":"Final result"},{"value":"B","text":"Proven fact"},{"value":"C","text":"Tentative statement"},{"value":"D","text":"Random guess"}],"answer":"C"},{"id":94,"question":"The final step in the research process is:","options":[{"value":"A","text":"Hypothesis"},{"value":"B","text":"Data collection"},{"value":"C","text":"Reporting"},{"value":"D","text":"Analysis"}],"answer":"C"},{"id":95,"question":"Ethics refers to:","options":[{"value":"A","text":"Scientific tools"},{"value":"B","text":"Moral principles guiding behavior"},{"value":"C","text":"Data collection methods"},{"value":"D","text":"Statistical analysis"}],"answer":"B"},{"id":96,"question":"Which of the following is an unethical practice?","options":[{"value":"A","text":"Informed consent"},{"value":"B","text":"Confidentiality"},{"value":"C","text":"Fabrication of data"},{"value":"D","text":"Proper identification"}],"answer":"C"},{"id":97,"question":"Anonymity refers to:","options":[{"value":"A","text":"Revealing identity"},{"value":"B","text":"Hiding identity of participants"},{"value":"C","text":"Sharing data publicly"},{"value":"D","text":"Ignoring privacy"}],"answer":"B"},{"id":98,"question":"Plagiarism means:","options":[{"value":"A","text":"Creating new ideas"},{"value":"B","text":"Copying others' work without credit"},{"value":"C","text":"Conducting surveys"},{"value":"D","text":"Analyzing data"}],"answer":"B"},{"id":99,"question":"Who develops research ethics?","options":[{"value":"A","text":"Single researcher"},{"value":"B","text":"Participants"},{"value":"C","text":"Institutions and committees"},{"value":"D","text":"Media"}],"answer":"C"},{"id":100,"question":"Micro Sociology studies individual behaviour in:","options":[{"value":"A","text":"Isolation"},{"value":"B","text":"Large groups only"},{"value":"C","text":"Social interaction"},{"value":"D","text":"Political systems"}],"answer":"C"},{"id":101,"question":"Which of the following is a key feature of Micro Sociology?","options":[{"value":"A","text":"Study of large populations"},{"value":"B","text":"Focus on institutions"},{"value":"C","text":"Focus on small-scale interactions"},{"value":"D","text":"Use of only statistical data"}],"answer":"C"},{"id":102,"question":"The word 'Micro' means:","options":[{"value":"A","text":"Large"},{"value":"B","text":"Complex"},{"value":"C","text":"Small"},{"value":"D","text":"Universal"}],"answer":"C"},{"id":103,"question":"The term 'Level of Analysis' in Sociology refers to:","options":[{"value":"A","text":"Type of research method"},{"value":"B","text":"Scale or scope of study"},{"value":"C","text":"Nature of data collection"},{"value":"D","text":"Type of society"}],"answer":"B"},{"id":104,"question":"Who is regarded as the founder of Symbolic Interactionism?","options":[{"value":"A","text":"Herbert Blumer"},{"value":"B","text":"George Herbert Mead"},{"value":"C","text":"Harold Garfinkel"},{"value":"D","text":"Alfred Schutz"}],"answer":"B"},{"id":105,"question":"Symbolic Interactionism mainly focuses on:","options":[{"value":"A","text":"Large-scale social structures"},{"value":"B","text":"Economic systems"},{"value":"C","text":"Daily interactions and meanings"},{"value":"D","text":"Political institutions"}],"answer":"C"},{"id":106,"question":"Who is the founder of Ethnomethodology?","options":[{"value":"A","text":"George C. Homans"},{"value":"B","text":"Harold Garfinkel"},{"value":"C","text":"Alfred Schutz"},{"value":"D","text":"Herbert Blumer"}],"answer":"B"},{"id":107,"question":"Who developed Exchange Theory?","options":[{"value":"A","text":"Harold Garfinkel"},{"value":"B","text":"George C. Homans"},{"value":"C","text":"Alfred Schutz"},{"value":"D","text":"Charles Horton Cooley"}],"answer":"B"},{"id":62,"question":"Sociology is considered a general social science because it:","options":[{"value":"A","text":"Studies only politics"},{"value":"B","text":"Studies society as a whole"},{"value":"C","text":"Focuses only on economy"},{"value":"D","text":"Studies only history"}],"answer":"B"},{"id":63,"question":"Political Science mainly studies:","options":[{"value":"A","text":"Social relationships"},{"value":"B","text":"Cultural values"},{"value":"C","text":"Formal political institutions"},{"value":"D","text":"Family systems"}],"answer":"C"},{"id":64,"question":"Which of the following is studied by Political Science?","options":[{"value":"A","text":"Kinship"},{"value":"B","text":"Electoral systems"},{"value":"C","text":"Social norms"},{"value":"D","text":"Rituals"}],"answer":"B"},{"id":65,"question":"Economics is mainly concerned with:","options":[{"value":"A","text":"Religion"},{"value":"B","text":"Production, distribution, and consumption"},{"value":"C","text":"Social norms"},{"value":"D","text":"Political institutions"}],"answer":"B"},{"id":66,"question":"Sociology studies economic life in relation to:","options":[{"value":"A","text":"Weather"},{"value":"B","text":"Social factors"},{"value":"C","text":"Biology"},{"value":"D","text":"Geography"}],"answer":"B"},{"id":67,"question":"Sociology studies economic behavior in relation to:","options":[{"value":"A","text":"Culture and values"},{"value":"B","text":"Only money"},{"value":"C","text":"Only markets"},{"value":"D","text":"Only production"}],"answer":"A"},{"id":68,"question":"History mainly studies:","options":[{"value":"A","text":"Future events"},{"value":"B","text":"Past events"},{"value":"C","text":"Social patterns only"},{"value":"D","text":"Economic theories"}],"answer":"B"},{"id":69,"question":"Sociology is concerned with:","options":[{"value":"A","text":"Unique events only"},{"value":"B","text":"General patterns and processes"},{"value":"C","text":"Only past records"},{"value":"D","text":"Only political systems"}],"answer":"B"},{"id":70,"question":"Anthropology studies:","options":[{"value":"A","text":"Only economy"},{"value":"B","text":"Only politics"},{"value":"C","text":"Total way of life"},{"value":"D","text":"Only religion"}],"answer":"C"},{"id":71,"question":"Thinking sociologically is closely related to common sense because both deal with:","options":[{"value":"A","text":"Scientific experiments"},{"value":"B","text":"Everyday social life"},{"value":"C","text":"Political systems"},{"value":"D","text":"Historical events"}],"answer":"B"}],N=50,MIN=30,API="https://ba-sociology-results.faiz0812.workers.dev";let test=[],i=0,a={},sec=MIN*60,timer,student={};const $=x=>document.getElementById(x);
function sh(x){x=[...x];for(let j=x.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[x[j],x[k]]=[x[k],x[j]]}return x}
function show(x){['start','test','result'].forEach(y=>$(y).classList.add('hidden'));$(x).classList.remove('hidden')}
function start(){let n=$('name').value.trim();if(!n){$('msg').textContent='Please enter Student Name.';return}student={name:n};test=sh(QUESTIONS).slice(0,N);a={};i=0;sec=MIN*60;show('test');render();clearInterval(timer);timer=setInterval(tick,1000);tick()}
function tick(){sec=Math.max(0,sec-1);$('timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(!sec){clearInterval(timer);submitTest(true)}}
function render(){let questionIndex=i;let q=test[i];$('counter').textContent='Question '+(i+1)+' of '+N;$('q').textContent=q.question;$('opts').innerHTML=q.options.map(o=>'<label class="opt"><input type="radio" name="a" value="'+o.value+'" '+(a[i]===o.value?'checked':'')+'> '+o.value+') '+o.text+'</label>').join('');if(a[questionIndex])lockAnswerOptions('#opts');document.querySelectorAll('input[name=a]').forEach(x=>x.onchange=()=>{if(a[questionIndex]){x.checked=x.value===a[questionIndex];lockAnswerOptions('#opts');return}a[questionIndex]=x.value;lockAnswerOptions('#opts');paintAnswerFeedback(q,'#opts',x.value);nav()});$('prev').disabled=!i;$('next').classList.toggle('hidden',i===N-1);nav()}
function nav(){let n=$('nav');n.innerHTML='';test.forEach((_,j)=>{let b=document.createElement('button');b.textContent=j+1;b.className=(a[j]?'answered ':'')+(j===i?'current':'');b.onclick=()=>{i=j;render()};n.appendChild(b)})}
function submitTest(auto){try{clearInterval(timer);let c=0,w=0,u=0;test.forEach((q,j)=>{if(!a[j])u++;else if(a[j]===q.answer)c++;else w++});student.score=c;student.wrong=w;student.unanswered=u;student.pct=c/N*100;student.status=student.pct>=40?'PASS':'NEEDS IMPROVEMENT';showResult(auto);fetch(API+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:student.name,reg:'',subject:'Sociology Mock Test mod-1,2',score:c,total:N,percentage:Number(student.pct.toFixed(1)),wrong:w,unanswered:u,status:student.status,autoSubmitted:auto,submittedAt:new Date().toISOString()}),keepalive:true}).catch(()=>{});}catch(e){show('result');$('rn').textContent=student.name||'';$('score').textContent='Error';$('expired').textContent='Could not calculate result: '+e.message;}}
function showResult(auto){$('rn').textContent=student.name;$('score').textContent=student.score+' / '+N;$('cor').textContent=student.score;$('wr').textContent=student.wrong;$('ua').textContent=student.unanswered;$('st').textContent=student.status;$('expired').textContent=auto?'Time expired — the test was submitted automatically.':'';let r='';test.forEach((q,j)=>{let co=q.options.find(o=>o.value===q.answer);r+='<div><b>Q'+(j+1)+'. '+q.question+'</b><br>Your answer: '+(a[j]||'Not answered')+'<br>Correct answer: '+q.answer+') '+co.text+'</div>'});$('rev').innerHTML=r}
$('startBtn').onclick=start;$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(i<N-1){i++;render()}};$('submit').onclick=()=>submitTest(false);window.submitTest=submitTest;

function lockAnswerOptions(selector){const box=document.querySelector(selector);if(!box)return;box.querySelectorAll('input[type="radio"]').forEach(input=>input.disabled=true);box.querySelectorAll('.opt,.option').forEach(label=>label.classList.add('locked'));}
function paintAnswerFeedback(q,selector,selected){const box=document.querySelector(selector);if(!box)return;box.querySelectorAll('.opt,.option').forEach(label=>label.classList.remove('correct-reveal'));if(!selected||selected===q.answer)return;box.querySelectorAll('input[type="radio"]').forEach(input=>{if(input.value===q.answer){const label=input.closest('.opt,.option');if(label)label.classList.add('correct-reveal');}});}
</script></body></html>
