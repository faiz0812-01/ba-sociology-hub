eview-line"><span>Your answer</span><b>'+esc(your+') '+yourOpt.text)+'</b></div><div class="review-line"><b style="color:#16a34a;font-size:18px">✓ Your answer is correct</b></div>':'<div class="review-line"><span>Your answer</span><b>'+esc(your==='Not answered'?'Not answered':your+') '+yourOpt.text)+'</b></div><div class="review-line"><span>Correct answer</span><b>'+q.answer+') '+co.text+'</b></div><div class="result-badge">'+res+'</div>')+'</div>'});$('review').innerHTML=h;screen('result');window.scrollTo({top:0,behavior:'smooth'})}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function saveReport(){let rows=test.map((q,i)=>{let your=answers[i]||'Not answered',yourOpt=q.options.find(o=>o.value===your),co=q.options.find(o=>o.value===q.answer),res=your===q.answer?'Correct':your==='Not answered'?'Unanswered':'Wrong';return '<tr><td>'+(i+1)+'</td><td>'+esc(q.question)+'</td><td>'+esc(your==='Not answered'?'Not answered':your+') '+yourOpt.text)+'</td><td>'+esc(q.answer+') '+co.text)+'</td><td>'+res+'</td></tr>'}).join('');let html='<!doctype html><html><body><h1>Malayalam MCQ Test – Final Report</h1><p><b>Student Name :</b> '+esc(studentName)+'</p><p><b>Score:</b> '+$('score').textContent+' | <b>Percentage:</b> '+$('pct').textContent+' | <b>Status:</b> '+$('status').textContent+'</p><table border="1" cellpadding="7"><tr><th>No.</th><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th></tr>'+rows+'</table></body></html>';let blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Malayalam_Final_Report.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function finish(){clearInterval(interval);submitted=false;test=[];answers={};pos=0;studentName='';$('name').value='';screen('start');setGreeting()}setGreeting();$('startBtn').onclick=startTest;$('prev').onclick=()=>{if(pos> function lockAnswerOptions(selector){const box=document.querySelector(selector);if(!box)return;box.querySelectorAll('input[type="radio"]').forEach(input=>input.disabled=true);box.querySelectorAll('.opt,.option').forEach(label=>label.classList.add('locked'));}
function paintAnswerFeedback(q,selector,selected){const box=document.querySelector(selector);if(!box)return;box.querySelectorAll('.opt,.option').forEach(label=>label.classList.remove('correct-reveal'));if(!selected||selected===q.answer)return;box.querySelectorAll('input[type="radio"]').forEach(input=>{if(input.value===q.answer){const label=input.closest('.opt,.option');if(label)label.classList.add('correct-reveal');}});}
