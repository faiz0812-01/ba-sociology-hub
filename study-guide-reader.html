<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Study Guide Reader · Academic Hub</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eee9;color:#173f35;font:14px/1.5 system-ui,sans-serif}
.toolbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:10px;background:#f8faf7;border-bottom:1px solid #d6dfd5}
button,input,select{font:inherit;color:inherit;background:white;border:1px solid #bdccbd;border-radius:8px;padding:7px 10px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b79e48;outline-offset:2px}input{width:62px}#pages{white-space:nowrap}
main{padding:16px;overflow:auto;text-align:center}canvas{display:block;margin:0 auto;background:white;box-shadow:0 3px 14px #173f3518;max-width:none}#status{margin:0;padding:8px 16px;text-align:center;background:#f8faf7}#text{max-width:850px;margin:0 auto;padding:24px;background:white;text-align:left;white-space:pre-wrap;font-size:18px;line-height:1.8}[hidden]{display:none!important}
</style></head><body>
<nav class="toolbar" aria-label="Reading controls">
<button id="prev" disabled aria-label="Previous page">← Previous</button>
<label>Page <input id="page" type="number" min="1" value="1" disabled></label><span id="pages">of …</span>
<button id="next" disabled aria-label="Next page">Next →</button>
<label>Zoom <select id="zoom" disabled><option value="fit">Fit width</option><option value=".75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label>
<button id="mode" disabled aria-pressed="false">Text view</button>
</nav><p id="status" role="status" aria-live="polite">Loading study guide…</p>
<main id="reader"><canvas id="canvas" role="img" aria-label="Study guide page" hidden></canvas><div id="text" hidden></div></main>
<script type="module">
const el=id=>document.getElementById(id);
let pdf,pageNumber=1,busy=false,pending=false,textMode=false;
const canvas=el('canvas'),context=canvas.getContext('2d');
function controls(){el('prev').disabled=!pdf||pageNumber===1;el('next').disabled=!pdf||pageNumber===pdf.numPages;el('page').disabled=!pdf;el('zoom').disabled=!pdf||textMode;el('mode').disabled=!pdf;el('page').value=pageNumber;el('pages').textContent='of '+(pdf?pdf.numPages:'…');}
async function render(){
 if(!pdf)return;if(busy){pending=true;return;}busy=true;controls();el('status').textContent='Loading page '+pageNumber+'…';
 try{
 const current=pageNumber,page=await pdf.getPage(current);
 if(textMode){const content=await page.getTextContent();el('text').textContent=content.items.map(item=>item.str+(item.hasEOL?'\n':' ')).join('');el('text').hidden=false;canvas.hidden=true;}
 else{const original=page.getViewport({scale:1});const scale=el('zoom').value==='fit'?Math.max(.25,Math.min(2,(el('reader').clientWidth-32)/original.width)):Number(el('zoom').value);const viewport=page.getViewport({scale});const ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.floor(viewport.width*ratio);canvas.height=Math.floor(viewport.height*ratio);canvas.style.width=viewport.width+'px';canvas.style.height=viewport.height+'px';await page.render({canvasContext:context,viewport,transform:ratio!==1?[ratio,0,0,ratio,0,0]:null}).promise;canvas.setAttribute('aria-label','Study guide page '+current+' of '+pdf.numPages);canvas.hidden=false;el('text').hidden=true;}
 el('status').textContent='Page '+current+' of '+pdf.numPages;
 }catch(error){el('status').textContent='This page could not be displayed. Choose another page or refresh the reader.';}
 finally{busy=false;if(pending){pending=false;render();}}
}
function go(number){if(!pdf)return;pageNumber=Math.max(1,Math.min(pdf.numPages,Math.round(Number(number)||1)));render();}
el('prev').onclick=()=>go(pageNumber-1);el('next').onclick=()=>go(pageNumber+1);el('page').onchange=event=>go(event.target.value);el('zoom').onchange=render;
el('mode').onclick=()=>{textMode=!textMode;el('mode').textContent=textMode?'Page view':'Text view';el('mode').setAttribute('aria-pressed',String(textMode));render();};
document.addEventListener('keydown',event=>{if(/INPUT|SELECT/.test(event.target.tagName))return;if(event.key==='ArrowRight')go(pageNumber+1);if(event.key==='ArrowLeft')go(pageNumber-1);});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(el('zoom').value==='fit')render();},200);});
try{
 const file=new URL(new URLSearchParams(location.search).get('file')||'',location.origin+'/');
 if(file.origin!==location.origin||!file.pathname.toLowerCase().endsWith('.pdf'))throw Error('Invalid PDF');
 const lib=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs');
 lib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs';
 pdf=await lib.getDocument({url:file.href,isEvalSupported:false}).promise;
 el('page').max=pdf.numPages;controls();await render();
}catch(error){el('status').textContent='Could not load the study guide. Refresh this reader to try again.';}
</script></body></html>
