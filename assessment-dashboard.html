<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Assessment Dashboard</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap");
*{box-sizing:border-box}body{font-family:Poppins,Segoe UI,Arial,sans-serif;margin:0;background:linear-gradient(135deg,#eef2ff,#f5f3ff 45%,#ecfeff);color:#172554}.wrap{max-width:1200px;margin:auto;padding:22px}.card{background:rgba(255,255,255,.94);border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(30,41,100,.12);margin-bottom:18px;border:1px solid rgba(99,102,241,.12)}h1{color:#312e81;letter-spacing:.2px}input{padding:12px;border-radius:10px;border:1px solid #c7d2fe;font-family:inherit}button{padding:12px 18px;border-radius:10px;border:0;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;font-family:inherit;font-weight:700;cursor:pointer}button:hover{opacity:.92}table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}th,td{padding:11px;text-align:left;border-bottom:1px solid #e5e7eb}th{background:#eef2ff;color:#3730a3;font-weight:700}tr:hover td{background:#f8faff}.scroll{overflow:auto}.stat{display:inline-block;margin-right:24px;font-weight:700;color:#3730a3}.danger{color:#b91c1c}</style></head>
<body><div class="wrap">
<div class="card"><h1>📊 Teacher Assessment Dashboard</h1>
<p>Private dashboard for assessment submissions.</p>
<input id="api" value="https://ba-sociology-results.faiz0812.workers.dev" style="width:100%;box-sizing:border-box">
<input id="token" type="password" placeholder="Admin token" style="width:100%;box-sizing:border-box;margin-top:8px">
<button type="button" onclick="load()" style="margin-top:8px">Load Results</button>
<span id="msg"></span></div>
<div class="card" id="summary"></div>
<div class="card scroll"><table><thead><tr><th>Name</th><th>Subject</th><th>Score</th><th>%</th><th>Status</th><th>Time</th><th>IP</th><th>Country</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<script>
async function load(){
 const api=document.getElementById("api").value.replace(/\/$/,""), token=document.getElementById("token").value, msg=document.getElementById("msg");
 if(!api||!token){msg.textContent=" Enter Worker URL and admin token.";return}
 msg.textContent=" Loading...";
 try{
  const r=await fetch(api+"/results",{headers:{Authorization:"Bearer "+token}});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const data=await r.json(), rows=data.results||[];
  document.getElementById("rows").innerHTML=rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.subject)}</td><td>${x.score}/${x.total}</td><td>${x.percentage}%</td><td>${esc(x.status)}</td><td>${new Date(x.submitted_at).toLocaleString()}</td><td>${esc(x.ip_address||"")}</td><td>${esc(x.country||"Unknown")}</td></tr>`).join("");
  document.getElementById("summary").innerHTML=`<span class="stat">Submissions: ${rows.length}</span><span class="stat">Pass: ${rows.filter(x=>x.status==="PASS").length}</span>`;
  msg.textContent=" Loaded.";
 }catch(e){msg.textContent=" Error: "+e.message}
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
</script></body></html>
