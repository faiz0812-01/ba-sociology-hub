<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Assessment Dashboard</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#17202a}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:white;border-radius:14px;padding:18px;box-shadow:0 5px 20px #0001;margin-bottom:16px}input,button{padding:11px;border-radius:8px;border:1px solid #ccd5e1}button{background:#2563eb;color:white;border:0;font-weight:700}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}th{background:#f8fafc}.scroll{overflow:auto}.stat{display:inline-block;margin-right:20px;font-weight:700}.danger{color:#b91c1c}</style></head>
<body><div class="wrap">
<div class="card"><h1>📊 Teacher Assessment Dashboard</h1>
<p>Private dashboard for assessment submissions.</p>
<input id="api" value="https://ba-sociology-results.faiz0812.workers.dev" style="width:100%;box-sizing:border-box">
<input id="token" type="password" placeholder="Admin token" style="width:100%;box-sizing:border-box;margin-top:8px">
<button type="button" onclick="load()" style="margin-top:8px">Load Results</button>
<span id="msg"></span></div>
<div class="card" id="summary"></div>
<div class="card scroll"><table><thead><tr><th>Name</th><th>Register</th><th>Subject</th><th>Score</th><th>%</th><th>Status</th><th>Time</th><th>IP</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<script>
async function load(){
 const api=document.getElementById("api").value.replace(/\/$/,""), token=document.getElementById("token").value, msg=document.getElementById("msg");
 if(!api||!token){msg.textContent=" Enter Worker URL and admin token.";return}
 msg.textContent=" Loading...";
 try{
  const r=await fetch(api+"/results",{headers:{Authorization:"Bearer "+token}});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const data=await r.json(), rows=data.results||[];
  document.getElementById("rows").innerHTML=rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.reg)}</td><td>${esc(x.subject)}</td><td>${x.score}/${x.total}</td><td>${x.percentage}%</td><td>${esc(x.status)}</td><td>${new Date(x.submitted_at).toLocaleString()}</td><td>${esc(x.ip_address||"")}</td></tr>`).join("");
  document.getElementById("summary").innerHTML=`<span class="stat">Submissions: ${rows.length}</span><span class="stat">Pass: ${rows.filter(x=>x.status==="PASS").length}</span>`;
  msg.textContent=" Loaded.";
 }catch(e){msg.textContent=" Error: "+e.message}
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
</script></body></html>
