<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Assessment Dashboard</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap");
*{box-sizing:border-box}body{font-family:Poppins,Segoe UI,Arial,sans-serif;margin:0;background:linear-gradient(135deg,#eef2ff,#f5f3ff 45%,#ecfeff);color:#172554}.wrap{max-width:1200px;margin:auto;padding:22px}.card{background:rgba(255,255,255,.94);border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(30,41,100,.12);margin-bottom:18px;border:1px solid rgba(99,102,241,.12)}h1{color:#312e81;letter-spacing:.2px}input{padding:12px;border-radius:10px;border:1px solid #c7d2fe;font-family:inherit}button{padding:12px 18px;border-radius:10px;border:0;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;font-family:inherit;font-weight:700;cursor:pointer}button:hover{opacity:.92}table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}th,td{padding:11px;text-align:left;border-bottom:1px solid #e5e7eb;vertical-align:top}th{background:#eef2ff;color:#3730a3;font-weight:700;position:sticky;top:0;z-index:1}tr:hover td{background:#f8faff}.scroll{overflow:auto}.stat{display:inline-block;margin-right:24px;font-weight:700;color:#3730a3}.danger{color:#b91c1c}.country-cell{font-weight:700;white-space:nowrap}.flag{font-size:24px;vertical-align:middle;margin-right:7px}.ip{font-family:Consolas,monospace;font-size:13px}.details{color:#64748b;font-size:12px;line-height:1.5;max-width:300px;word-break:break-word}.details b{color:#334155}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#e0e7ff;color:#3730a3}.legend{margin-top:12px;color:#64748b;font-size:13px}</style></head>
<body><div class="wrap">
<div class="card"><h1>📊 Teacher Assessment Dashboard</h1>
<p>Private dashboard for assessment submissions.</p>
<input id="api" value="https://ba-sociology-results.faiz0812.workers.dev" style="width:100%;box-sizing:border-box">
<input id="token" type="password" placeholder="Admin token" style="width:100%;box-sizing:border-box;margin-top:8px">
<button type="button" onclick="load()" style="margin-top:8px">Load Results</button>
<span id="msg"></span></div>
<div class="card" id="summary"></div>
<div class="card scroll"><table><thead><tr><th>Name</th><th>Subject</th><th>Score</th><th>%</th><th>Status</th><th>Time</th><th>IP Address</th><th>Country</th><th>Device / Browser Details</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<script>
async function load(){
 const api=document.getElementById("api").value.replace(/\/$/,""), token=document.getElementById("token").value, msg=document.getElementById("msg");
 if(!api||!token){msg.textContent=" Enter Worker URL and admin token.";return}
 msg.textContent=" Loading...";
 try{
  const r=await fetch(api+"/results",{headers:{Authorization:"Bearer "+token}});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const data=await r.json(), rows=data.results||[];
  document.getElementById("rows").innerHTML=rows.map(x=>{const cc=String(x.country||"").toUpperCase();const flag=countryFlag(cc);const countryName=countryNameFromCode(cc);return \`<tr><td><b>\${esc(x.name)}</b><br><span class="badge">\${esc(x.reg||"N/A")}</span></td><td>\${esc(x.subject)}</td><td><b>\${x.score}/\${x.total}</b><br><span class="details">Wrong: \${x.wrong} · Unanswered: \${x.unanswered}</span></td><td>\${x.percentage}%</td><td>\${esc(x.status)}</td><td>\${new Date(x.submitted_at).toLocaleString()}</td><td><span class="ip">\${esc(x.ip_address||"Unknown")}</span></td><td class="country-cell"><span class="flag">\${flag}</span>\${esc(countryName)}<br><span class="details">\${esc(cc||"Unknown")}</span></td><td class="details"><b>User Agent:</b><br>\${esc(x.user_agent||"Not available")}</td></tr>\`}).join("");
  document.getElementById("summary").innerHTML=`<span class="stat">Submissions: ${rows.length}</span><span class="stat">Pass: ${rows.filter(x=>x.status==="PASS").length}</span>`;
  msg.textContent=" Loaded.";
 }catch(e){msg.textContent=" Error: "+e.message}
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function countryFlag(code){if(!/^[A-Z]{2}$/.test(code))return "🌐";return String.fromCodePoint(...[...code].map(ch=>127397+ch.charCodeAt(0)))}
function countryNameFromCode(code){if(!/^[A-Z]{2}$/.test(code))return "Unknown";try{return new Intl.DisplayNames(["en"],{type:"region"}).of(code)||code}catch{return code}}
</script></body></html>
