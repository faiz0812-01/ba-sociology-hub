<script>
const QUESTIONS=[{"id":1,"question":"Who authored the article “Minds, Brains and Programs”?","options":[{"value":"A","text":"Claude Shannon"},{"value":"B","text":"John Searle"},{"value":"C","text":"Alan M. Turing"},{"value":"D","text":"Alonzo Church"}],"answer":"B"},{"id":2,"question":"Who was the first to use the human terminology “memory” when referring to a computer?","options":[{"value":"A","text":"John von Neumann"},{"value":"B","text":"Claude Shannon"},{"value":"C","text":"Alonzo Church"},{"value":"D","text":"Alan M. Turing"}],"answer":"A"},{"id":3,"question":"Who is considered the founder of information theory?","options":[{"value":"A","text":"Claude Shannon"},{"value":"B","text":"Alan M. Turing"},{"value":"C","text":"Alonzo Church"},{"value":"D","text":"John von Neumann"}],"answer":"A"},{"id":4,"question":"Who is the author of the notable research entitled “Intelligent Machinery”?","options":[{"value":"A","text":"Claude Shannon"},{"value":"B","text":"Alan M. Turing"},{"value":"C","text":"Alonzo Church"},{"value":"D","text":"John von Neumann"}],"answer":"B"},{"id":5,"question":"What is the philosophical discipline that examines the nature, origins, boundaries, and legitimacy of knowledge?","options":[{"value":"A","text":"Epistemology"},{"value":"B","text":"Truth"},{"value":"C","text":"Correspondence"},{"value":"D","text":"Justification"}],"answer":"A"},{"id":6,"question":"What constitutes the fundamental basis of knowledge in philosophy and epistemology?","options":[{"value":"A","text":"Epistemology"},{"value":"B","text":"Truth"},{"value":"C","text":"Correspondence"},{"value":"D","text":"Justification"}],"answer":"B"},{"id":7,"question":"Which theory posits that truth is that which accurately represents or corresponds to objective reality?","options":[{"value":"A","text":"Epistemology "},{"value":"B","text":"Truth"},{"value":"C","text":"Correspondence"},{"value":"D","text":"Justification"}],"answer":"C"},{"id":8,"question":"What concerns the reason or evidence that supports a belief?","options":[{"value":"A","text":"Epistemology"},{"value":"B","text":"Truth"},{"value":"C","text":"Correspondence"},{"value":"D","text":"Justification"}],"answer":"D"},{"id":9,"question":"What is the subfield of ethics that focuses on the practical application of ethical concepts?","options":[{"value":"A","text":"Truth"},{"value":"B","text":"Correspondence"},{"value":"C","text":"Justification"},{"value":"D","text":"Applied ethics Module 2 — AI Paradigms, the Turing Test & Cartesian Dualism"}],"answer":"D"},{"id":10,"question":"During which decade was the classical model of artificial intelligence (AI) developed?","options":[{"value":"A","text":"1950s"},{"value":"B","text":"1920s"},{"value":"C","text":"1930s"},{"value":"D","text":"1910s"}],"answer":"A"},{"id":11,"question":"Symbolic AI or rule-based AI was also known as what?","options":[{"value":"A","text":"Postmodern AI"},{"value":"B","text":"Modern universal AI"},{"value":"C","text":"GOFAI (Good Old-Fashioned AI) / Classical Model"},{"value":"D","text":"Cybernetics"}],"answer":"C"},{"id":12,"question":"What does PSSH stand for?","options":[{"value":"A","text":"Physical Symbol System Hypothesis"},{"value":"B","text":"Physical System Symbol Hypothesis"},{"value":"C","text":"Philosophical System Symbol Hypothesis"},{"value":"D","text":"Physiological System Symbol Hypothesis"}],"answer":"A"},{"id":13,"question":"Which language became important for Symbolic AI research?","options":[{"value":"A","text":"BASIC"},{"value":"B","text":"FORTRAN"},{"value":"C","text":"LISP"},{"value":"D","text":"HTML"}],"answer":"C"},{"id":14,"question":"In Symbolic AI, problem-solving is often described as:","options":[{"value":"A","text":"Dreaming "},{"value":"B","text":"Searching a state space"},{"value":"C","text":"Sleeping"},{"value":"D","text":"Forgetting"}],"answer":"B"},{"id":15,"question":"Which early AI program is a classic example of cognitive simulation?","options":[{"value":"A","text":"MYCIN"},{"value":"B","text":"General Problem Solver (GPS)"},{"value":"C","text":"AlphaGo"},{"value":"D","text":"ELIZA"}],"answer":"B"},{"id":16,"question":"In cognitive simulation, intelligence is achieved by:","options":[{"value":"A","text":"Faster processors"},{"value":"B","text":"Modeling internal mental representations"},{"value":"C","text":"Avoiding symbolic reasoning"},{"value":"D","text":"Random trial and error"}],"answer":"B"},{"id":17,"question":"Expert systems are examples of:","options":[{"value":"A","text":"Symbolic AI"},{"value":"B","text":"Robotics"},{"value":"C","text":"Neural AI"},{"value":"D","text":"Genetic AI"}],"answer":"A"},{"id":18,"question":"Who were major contributors to the cognitive simulation approach?","options":[{"value":"A","text":"Descartes and Kant"},{"value":"B","text":"Newell and Simon"},{"value":"C","text":"McCarthy and Minsky"},{"value":"D","text":"Turing and Church"}],"answer":"B"},{"id":19,"question":"John McCarthy is associated with the development of:","options":[{"value":"A","text":"Psychoanalysis"},{"value":"B","text":"Symbolic AI"},{"value":"C","text":"Behaviorism"},{"value":"D","text":"Quantum theory"}],"answer":"B"},{"id":20,"question":"The Turing Test was proposed by:","options":[{"value":"A","text":"John McCarthy"},{"value":"B","text":"Alan Turing"},{"value":"C","text":"Marvin Minsky"},{"value":"D","text":"Norbert Wiener"}],"answer":"B"},{"id":21,"question":"The Turing Test was introduced in Turing’s 1950 paper titled:","options":[{"value":"A","text":"Computing Machinery and Intelligence"},{"value":"B","text":"Mind and Machines"},{"value":"C","text":"Intelligent Systems"},{"value":"D","text":"Artificial Minds "}],"answer":"A"},{"id":22,"question":"In the Turing Test, a machine is considered intelligent if it:","options":[{"value":"A","text":"Solves mathematical problems"},{"value":"B","text":"Thinks like a human brain"},{"value":"C","text":"Can imitate human responses convincingly"},{"value":"D","text":"Has consciousness"}],"answer":"C"},{"id":23,"question":"The primary focus of the Turing Test is on:","options":[{"value":"A","text":"Internal structure"},{"value":"B","text":"External behavior"},{"value":"C","text":"Emotions"},{"value":"D","text":"Biological similarity"}],"answer":"B"},{"id":24,"question":"According to Turing, if a machine passes the test, we should say it:","options":[{"value":"A","text":"Is human"},{"value":"B","text":"Is conscious"},{"value":"C","text":"Can think"},{"value":"D","text":"Is alive"}],"answer":"C"},{"id":25,"question":"A major criticism of the Turing Test is that it:","options":[{"value":"A","text":"Ignores behavior"},{"value":"B","text":"Measures understanding"},{"value":"C","text":"Confuses imitation with real intelligence"},{"value":"D","text":"Requires embodiment"}],"answer":"C"},{"id":26,"question":"The Chinese Room argument was proposed by:","options":[{"value":"A","text":"Alan Turing"},{"value":"B","text":"John Searle"},{"value":"C","text":"Hilary Putnam"},{"value":"D","text":"Marvin Minsky"}],"answer":"B"},{"id":27,"question":"The Chinese Room thought experiment was designed to challenge:","options":[{"value":"A","text":"Weak AI"},{"value":"B","text":"Functionalism"},{"value":"C","text":"Strong AI"},{"value":"D","text":"Behaviorism"}],"answer":"C"},{"id":28,"question":"In the Chinese Room, the person inside the room is manipulating:","options":[{"value":"A","text":"Electrical circuits"},{"value":"B","text":"Meanings"},{"value":"C","text":"Symbols according to rules"},{"value":"D","text":"Neural signals"}],"answer":"C"},{"id":29,"question":"Which test is indirectly criticized by the Chinese Room argument?","options":[{"value":"A","text":"IQ Test"},{"value":"B","text":"Turing Test"},{"value":"C","text":"CAPTCHA "},{"value":"D","text":"SAT"}],"answer":"B"},{"id":30,"question":"Searle’s argument distinguishes between:","options":[{"value":"A","text":"Syntax and semantics"},{"value":"B","text":"Hardware and software"},{"value":"C","text":"Mind and body"},{"value":"D","text":"Input and output"}],"answer":"A"},{"id":31,"question":"Who is generally referred to as the Father of Modern Philosophy?","options":[{"value":"A","text":"René Descartes"},{"value":"B","text":"Alan Turing"},{"value":"C","text":"John Searle"},{"value":"D","text":"Plato"}],"answer":"A"},{"id":32,"question":"Descartes begins his philosophy with a method of:","options":[{"value":"A","text":"Faith"},{"value":"B","text":"Observation"},{"value":"C","text":"Systematic / Radical doubt"},{"value":"D","text":"Experiment"}],"answer":"C"},{"id":33,"question":"Descartes' famous statement *Cogito, ergo sum* means:","options":[{"value":"A","text":"I doubt, therefore God exists"},{"value":"B","text":"I think, therefore I am"},{"value":"C","text":"I feel, therefore I exist"},{"value":"D","text":"I exist, therefore I think"}],"answer":"B"},{"id":34,"question":"According to Descartes, the essence of the mind is:","options":[{"value":"A","text":"Extension"},{"value":"B","text":"Thought"},{"value":"C","text":"Motion"},{"value":"D","text":"Sensation"}],"answer":"B"},{"id":35,"question":"According to Descartes, the idea of God is the idea of:","options":[{"value":"A","text":"A powerful angel"},{"value":"B","text":"An infinite and perfect being"},{"value":"C","text":"Nature"},{"value":"D","text":"Human reason"}],"answer":"B"},{"id":36,"question":"Descartes uses the conceivability argument to show that:","options":[{"value":"A","text":"Mind and body are identical"},{"value":"B","text":"Mind and body are distinct"},{"value":"C","text":"Only the body exists"},{"value":"D","text":"Knowledge is impossible"}],"answer":"B"},{"id":37,"question":"Descartes believes he can clearly conceive of himself as:","options":[{"value":"A","text":"A machine "},{"value":"B","text":"A body without a mind"},{"value":"C","text":"A thinking thing without a body"},{"value":"D","text":"Pure matter"}],"answer":"C"},{"id":38,"question":"The conceivability argument claims that if two things can be clearly conceived apart, then they:","options":[{"value":"A","text":"Must be illusions"},{"value":"B","text":"Are logically contradictory"},{"value":"C","text":"Can exist separately"},{"value":"D","text":"Are material"}],"answer":"C"},{"id":39,"question":"The divisibility argument concludes that because bodies are divisible and minds are not, they are:","options":[{"value":"A","text":"The same substance"},{"value":"B","text":"Completely unrelated"},{"value":"C","text":"Distinct substances"},{"value":"D","text":"Imaginary"}],"answer":"C"},{"id":40,"question":"In the divisibility argument, Descartes claims that cutting the body:","options":[{"value":"A","text":"Destroys the mind"},{"value":"B","text":"Divides consciousness into pieces"},{"value":"C","text":"Does not divide the mind"},{"value":"D","text":"Proves materialism"}],"answer":"C"},{"id":41,"question":"Descartes’ view that mind and body are two different substances is called:","options":[{"value":"A","text":"Monism"},{"value":"B","text":"Dualism"},{"value":"C","text":"Functionalism"},{"value":"D","text":"Eliminativism"}],"answer":"B"},{"id":42,"question":"In Descartes’ philosophy, mental states are known with:","options":[{"value":"A","text":"Probability"},{"value":"B","text":"Confusion"},{"value":"C","text":"Absolute certainty"},{"value":"D","text":"Scientific testing Module 3 — Theories of Knowledge & Philosophy of Mind"}],"answer":"C"},{"id":43,"question":"In Indian philosophy, the sources of valid knowledge are called:","options":[{"value":"A","text":"Dharma"},{"value":"B","text":"Pramāṇa"},{"value":"C","text":"Karma"},{"value":"D","text":"Mokṣa"}],"answer":"B"},{"id":44,"question":"Which of the following is accepted as a Pramāṇa by almost all Indian philosophical schools?","options":[{"value":"A","text":"Arthāpatti"},{"value":"B","text":"Anupalabdhi"},{"value":"C","text":"Pratyakṣa (Perception)"},{"value":"D","text":"Śabda"}],"answer":"C"},{"id":45,"question":"Which Pramāṇa refers to knowledge gained through inference?","options":[{"value":"A","text":"Pratyakṣa"},{"value":"B","text":"Anumāna"},{"value":"C","text":"Upamāna"},{"value":"D","text":"Śabda"}],"answer":"B"},{"id":46,"question":"Buddhism accepts how many Pramāṇas?","options":[{"value":"A","text":"One"},{"value":"B","text":"Two"},{"value":"C","text":"Three"},{"value":"D","text":"Four"}],"answer":"B"},{"id":47,"question":"Which two Pramāṇas are accepted by Buddhism?","options":[{"value":"A","text":"Perception and Testimony"},{"value":"B","text":"Inference and Comparison"},{"value":"C","text":"Perception and Inference"},{"value":"D","text":"Testimony and Presumption"}],"answer":"C"},{"id":48,"question":"Nyāya philosophy is primarily concerned with:","options":[{"value":"A","text":"Liberation through devotion"},{"value":"B","text":"Logical reasoning and valid knowledge"},{"value":"C","text":"Ritual practices"},{"value":"D","text":"Meditation techniques"}],"answer":"B"},{"id":49,"question":"In Nyāya, valid knowledge is called:","options":[{"value":"A","text":"Avidyā"},{"value":"B","text":"Pramā"},{"value":"C","text":"Samsāra"},{"value":"D","text":"Mokṣa"}],"answer":"B"},{"id":50,"question":"How many Pramāṇas are accepted by the Nyāya school?","options":[{"value":"A","text":"Two"},{"value":"B","text":"Three"},{"value":"C","text":"Four"},{"value":"D","text":"Six"}],"answer":"C"},{"id":51,"question":"Which of the following is NOT a Nyāya Pramāṇa?","options":[{"value":"A","text":"Perception (Pratyakṣa)"},{"value":"B","text":"Inference (Anumāna)"},{"value":"C","text":"Comparison (Upamāna)"},{"value":"D","text":"Presumption (Arthāpatti) "}],"answer":"D"},{"id":52,"question":"Anumāna (inference) is based on:","options":[{"value":"A","text":"Direct experience"},{"value":"B","text":"Testimony"},{"value":"C","text":"Universal relation (Vyāpti)"},{"value":"D","text":"Guesswork"}],"answer":"C"},{"id":53,"question":"Nyāya philosophers analyzed error in order to:","options":[{"value":"A","text":"Improve valid cognition"},{"value":"B","text":"Increase confusion"},{"value":"C","text":"Reject perception"},{"value":"D","text":"Avoid debate"}],"answer":"A"},{"id":54,"question":"Which pramāṇa is closest to AI sensor data?","options":[{"value":"A","text":"Perception (Pratyakṣa)"},{"value":"B","text":"Testimony"},{"value":"C","text":"Postulation"},{"value":"D","text":"Comparison"}],"answer":"A"},{"id":55,"question":"Learning from patterns in data in AI is similar to:","options":[{"value":"A","text":"Yoga"},{"value":"B","text":"Anumāna (inference)"},{"value":"C","text":"Worship"},{"value":"D","text":"Myth"}],"answer":"B"},{"id":56,"question":"Trusting information from a database in AI resembles:","options":[{"value":"A","text":"Illusion"},{"value":"B","text":"Śabda (testimony)"},{"value":"C","text":"Doubt"},{"value":"D","text":"Meditation"}],"answer":"B"},{"id":57,"question":"A major concern in both Indian epistemology and AI is:","options":[{"value":"A","text":"Fashion"},{"value":"B","text":"Validity of knowledge"},{"value":"C","text":"Architecture"},{"value":"D","text":"Music"}],"answer":"B"},{"id":58,"question":"Which of the following questions is central to epistemology?","options":[{"value":"A","text":"What is beauty?"},{"value":"B","text":"What is justice?"},{"value":"C","text":"What can we know and how do we know it?"},{"value":"D","text":"What is the good life?"}],"answer":"C"},{"id":59,"question":"Which philosopher is most closely associated with empiricism?","options":[{"value":"A","text":"René Descartes"},{"value":"B","text":"Immanuel Kant"},{"value":"C","text":"John Locke "},{"value":"D","text":"G. W. F. Hegel"}],"answer":"C"},{"id":60,"question":"According to John Locke, the human mind at birth is like:","options":[{"value":"A","text":"A mirror"},{"value":"B","text":"A blank slate (tabula rasa)"},{"value":"C","text":"A rational structure"},{"value":"D","text":"A divine spark"}],"answer":"B"},{"id":61,"question":"Identity Theory in the philosophy of mind claims that:","options":[{"value":"A","text":"Mental states are patterns of behavior"},{"value":"B","text":"Mental states are identical to brain states"},{"value":"C","text":"Mental states are illusions"},{"value":"D","text":"Mental states are non-physical substances"}],"answer":"B"},{"id":62,"question":"Identity Theory is also known as:","options":[{"value":"A","text":"Dualism"},{"value":"B","text":"Functionalism"},{"value":"C","text":"Mind–Brain Identity Theory"},{"value":"D","text":"Logical Positivism"}],"answer":"C"},{"id":63,"question":"Which philosopher is most closely associated with the development of Identity Theory?","options":[{"value":"A","text":"Gilbert Ryle"},{"value":"B","text":"J. J. C. Smart"},{"value":"C","text":"Hilary Putnam"},{"value":"D","text":"Daniel Dennett"}],"answer":"B"},{"id":64,"question":"Functionalism defines mental states mainly in terms of their:","options":[{"value":"A","text":"Chemical composition"},{"value":"B","text":"Physical location"},{"value":"C","text":"Causal roles/relations"},{"value":"D","text":"Spiritual nature"}],"answer":"C"},{"id":65,"question":"Functionalism emerged largely as an alternative to:","options":[{"value":"A","text":"Dualism only"},{"value":"B","text":"Identity theory and behaviorism"},{"value":"C","text":"Pragmatism"},{"value":"D","text":"Existentialism"}],"answer":"B"},{"id":66,"question":"According to functionalism, a mental state is identified by:","options":[{"value":"A","text":"Brain tissue"},{"value":"B","text":"Input–output relations"},{"value":"C","text":"Personal feelings only"},{"value":"D","text":"Moral value"}],"answer":"B"},{"id":67,"question":"The idea that the same mental state can exist in different physical systems is called:","options":[{"value":"A","text":"Supervenience"},{"value":"B","text":"Eliminativism"},{"value":"C","text":"Multiple realization"},{"value":"D","text":"Parallelism"}],"answer":"C"},{"id":68,"question":"Which philosopher is strongly associated with functionalism?","options":[{"value":"A","text":"B. F. Skinner"},{"value":"B","text":"Hilary Putnam"},{"value":"C","text":"René Descartes"},{"value":"D","text":"David Hume"}],"answer":"B"},{"id":69,"question":"Functionalism compared the mind to a:","options":[{"value":"A","text":"Dream"},{"value":"B","text":"Computer program"},{"value":"C","text":"Soul"},{"value":"D","text":"Reflex"}],"answer":"B"},{"id":70,"question":"Philosophical behaviorism claims that:","options":[{"value":"A","text":"Mental states are identical to brain states"},{"value":"B","text":"Mental states are patterns of behavior or dispositions to behave"},{"value":"C","text":"Mental states are private and ineffable"},{"value":"D","text":"Mental states are illusions"}],"answer":"B"},{"id":71,"question":"Who is most closely associated with philosophical behaviorism?","options":[{"value":"A","text":"J. J. C. Smart"},{"value":"B","text":"Gilbert Ryle"},{"value":"C","text":"Hilary Putnam"},{"value":"D","text":"Jerry Fodor"}],"answer":"B"},{"id":72,"question":"Which book by Gilbert Ryle criticized Cartesian dualism?","options":[{"value":"A","text":"Being and Nothingness"},{"value":"B","text":"The Concept of Mind"},{"value":"C","text":"Philosophical Investigations"},{"value":"D","text":"Mind and World"}],"answer":"B"},{"id":73,"question":"The idea that the mind is a \"ghost in the machine\" was criticized by:","options":[{"value":"A","text":"Descartes"},{"value":"B","text":"Ryle"},{"value":"C","text":"Hume"},{"value":"D","text":"Kant"}],"answer":"B"},{"id":74,"question":"Which theory holds that mental states can be fully explained without reference to inner experiences?","options":[{"value":"A","text":"Functionalism"},{"value":"B","text":"Identity Theory"},{"value":"C","text":"Behaviorism "},{"value":"D","text":"Dualism"}],"answer":"C"},{"id":75,"question":"In AI research, what challenge parallels the mind-body problem in philosophy?","options":[{"value":"A","text":"Symbolic grounding problem"},{"value":"B","text":"Turing test"},{"value":"C","text":"Machine learning optimization"},{"value":"D","text":"Database normalization"}],"answer":"A"},{"id":76,"question":"How can a system illustrate behaviorist ideas?","options":[{"value":"A","text":"By stimulating subjective experience"},{"value":"B","text":"By showing intelligent behavior based on input and rules"},{"value":"C","text":"By having consciousness like humans"},{"value":"D","text":"By developing emotions independently Module 4 — AI Ethics, Alignment & Moral Agency"}],"answer":"B"},{"id":77,"question":"What is the main goal of AI alignment?","options":[{"value":"A","text":"To make AI systems faster and more efficient"},{"value":"B","text":"To ensure AI systems act according to human values and intentions"},{"value":"C","text":"To increase AI autonomy without supervision"},{"value":"D","text":"To reduce the cost of AI development"}],"answer":"B"},{"id":78,"question":"Why is embedding human values important in AI systems?","options":[{"value":"A","text":"To make AI systems faster and more profitable"},{"value":"B","text":"To increase AI autonomy without ethical constraints"},{"value":"C","text":"To reduce the need for human oversight"},{"value":"D","text":"To ensure AI respects human dignity, safety, fairness, and well-being"}],"answer":"D"},{"id":79,"question":"Continuous monitoring of AI systems is important because:","options":[{"value":"A","text":"AI systems may drift from human-aligned behavior over time"},{"value":"B","text":"AI goals never change"},{"value":"C","text":"Humans can delegate all responsibility to AI"},{"value":"D","text":"Monitoring slows down AI efficiency"}],"answer":"A"},{"id":80,"question":"What is the primary purpose of transparency and explainability in AI?","options":[{"value":"A","text":"To hide AI decision-making processes from users"},{"value":"B","text":"To increase AI processing speed"},{"value":"C","text":"To make AI decisions visible, understandable, accountable, and trustworthy"},{"value":"D","text":"To allow AI to act independently without human oversight"}],"answer":"C"},{"id":81,"question":"What is a major concern associated with superintelligent AI as an existential threat?","options":[{"value":"A","text":"It may be slower than human intelligence."},{"value":"B","text":"It might pursue goals misaligned with human values."},{"value":"C","text":"It cannot process large datasets efficiently."},{"value":"D","text":"It requires human supervision for all tasks. "}],"answer":"B"},{"id":82,"question":"Why is the concept of “autonomy” in AI relevant to existential threats?","options":[{"value":"A","text":"Autonomous AI is always safe."},{"value":"B","text":"Autonomous AI cannot learn new tasks"},{"value":"C","text":"Autonomy reduces the need for computing resources."},{"value":"D","text":"Greater autonomy allows AI to act independently"}],"answer":"D"},{"id":83,"question":"What does AGI (Artificial General Intelligence) refer to?","options":[{"value":"A","text":"AI specialized in one task, like chess or translation"},{"value":"B","text":"AI with humanlike general intelligence across domains / can perform any intellectual task a human can"},{"value":"C","text":"Simple rule-based systems"},{"value":"D","text":"Automated data storage"}],"answer":"B"},{"id":84,"question":"Why is AGI considered “far” or a distant goal?","options":[{"value":"A","text":"Because AI cannot play games efficiently"},{"value":"B","text":"Because humans do not want AGI"},{"value":"C","text":"Because current AI lacks understanding, reasoning, and common sense"},{"value":"D","text":"Because computers are too expensive"}],"answer":"C"},{"id":85,"question":"How does the lack of autonomy in AI relate to AGI being far?","options":[{"value":"A","text":"AI can already act completely independently"},{"value":"B","text":"AI needs human supervision and cannot self-direct learning across domains"},{"value":"C","text":"AI is too autonomous for safety"},{"value":"D","text":"AI autonomy makes it easier to achieve AGI"}],"answer":"B"},{"id":86,"question":"The primary reason learning algorithms acquire moral bias is:","options":[{"value":"A","text":"High computational power"},{"value":"B","text":"Learning from historically biased data"},{"value":"C","text":"Excessive model accuracy"},{"value":"D","text":"Lack of automation"}],"answer":"B"},{"id":87,"question":"Which of the following helps directly detect algorithmic bias?","options":[{"value":"A","text":"Increasing dataset size"},{"value":"B","text":"Bias and fairness audits"},{"value":"C","text":"Faster processors"},{"value":"D","text":"Encryption"}],"answer":"B"},{"id":88,"question":"Embedding fairness constraints into a model relates to:","options":[{"value":"A","text":"Data storage"},{"value":"B","text":"Ethical governance"},{"value":"C","text":"Algorithm design / Ethical optimization"},{"value":"D","text":"User feedback"}],"answer":"C"},{"id":89,"question":"Bias that emerges after deployment is best addressed through:","options":[{"value":"A","text":"One-time training"},{"value":"B","text":"Ignoring edge cases "},{"value":"C","text":"Continuous monitoring and updates"},{"value":"D","text":"Removing the system"}],"answer":"C"},{"id":90,"question":"Optimizing AI systems only for accuracy may lead to:","options":[{"value":"A","text":"Fairer outcomes"},{"value":"B","text":"Reduced bias"},{"value":"C","text":"Amplification of existing social biases / social order"},{"value":"D","text":"Perfect neutrality"}],"answer":"C"},{"id":91,"question":"Ethical optimization of AI mainly focuses on:","options":[{"value":"A","text":"Maximizing speed and efficiency only"},{"value":"B","text":"Reducing computational cost"},{"value":"C","text":"Aligning AI goals with ethical values and human well-being"},{"value":"D","text":"Replacing human decision making"}],"answer":"C"},{"id":92,"question":"Ethical optimization helps prevent which of the following problems in AI systems?","options":[{"value":"A","text":"Algorithm-based bias"},{"value":"B","text":"Discrimination"},{"value":"C","text":"Harmful or unsafe outcomes"},{"value":"D","text":"All of the above"}],"answer":"D"},{"id":93,"question":"Embedding ethics into AI design from the start is called:","options":[{"value":"A","text":"Impact Assessment"},{"value":"B","text":"Security and Resilience"},{"value":"C","text":"Ethics-by-Design"},{"value":"D","text":"Social Mediation"}],"answer":"C"},{"id":94,"question":"Conducting an evaluation of potential social, ethical, and legal consequences before deploying AI is known as:","options":[{"value":"A","text":"Impact Assessment"},{"value":"B","text":"Social Mediation"},{"value":"C","text":"Data Mining"},{"value":"D","text":"Ethics-by-Design"}],"answer":"A"},{"id":95,"question":"Which principle ensures that a self-driving car’s decision can be understood and explained?","options":[{"value":"A","text":"Automation"},{"value":"B","text":"Transparency"},{"value":"C","text":"Efficiency"},{"value":"D","text":"Autonomy"}],"answer":"B"},{"id":96,"question":"What should be the highest ethical priority for a self-driving car?","options":[{"value":"A","text":"Maximizing profit for manufacturers"},{"value":"B","text":"Improving travel speed"},{"value":"C","text":"Ensuring human safety "},{"value":"D","text":"Reducing fuel consumption"}],"answer":"C"},{"id":97,"question":"What ethical practice helps prevent discrimination in AI-driven vehicles?","options":[{"value":"A","text":"Random decision-making"},{"value":"B","text":"Ignoring social factors"},{"value":"C","text":"Using ethically audited and diverse training data"},{"value":"D","text":"Increasing automation levels"}],"answer":"C"},{"id":98,"question":"Which ethical principle emphasizes that AI should support, not replace, human moral judgment?","options":[{"value":"A","text":"Full autonomy"},{"value":"B","text":"Machine supremacy"},{"value":"C","text":"Human-centered design"},{"value":"D","text":"Algorithmic dominance"}],"answer":"C"},{"id":99,"question":"What is morality primarily concerned with?","options":[{"value":"A","text":"Legal rules"},{"value":"B","text":"Social customs only"},{"value":"C","text":"Distinguishing right from wrong"},{"value":"D","text":"Scientific facts"}],"answer":"C"},{"id":100,"question":"Moral values mainly guide a person’s:","options":[{"value":"A","text":"Physical strength"},{"value":"B","text":"Ethical behavior"},{"value":"C","text":"Economic status"},{"value":"D","text":"Intelligence level"}],"answer":"B"},{"id":101,"question":"What is meant by moral harm?","options":[{"value":"A","text":"Physical injury only"},{"value":"B","text":"Economic loss"},{"value":"C","text":"Violation of moral rights, dignity, or well-being"},{"value":"D","text":"Technical malfunction"}],"answer":"C"},{"id":102,"question":"Which of the following best represents moral harm in AI systems?","options":[{"value":"A","text":"Slow processing speed"},{"value":"B","text":"Biased decision-making"},{"value":"C","text":"High energy consumption"},{"value":"D","text":"Hardware damage"}],"answer":"B"},{"id":103,"question":"A moral agent is best defined as an entity that can:","options":[{"value":"A","text":"Perform complex calculations"},{"value":"B","text":"Follow programmed rules"},{"value":"C","text":"Distinguish right from wrong and be held responsible"},{"value":"D","text":"Store information"}],"answer":"C"},{"id":104,"question":"Moral agents must possess:","options":[{"value":"A","text":"Automation and efficiency"},{"value":"B","text":"Intentionality and autonomy"},{"value":"C","text":"Network connectivity"},{"value":"D","text":"Hardware reliability"}],"answer":"B"},{"id":105,"question":"Which ethical capacity allows a moral agent to be praised or blamed?","options":[{"value":"A","text":"Storage capacity"},{"value":"B","text":"Free will"},{"value":"C","text":"Automation"},{"value":"D","text":"Pattern recognition"}],"answer":"B"},{"id":106,"question":"When AI causes harm, who should be held morally accountable?","options":[{"value":"A","text":"The AI system"},{"value":"B","text":"The algorithm"},{"value":"C","text":"Human stakeholders involved"},{"value":"D","text":"Random chance"}],"answer":"C"},{"id":107,"question":"If an AI system were conscious and morally autonomous, it might:","options":[{"value":"A","text":"Still be a tool"},{"value":"B","text":"Be considered a moral agent"},{"value":"C","text":"Lose efficiency"},{"value":"D","text":"Stop learning"}],"answer":"B"},{"id":108,"question":"Consciousness is best described as the:","options":[{"value":"A","text":"Ability to compute quickly"},{"value":"B","text":"Awareness of oneself and one's surroundings"},{"value":"C","text":"Having a physical body"},{"value":"D","text":"Storing information"}],"answer":"B"},{"id":109,"question":"Qualia refers to:","options":[{"value":"A","text":"Logical reasoning"},{"value":"B","text":"External behavior"},{"value":"C","text":"First-person subjective experience"},{"value":"D","text":"Memory storage"}],"answer":"C"},{"id":110,"question":"The right of autonomy mainly protects a person's:","options":[{"value":"A","text":"Physical strength"},{"value":"B","text":"Freedom to make informed decisions"},{"value":"C","text":"Economic power"},{"value":"D","text":"Social influence"}],"answer":"B"}];const N=60,MIN=30,API='https://ba-sociology-results.faiz0812.workers.dev';let test=[],answers={},pos=0,seconds=MIN*60,interval=null,studentName='',submitted=false;const $=id=>document.getElementById(id);
const GREETINGS=['Welcome! 📚 Ready for Philosophy of AI? Think carefully and do your best! 🌟','Hello! 👋 Challenge yourself with 60 questions and stay confident! 💪','Good luck! 🎓 Read each question carefully and show what you know!','Welcome to your mock test! 🧠✨ Stay focused and keep going!'];function setGreeting(){$('greeting').textContent=GREETINGS[Math.floor(Math.random()*GREETINGS.length)]}function shuffle(a){let x=a.slice();for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function screen(id){['start','test','result'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}function startTest(){studentName=$('name').value.trim();if(!studentName){$('msg').textContent='Please enter Student Name.';return}test=shuffle(QUESTIONS).slice(0,N);answers={};pos=0;seconds=MIN*60;submitted=false;screen('test');render();clearInterval(interval);interval=setInterval(tick,1000);tick()}function tick(){seconds--;if(seconds<0)seconds=0;$('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds===0)submit(true)}function render(){let questionIndex=pos;let q=test[pos];$('counter').textContent='Question '+(pos+1)+' of '+N;$('question').textContent=q.question;$('options').innerHTML=q.options.map(o=>'<label class="opt"><input type="radio" name="answer" value="'+o.value+'" '+(answers[pos]===o.value?'checked':'')+'> '+o.value+') '+o.text+'</label>').join('');if(answers[questionIndex])lockAnswerOptions('#options');document.querySelectorAll('input[name=answer]').forEach(x=>x.addEventListener('change',()=>{if(answers[questionIndex]){x.checked=x.value===answers[questionIndex];lockAnswerOptions('#options');return}answers[questionIndex]=x.value;lockAnswerOptions('#options');paintAnswerFeedback(q,'#options',x.value);renderNav()}));$('prev').disabled=pos===0;$('next').disabled=pos===N-1;if((pos+1)===60){$('submit').style.display='inline-block'}else{$('submit').style.display='none'};renderNav()}function renderNav(){let h='';test.forEach((q,i)=>h+='<button class="'+(answers[i]?'answered ':'')+(i===pos?'current':'')+'" data-i="'+i+'">'+(i+1)+'</button>');$('nav').innerHTML=h;document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{pos=Number(b.dataset.i);render()})}function submit(auto){if(submitted)return;if(!auto&&!confirm('Are you sure you want to Finish & Submit the test?'))return;submitted=true;clearInterval(interval);let correct=0,wrong=0,unanswered=0;test.forEach((q,i)=>{if(!answers[i])unanswered++;else if(answers[i]===q.answer)correct++;else wrong++});let attempted=correct+wrong,pct=correct/N*100,accuracy=attempted?correct/attempted*100:0;showReport(correct,wrong,unanswered,attempted,pct,accuracy,auto);sendToCloudflare(correct,wrong,unanswered,pct,auto)}function sendToCloudflare(correct,wrong,unanswered,pct,auto){let payload={name:studentName,reg:'N/A',subject:'Philosophy of AI Mock Test - 60Q',score:correct,total:N,percentage:Number(pct.toFixed(1)),wrong:wrong,unanswered:unanswered,status:pct>=40?'PASS':'NEEDS IMPROVEMENT',autoSubmitted:auto,submittedAt:new Date().toISOString()};fetch(API+'/submit',{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload)}).then(r=>{if(!r.ok)throw new Error('Cloudflare '+r.status);$('message').textContent=''}).catch(e=>{$('message').textContent='Final report ready. Cloudflare save failed; local report is still available.'})}function showReport(correct,wrong,unanswered,attempted,pct,accuracy,auto){$('rname').textContent=studentName;$('score').textContent=correct+' / '+N;$('pct').textContent=pct.toFixed(1)+'%';$('attempted').textContent=attempted+' / '+N;$('correct').textContent=correct;$('wrong').textContent=wrong;$('unanswered').textContent=unanswered;$('accuracy').textContent=accuracy.toFixed(1)+'%';$('status').textContent=pct>=80?'EXCELLENT':pct>=60?'VERY GOOD':pct>=40?'PASS':'NEEDS IMPROVEMENT';$('status').className='status-badge '+(pct>=80?'status-excellent':pct>=60?'status-good':pct>=40?'status-pass':'status-needs');$('message').textContent=auto?'Time expired — submitted automatically.':'Test submitted successfully.';$('motivation').textContent=pct>=80?'Outstanding performance! 🌟':pct>=60?'Very good effort! 👏':pct>=40?'You passed! 🌟 Review the missed topics.':'Keep going! 💪 Review the weak areas and try again.';let h='';test.forEach((q,i)=>{let your=answers[i]||'Not answered',yourOpt=q.options.find(o=>o.value===your),ok=your===q.answer,res=ok?'Correct':your==='Not answered'?'Unanswered':'Wrong',co=q.options.find(o=>o.value===q.answer),cl=ok?'correct':your==='Not answered'?'not-answered':'wrong';h+='<div class="review-card '+cl+'"><div class="review-q">Q'+(i+1)+'. '+q.question+'</div>'+(ok?'<div class="review-line"><span>Your answer</span><b>'+esc(your+') '+yourOpt.text)+'</b></div><div class="review-line"><b style="color:#16a34a;font-size:18px">✓ Your answer is correct</b></div>':'<div class="review-line"><span>Your answer</span><b>'+esc(your==='Not answered'?'Not answered':your+') '+yourOpt.text)+'</b></div><div class="review-line"><span>Correct answer</span><b>'+q.answer+') '+co.text+'</b></div><div class="result-badge">'+res+'</div>')+'</div>'});$('review').innerHTML=h;screen('result');window.scrollTo({top:0,behavior:'smooth'})}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function saveReport(){let rows=test.map((q,i)=>{let your=answers[i]||'Not answered',yourOpt=q.options.find(o=>o.value===your),co=q.options.find(o=>o.value===q.answer),res=your===q.answer?'Correct':your==='Not answered'?'Unanswered':'Wrong';return '<tr><td>'+(i+1)+'</td><td>'+esc(q.question)+'</td><td>'+esc(your==='Not answered'?'Not answered':your+') '+yourOpt.text)+'</td><td>'+esc(q.answer+') '+co.text)+'</td><td>'+res+'</td></tr>'}).join('');let html='<!doctype html><html><body><h1>Philosophy of AI Mock Test – Final Report</h1><p><b>Student:</b> '+esc(studentName)+'</p><p><b>Score:</b> '+$('score').textContent+' | <b>Percentage:</b> '+$('pct').textContent+' | <b>Status:</b> '+$('status').textContent+'</p><table border="1" cellpadding="7"><tr><th>No.</th><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th></tr>'+rows+'</table></body></html>';let blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Philosophy_of_AI_Final_Report.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function finish(){clearInterval(interval);submitted=false;test=[];answers={};pos=0;studentName='';$('name').value='';screen('start');setGreeting()}setGreeting();$('startBtn').onclick=startTest;$('prev').onclick=()=>{if(pos>0){pos--;render()}};$('next').onclick=()=>{if(pos<N-1){pos++;render()}};$('submit').onclick=()=>submit(false);$('save').onclick=saveReport;$('print').onclick=()=>window.print();$('startAgain').onclick=finish;

function lockAnswerOptions(selector){const box=document.querySelector(selector);if(!box)return;box.querySelectorAll('input[type="radio"]').forEach(input=>input.disabled=true);box.querySelectorAll('.opt,.option').forEach(label=>label.classList.add('locked'));}
function paintAnswerFeedback(q,selector,selected){const box=document.querySelector(selector);if(!box)return;box.querySelectorAll('.opt,.option').forEach(label=>label.classList.remove('correct-reveal'));if(!selected||selected===q.answer)return;box.querySelectorAll('input[type="radio"]').forEach(input=>{if(input.value===q.answer){const label=input.closest('.opt,.option');if(label)label.classList.add('correct-reveal');}});}
</script></body></html>
