":"Population and structure"},{"value":"C","text":"Social control"},{"value":"D","text":"Social behaviour"}],"answer":"B"},{"id":49,"question":"Sociology helps in:","options":[{"value":"A","text":"Ignoring problems"},{"value":"B","text":"Solving social problems"},{"value":"C","text":"Creating conflicts"},{"value":"D","text":"Avoiding society"}],"answer":"B"},{"id":50,"question":"Sociology uses which method for study?","options":[{"value":"A","text":"Religious method"},{"value":"B","text":"Scientific method"},{"value":"C","text":"Mythological method"},{"value":"D","text":"Philosophical guessing"}],"answer":"B"},{"id":51,"question":"Observation in sociology means:","options":[{"value":"A","text":"Random watching"},{"value":"B","text":"Scientific and systematic watching"},{"value":"C","text":"Guessing facts"},{"value":"D","text":"Imagining reality"}],"answer":"B"},{"id":52,"question":"Experimental method in sociology is:","options":[{"value":"A","text":"Always easy"},{"value":"B","text":"Impossible"},{"value":"C","text":"Difficult to apply strictly"},{"value":"D","text":"Not used"}],"answer":"C"},{"id":53,"question":"Sociology is considered a general science because it studies:","options":[{"value":"A","text":"Only economy"},{"value":"B","text":"Only politics"},{"value":"C","text":"Society as a whole"},{"value":"D","text":"Only culture"}],"answer":"C"},{"id":54,"question":"Alfred Vierkandt belonged to the:","options":[{"value":"A","text":"Synthetic School"},{"value":"B","text":"Historical School"},{"value":"C","text":"Specialistic (Formalistic) School"},{"value":"D","text":"Positivist School"}],"answer":"C"},{"id":55,"question":"Medical Sociology primarily studies:","options":[{"value":"A","text":"Workplaces and industries"},{"value":"B","text":"Health, illness, and healthcare"},{"value":"C","text":"Village life and agriculture"},{"value":"D","text":"Urban development"}],"answer":"B"},{"id":56,"question":"Industrial Sociology originated in:","options":[{"value":"A","text":"USA"},{"value":"B","text":"India"},{"value":"C","text":"Europe"},{"value":"D","text":"Japan"}],"answer":"C"},{"id":57,"question":"Which of the following is NOT an area of Industrial Sociology?","options":[{"value":"A","text":"Industrial organization and structure"},{"value":"B","text":"Social impact of industrialization"},{"value":"C","text":"Rural community life"},{"value":"D","text":"Conflict and cooperation"}],"answer":"C"},{"id":58,"question":"The study of how social factors like poverty, stress, and environment affect health is part of:","options":[{"value":"A","text":"Industrial Sociology"},{"value":"B","text":"Rural Sociology"},{"value":"C","text":"Medical Sociology"},{"value":"D","text":"Urban Sociology"}],"answer":"C"},{"id":59,"question":"Sociological techniques include all of the following EXCEPT:","options":[{"value":"A","text":"Sociogram"},{"value":"B","text":"Sociometry"},{"value":"C","text":"Social Survey"},{"value":"D","text":"Laboratory Experiment"}],"answer":"D"},{"id":60,"question":"Sociology promotes the welfare of marginalized groups such as ________ communities.","options":[{"value":"A","text":"Industrial"},{"value":"B","text":"Urban"},{"value":"C","text":"Tribal"},{"value":"D","text":"Corporate"}],"answer":"C"},{"id":62,"question":"Who introduced the concept of Sociological Imagination?","options":[{"value":"A","text":"Karl Marx"},{"value":"B","text":"Max Weber"},{"value":"C","text":"C. Wright Mills"},{"value":"D","text":"Émile Durkheim"}],"answer":"C"},{"id":63,"question":"Sociological Imagination mainly helps to connect:","options":[{"value":"A","text":"Religion and economy"},{"value":"B","text":"Personal troubles and public issues"},{"value":"C","text":"Education and politics"},{"value":"D","text":"Culture and biology"}],"answer":"B"},{"id":64,"question":"Which book popularized the concept of Sociological Imagination?","options":[{"value":"A","text":"The Power Elite"},{"value":"B","text":"White Collar"},{"value":"C","text":"The Sociological Imagination"},{"value":"D","text":"Das Kapital"}],"answer":"C"},{"id":65,"question":"Personal troubles are:","options":[{"value":"A","text":"Issues affecting large groups"},{"value":"B","text":"Problems within an individual's immediate environment"},{"value":"C","text":"Political conflicts"},{"value":"D","text":"Economic crises"}],"answer":"B"},{"id":67,"question":"The 'quality of mind' mentioned by Mills refers to:","options":[{"value":"A","text":"Intelligence Quotient (IQ)"},{"value":"B","text":"Memory Power"},{"value":"C","text":"Sociological Imagination"},{"value":"D","text":"Emotional Intelligence"}],"answer":"C"},{"id":68,"question":"Coffee drinking is an example used to explain:","options":[{"value":"A","text":"Biological behaviour"},{"value":"B","text":"Economic crisis"},{"value":"C","text":"Everyday social practices"},{"value":"D","text":"Political movements"}],"answer":"C"},{"id":69,"question":"The connection between biography and history means:","options":[{"value":"A","text":"Life is independent of society"},{"value":"B","text":"Individual life is shaped by historical forces"},{"value":"C","text":"History is irrelevant"},{"value":"D","text":"Society does not change"}],"answer":"B"},{"id":70,"question":"Lack of Sociological Imagination leads to:","options":[{"value":"A","text":"Better understanding"},{"value":"B","text":"Awareness of society"},{"value":"C","text":"Feeling of being trapped"},{"value":"D","text":"Social reform"}],"answer":"C"},{"id":71,"question":"Sociology of everyday life focuses mainly on:","options":[{"value":"A","text":"Ancient societies"},{"value":"B","text":"Routine daily activities and interactions"},{"value":"C","text":"Political systems only"},{"value":"D","text":"Economic policies only"}],"answer":"B"},{"id":72,"question":"Common sense knowledge is generally:","options":[{"value":"A","text":"Systematic and scientific"},{"value":"B","text":"Based on experiments"},{"value":"C","text":"Based on everyday experience and beliefs" :"Knowledge creation"},{"value":"D","text":"Social control"}],"answer":"C"},{"id":81,"question":"Qualitative research deals with:","options":[{"value":"A","text":"Numbers"},{"value":"B","text":"Measurement"},{"value":"C","text":"Qualities and experiences"},{"value":"D","text":"Statistics only"}],"answer":"C"},{"id":82,"question":"The first step in the research process is:","options":[{"value":"A","text":"Data collection"},{"value":"B","text":"Hypothesis formulation"},{"value":"C","text":"Identification of research problem"},{"value":"D","text":"Reporting"}],"answer":"C"},{"id":83,"question":"A hypothesis is:","options":[{"value":"A","text":"Final result"},{"value":"B","text":"Proven fact"},{"value":"C","text":"Tentative statement"},{"value":"D","text":"Random guess"}],"answer":"C"},{"id":84,"question":"The final step in the research process is:","options":[{"value":"A","text":"Hypothesis"},{"value":"B","text":"Data collection"},{"value":"C","text":"Reporting"},{"value":"D","text":"Analysis"}],"answer":"C"},{"id":85,"question":"Ethics refers to:","options":[{"value":"A","text":"Scientific tools"},{"value":"B","text":"Moral principles guiding behavior"},{"value":"C","text":"Data collection methods"},{"value":"D","text":"Statistical analysis"}],"answer":"B"},{"id":86,"question":"Which of the following is an unethical practice?","options":[{"value":"A","text":"Informed consent"},{"value":"B","text":"Confidentiality"},{"value":"C","text":"Fabrication of data"},{"value":"D","text":"Proper identification"}],"answer":"C"},{"id":88,"question":"Plagiarism means:","options":[{"value":"A","text":"Creating new ideas"},{"value":"B","text":"Copying others' work without credit"},{"value":"C","text":"Conducting surveys"},{"value":"D","text":"Analyzing data"}],"answer":"B"},{"id":89,"question":"Who develops research ethics?","options":[{"value":"A","text":"Single researcher"},{"value":"B","text":"Participants"},{"value":"C","text":"Institutions and committees"},{"value":"D","text":"Media"}],"answer":"C"},{"id":90,"question":"Micro Sociology studies individual behaviour in:","options":[{"value":"A","text":"Isolation"},{"value":"B","text":"Large groups only"},{"value":"C","text":"Social interaction"},{"value":"D","text":"Political systems"}],"answer":"C"},{"id":91,"question":"Which of the following is a key feature of Micro Sociology?","options":[{"value":"A","text":"Study of large populations"},{"value":"B","text":"Focus on institutions"},{"value":"C","text":"Focus on small-scale interactions"},{"value":"D","text":"Use of only statistical data"}],"answer":"C"},{"id":92,"question":"The word 'Micro' means:","options":[{"value":"A","text":"Large"},{"value":"B","text":"Complex"},{"value":"C","text":"Small"},{"value":"D","text":"Universal"}],"answer":"C"},{"id":93,"question":"The term 'Level of Analysis' in Sociology refers to:","options":[{"value":"A","text":"Type of research method"},{"value":"B","text":"Scale or scope of study"},{"value":"C","text":"Nature of data collection"},{"value":"D","text":"Type of society"}],"answer":"B"},{"id":94,"question":"Who is regarded as the founder of Symbolic Interactionism?","options":[{"value":"A","text":"Herbert Blumer"},{"value":"B","text":"George Herbert Mead"},{"value":"C","text":"Harold Garfinkel"},{"value":"D","text":"Alfred Schutz"}],"answer":"B"},{"id":95,"question":"Symbolic Interactionism mainly focuses on:","options":[{"value":"A","text":"Large-scale social structures"},{"value":"B","text":"Economic systems"},{"value":"C","text":"Daily interactions and meanings"},{"value":"D","text":"Political institutions"}],"answer":"C"},{"id":96,"question":"Who is the founder of Ethnomethodology?","options":[{"value":"A","text":"George C. Homans"},{"value":"B","text":"Harold Garfinkel"},{"value":"C","text":"Alfred Schutz"},{"value":"D","text":"Herbert Blumer"}],"answer":"B"},{"id":97,"question":"Who developed Exchange Theory?","options":[{"value":"A","text":"Harold Garfinkel"},{"value":"B","text":"George C. Homans" ral patterns and processes"},{"value":"C","text":"Only past records"},{"value":"D","text":"Only political systems"}],"answer":"B"},{"id":106,"question":"Anthropology studies:","options":[{"value":"A","text":"Only economy"},{"value":"B","text":"Only politics"},{"value":"C","text":"Total way of life"},{"value":"D","text":"Only religion"}],"answer":"C"},{"id":107,"question":"Thinking sociologically is closely related to common sense because both deal with:","options":[{"value":"A","text":"Scientific experiments"},{"value":"B","text":"Everyday social life"},{"value":"C","text":"Political systems"},{"value":"D","text":"Historical events"}],"answer":"B"},{"id":108,"question":"The word society derived from ....................?","options":[{"value":"A","text":"Social"},{"value":"B","text":"Socius"},{"value":"C","text":"Solidarity"},{"value":"D","text":"Structure"}],"answer":"B"},{"id":109,"question":"The word society derived from which language?","options":[{"value":"A","text":"Spanish"},{"value":"B","text":"French"},{"value":"C","text":"Latin"},{"value":"D","text":"German"}],"answer":"C"},{"id":110,"question":"Who defined “Society as a web of social relationship”?","options":[{"value":"A","text":"Mac Iver"},{"value":"B","text":"CH Cooley"},{"value":"C","text":"Morris Ginsberg"},{"value":"D","text":"Talcott Parson"}],"answer":"A"},{"id":111,"question":"Find out a structuralist sociologist?","options":[{"value":"A","text":"Leacock"},{"value":"B","text":"Mac Iver"},{"value":"C","text":"Talcott Parson"},{"value":"D","text":"Ginsberg"}],"answer":"C"},{"id":112,"question":"Which of the following approach consider society as a process?","options":[{"value":"A","text":"Conflict perspective"},{"value":"B","text":"Structuralist approach"},{"value":"C","text":"Functionalist approach"},{"value":"D","text":"Symbolic perspective"}],"answer":"C"},{"id":113,"question":"According to Kingsley Davis, the basic needs of society are ....................?","options":[{"value":"A","text":"Socia :"None of the above"}],"answer":"C"},{"id":127,"question":"Which of the following sociologist consider society as a biological organism?","options":[{"value":"A","text":"Herbert Spencer"},{"value":"B","text":"Merton"},{"value":"C","text":"Karl Marx"},{"value":"D","text":"Radcliffe Brown"}],"answer":"A"},{"id":128,"question":"Who defined “Social structure as the complex of principal groups and institutions which constitute society”","options":[{"value":"A","text":"Karl Marx"},{"value":"B","text":"Morris Ginsberg"},{"value":"C","text":"Emile Durkheim"},{"value":"D","text":"Radcliffe Brown"}],"answer":"B"},{"id":129,"question":"According to Radcliffe Brown, which of the following is not a part of social structure?","options":[{"value":"A","text":"Relationship between people"},{"value":"B","text":"Social roles"},{"value":"C","text":"Social Positions"},{"value":"D","text":"Cultural values"}],"answer":"D"},{"id":130,"question":"Status refers to ....................","options":[{"value":"A","text":"Obligation of an individual"},{"value":"B","text":"Temporary role of an person"},{"value":"C","text":"Position of an Individual"},{"value":"D","text":"Affective action"}],"answer":"C"},{"id":131,"question":"Which of the following is an example of an ascribed status?","options":[{"value":"A","text":"Daughter"},{"value":"B","text":"Doctor"},{"value":"C","text":"Teacher"},{"value":"D","text":"Student"}],"answer":"A"},{"id":132,"question":"Status acquired by person through birth, it is known as ....................","options":[{"value":"A","text":"Achieved status"},{"value":"B","text":"Ascribed status"},{"value":"C","text":"No relational status"},{"value":"D","text":"Role"}],"answer":"B"},{"id":133,"question":"The person achieve a status through their own efforts and abilities, this types of status is known as ....................","options":[{"value":"A","text":"Affective status"},{"value":"B","text":"Ascribed status"},{"value":"C","text":"Affinal status"},{"value":"D","text":"Achieved status"}],"answer":"D"},{"id":134,"question":"The term role can defined as ....................?","options":[{"value":"A","text":"Expected behaviour associated with a status"},{"value":"B","text":"Persons social conditions"},{"value":"C","text":"Individual financial conditions"},{"value":"D","text":"All of the above"}],"answer":"A"},{"id":135,"question":"Which of the following is not a type of role proposed by Banton?","options":[{"value":"A","text":"Basic role"},{"value":"B","text":"General role"},{"value":"C","text":"Non-relational role"},{"value":"D","text":"Independent role"}],"answer":"C"},{"id":136,"question":"The network of relationship and expectations that accompanying a particular positions, it is termed as ....................?","options":[{"value":"A","text":"Multiple role"},{"value":"B","text":"Role set"},{"value":"C","text":"Role signs"},{"value":"D","text":"None of the above"}],"answer":"B"},{"id":137,"question":"When a person experiences difficulty in fulfilling the expectations of a single role, it is called ....................?","options":[{"value":"A","text":"Role conflict"},{"value":"B","text":"Role sign"},{"value":"C","text":"Role strain"},{"value":"D","text":"Role playing"}],"answer":"C"},{"id":138,"question":"The individual holding two or more conflicting roles at the same time, it is known as ....................?","options":[{"value":"A","text":"Master role"},{"value":"B","text":"Role conflict"},{"value":"C","text":"Achieved role"},{"value":"D","text":"Role constrain"}],"answer":"B"},{"id":139,"question":"Alteration or changes in social organization, process, function and structure of society, it is termed as ....................?","options":[{"value":"A","text":"Social process"},{"value":"B","text":"Social institution"},{"value":"C","text":"Social change"},{"value":"D","text":"Social status"}],"answer":"C"},{"id":140,"question":"Which of the following considers the major sources of social change?","options":[{"value":"A","text":"Discovery"},{"value":"B","text":"Invention"},{"value":"C","text":"Diffusion"},{"value":"D","text":"All of the above"}],"answer":"D"},{"id":141,"question":"Which of the following is a technological factor of social change?","options":[{"value":"A","text":"Invention of internet"},{"value":"B","text":"Development of kinship system"},{"value":"C","text":"Population explosion"},{"value":"D","text":"All of the above 1) Socius 2) • Latin 3) • Mac Iver 4) • Ginsberg 5) • Functionalist approach 6) • Population, Specialization, Solidarity, Continuity 7) • All of the above 8) • Agriculture 9) • Services and information 10)• Community oriented and personal relationship 11)• Post-industrial 12)• Institution 13)• Emile Durkheim 14)• Crescive and Enacted 15)• Fashion 16)• Control and regulate human behaviour 17)• Consanguineous Kinship 18)• Affinal kinship 19)• Social structure 20)• Herbert Spencer 21)• Morris Ginsberg 22)• Cultural values 23)• Position of an Individual 24)• Daughter 25)• Ascribed status 26)• Achieved status 27)• Expected behaviour associated with a status 28)• Non-relational role 29)• Role set 30)• Role strain 31)• Role conflict 32)• Social change 33)• All of the above 34)• Invention of internet"}],"answer":"A"},{"id":142,"question":"Piaget's theory is focused on:","options":[{"value":"A","text":"Moral development"},{"value":"B","text":"Role-taking and symbols"},{"value":"C","text":"Unconscious drives"},{"value":"D","text":"Cognitive development and social learning"}],"answer":"D"},{"id":143,"question":"Who introduced the term \"Social Control\" in sociology?","options":[{"value":"A","text":"Karl Marx"},{"value":"B","text":"E.A. Ross"},{"value":"C","text":"Emile Durkheim"},{"value":"D","text":"Max Weber"}],"answer":"B"},{"id":144,"question":"Which of the following is NOT a key feature of social control?","options":[{"value":"A","text":"It regulates behaviour"},{"value":"B","text":"It is universal"},{"value":"C","text":"It remains fixed and never changes"},{"value":"D" [{"value":"A","text":"Mutual awareness"},{"value":"B","text":"We-feeling"},{"value":"C","text":"Random crowd gathering"},{"value":"D","text":"Group norms"}],"answer":"C"},{"id":153,"question":"Which of the following is NOT an example of an associational group?","options":[{"value":"A","text":"State government"},{"value":"B","text":"Labour union"},{"value":"C","text":"Family"},{"value":"D","text":"Political party"}],"answer":"C"},{"id":154,"question":"Which of the following is an example of an involuntary group?","options":[{"value":"A","text":"Club"},{"value":"B","text":"Family"},{"value":"C","text":"Political party"},{"value":"D","text":"Trade union"}],"answer":"B"},{"id":155,"question":"Who introduced the concept of primary and secondary groups?","options":[{"value":"A","text":"Sorokin"},{"value":"B","text":"C.H. Cooley"},{"value":"C","text":"Sanderson"},{"value":"D","text":"Ellwood"}],"answer":"B"},{"id":156,"question":"Organised groups are also known as:","options":[{"value":"A","text":"Informal groups"},{"value":"B","text":"Associational groups"},{"value":"C","text":"Primary groups"},{"value":"D","text":"Secondary groups"}],"answer":"B"},{"id":157,"question":"What is socialization?","options":[{"value":"A","text":"A biological process of growth"},{"value":"B","text":"A process of learning social behaviour"},{"value":"C","text":"A political activity"},{"value":"D","text":"An economic system"}],"answer":"B"},{"id":158,"question":"Which of the following is NOT a goal of socialization?","options":[{"value":"A","text":"Impulse control"},{"value":"B","text":"Role preparation"},{"value":"C","text":"Cultural isolation"},{"value":"D","text":"Value development"}],"answer":"C"},{"id":159,"question":"Informal socialization mainly occurs in:","options":[{"value":"A","text":"Factories"},{"value":"B","text":"Courts"},{"value":"C","text":"Family and peer groups"},{"value":"D","text":"Government offices"}],"answer":"C"},{"id":160,"question":"What is primary socialisation?","options":[{"value":"A","text":"Learning roles in school and workplace"},{"value":"B","text":"The first stage of socialisation, mainly through family"},{"value":"C","text":"Learning new behaviours as an adult"},{"value":"D","text":"Socialization through peer groups"}],"answer":"B"},{"id":161,"question":"Which example best represents anticipatory socialisation?","options":[{"value":"A","text":"A child learning manners at home"},{"value":"B","text":"A teenager joining a new peer group"},{"value":"C","text":"A person moving to a new country"},{"value":"D","text":"A student preparing for a career by learning professional behaviour"}],"answer":"D"},{"id":162,"question":"What is developmental socialisation?","options":[{"value":"A","text":"Learning from family in early childhood"},{"value":"B","text":"Learning in total institutions"},{"value":"C","text":"Continuous learning through different life stages"},{"value":"D","text":"Peer pressure during adolescence"}],"answer":"C"},{"id":163,"question":"What is gender socialisation?","options":[{"value":"A","text":"Learning social rules through school"},{"value":"B","text":"Learning gender roles and expectations set by society"},{"value":"C","text":"Learning new career skills"},{"value":"D","text":"Learning peer group behaviour"}],"answer":"B"},{"id":164,"question":"Which is the first and most basic agent of socialisation?","options":[{"value":"A","text":"School"},{"value":"B","text":"Peer group"},{"value":"C","text":"Family"},{"value":"D","text":"Mass media"}],"answer":"C"},{"id":165,"question":"Which agent of socialisation helps individuals develop moral values and a sense of right and wrong?","options":[{"value":"A","text":"Peer group"},{"value":"B","text":"Religion"},{"value":"C","text":"Workplace"},{"value":"D","text":"Mass media"}],"answer":"B"},{"id":166,"question":"Which agent of socialisation plays an important role during adult life?","options":[{"value":"A","text":"Family"},{"value":"B","text":"Peer group"},{"value":"C"," y adjustment to avoid conflict"},{"value":"C","text":"Biological adaptation"},{"value":"D","text":"Elimination of differences"}],"answer":"B"},{"id":174,"question":"Which sociologist introduced the concept of accommodation?","options":[{"value":"A","text":"Robert Park"},{"value":"B","text":"Burgess"},{"value":"C","text":"J. M. Baldwin"},{"value":"D","text":"MacIver"}],"answer":"C"},{"id":175,"question":"Assimilation is best described as:","options":[{"value":"A","text":"Sudden adjustment"},{"value":"B","text":"Temporary compromise"},{"value":"C","text":"Gradual cultural absorption"},{"value":"D","text":"Forced agreement"}],"answer":"C"},{"id":176,"question":"Social interaction is considered the basic building block of:","options":[{"value":"A","text":"Economic systems"},{"value":"B","text":"Social relationships"},{"value":"C","text":"Physical development"},{"value":"D","text":"Religious beliefs"}],"answer":"B"},{"id":177,"question":"According to Cooley, cooperation occurs when:","options":[{"value":"A","text":"People are forced to work together"},{"value":"B","text":"Individuals recognize a common interest"},{"value":"C","text":"People have similar physical strength"},{"value":"D","text":"Individuals compete with each other"}],"answer":"B"},{"id":178,"question":"Which of the following best explains the role of cooperation in society?","options":[{"value":"A","text":"It only benefits individuals"},{"value":"B","text":"It supports social progress and stability"},{"value":"C","text":"It is unnecessary in modern life"},{"value":"D","text":"It causes chaos in society"}],"answer":"B"},{"id":179,"question":"Young and Mack state that cooperation requires:","options":[{"value":"A","text":"Individual success only"},{"value":"B","text":"Complete independence"},{"value":"C","text":"No need for skills"},{"value":"D","text":"Shared motivation and training"}],"answer":"D"},{"id":180,"question":"Social interaction is important because it:","options":[{"value":"A","text":"Weakens social relationships"},{"value":"B","text":"Reduces communication"},{"value":"C","text":"Creates social roles and norms"},{"value":"D","text":"Promotes individual isolation"}],"answer":"C"},{"id":181,"question":"Competition is best described as a:","options":[{"value":"A","text":"Friendly cooperation"},{"value":"B","text":"Goal-oriented conflict"},{"value":"C","text":"Social harmony"},{"value":"D","text":"Complete equality"}],"answer":"B"},{"id":182,"question":"Which of the following is a feature of competition?","options":[{"value":"A","text":"It is always personal"},{"value":"B","text":"It is always visible"},{"value":"C","text":"It is often unconscious"},{"value":"D","text":"It requires direct communication"}],"answer":"C"},{"id":183,"question":"Competition is dynamic because it:","options":[{"value":"A","text":"Stops social change"},{"value":"B","text":"Encourages innovation and progress"},{"value":"C","text":"Promotes static society"},{"value":"D","text":"Eliminates the need for growth"}],"answer":"B"},{"id":184,"question":"According to H.T. Mazumdar, competition helps to:","options":[{"value":"A","text":"Increase monopoly"},{"value":"B","text":"Reduce motivation"},{"value":"C","text":"Prevent accumulation of power"},{"value":"D","text":"Promote laziness"}],"answer":"C"},{"id":185,"question":"Cultural competition occurs when:","options":[{"value":"A","text":"Two cultures compete for dominance"},{"value":"B","text":"Two people compete for a job"},{"value":"C","text":"Political parties compete for votes"},{"value":"D","text":"Students compete for ranks"}],"answer":"A"},{"id":186,"question":"Conflict occurs when people give more importance to:","options":[{"value":"A","text":"Common goals"},{"value":"B","text":"Personal interests"},{"value":"C","text":"Group harmony"},{"value":"D","text":"Fair competition"}],"answer":"B"},{"id":187,"question":"According to","options":[{"value":"A","text":"W. Green, conflict is:"},{"value":"A","text":"A peaceful process"},{"value":"B","text":"A deliberate attempt to oppose others"},{"value":"C","text":"A form of cooperation"}],"answer":"B"},{"id":188,"question":"Long-term conflict resolution where groups become similar is called:","options":[{"value":"A","text":"Accommodation"},{"value":"B","text":"Assimilation"},{"value":"C","text":"Violence"},{"value":"D","text":"Disintegration"}],"answer":"B"},{"id":189,"question":"Which type of group is a temporary collection of people with no meaningful interaction?","options":[{"value":"A","text":"Social group"},{"value":"B","text":"Associational group"},{"value":"C","text":"Aggregate"},{"value":"D","text":"Societal group"}],"answer":"C"},{"id":190,"question":"Which group has a formal structure with written rules and defined membership?","options":[{"value":"A","text":"Aggregate"},{"value":"B","text":"Societal group"},{"value":"C","text":"Social group"},{"value":"D","text":"Associational group"}],"answer":"D"},{"id":191,"question":"The word “society” is derived from which Latin word?","options":[{"value":"A","text":"Socialis"},{"value":"B","text":"Socius"},{"value":"C","text":"Societas"},{"value":"D","text":"Socio"}],"answer":"B"},{"id":192,"question":"According to R. M. MacIver, society is best described as:","options":[{"value":"A","text":"A group of individuals"},{"value":"B","text":"A collection of institutions"},{"value":"C","text":"A web of social relationships"},{"value":"D","text":"A political organization"}],"answer":"C"},{"id":193,"question":"The functional approach views society mainly as:","options":[{"value":"A","text":"A fixed structure"},{"value":"B","text":"A legal system"},{"value":"C","text":"A continuous process of interaction"},{"value":"D","text":"A political unit"}],"answer":"C"},{"id":194,"question":"Which of the following is NOT a basic societal need according to Kingsley Davis?","options":[{"value":"A","text":"Population"},{"value":"B","text":"Specialization"},{"value":"C","text":"Solidarity"},{"value":"D","text":"Industrialization"}],"answer":"D"},{"id":195,"question":"Which of the following is NOT a characteristic of society?","options":[{"value":"A","text":"Permanence"},{"value":"B","text":"Interdependence"},{"value":"C","text":"Isolation"},{"value":"D","text":"Change"}],"answer":"C"},{"id":196,"question":"Which society is mainly based on farming and land ownership?","options":[{"value":"A","text":"Industrial society"},{"value":"B","text":"Post-industrial society"},{"value":"C","text":"Agrarian society"},{"value":"D","text":"Information society"}],"answer":"C"},{"id":197,"question":"The shift from family-based production to factory production is a feature of:","options":[{"value":"A","text":"Agrarian society"},{"value":"B","text":"Industrial society"},{"value":"C","text":"Post-industrial society"},{"value":"D","text":"Tribal society"}],"answer":"B"},{"id":198,"question":"Post-industrial society is also known as:","options":[{"value":"A","text":"Agrarian society"},{"value":"B","text":"Industrial society"},{"value":"C","text":"Information society"},{"value":"D","text":"Feudal society"}],"answer":"C"},{"id":199,"question":"Social institutions are mainly responsible for:","options":[{"value":"A","text":"Individual entertainment"},{"value":"B","text":"Organising and guiding social life"},{"value":"C","text":"Creating structures"},{"value":"D","text":"Isolating individuals"}],"answer":"B"},{"id":200,"question":"The concept of social institutions as “established ways of relationships” was given by:","options":[{"value":"A","text":"Kingsley Davis"},{"value":"B","text":"Morris Ginsberg"},{"value":"C","text":"Durkheim"},{"value":"D","text":"MacIver"}],"answer":"D"},{"id":201,"question":"Enacted institutions are:","options":[{"value":"A","text":"Natural"},{"value":"B","text":"Unplanned"},{"value":"C","text":"Informal"},{"value":"D","text":"Deliberately created"}],"answer":"D"},{"id":202,"question":"Manifest functions are:","options":[{"value":"A","text":"Hidden functions"},{"value":"B","text":"Unintended effects"},{"value":"C","text":"Intended and visible functions"},{"value":"D","text":"Negative outcomes"}],"answer":"C"},{"id":203,"question":"Social structure refers to:","options":[{"value":"A","text":"Individual behaviour only"},{"value":"B","text":"Random social interactions"},{"value":"C","text":"Organized pattern of relationships in society"},{"value":"D","text":"Economic activities only"}],"answer":"C"},{"id":204,"question":"Who defined social structure as a network of relationships?","options":[{"value":"A","text":"A. R. Radcliffe-Brown"},{"value":"B","text":"Émile Durkheim"},{"value":"C","text":"Karl Marx"},{"value":"D","text":"Max Weber"}],"answer":"A"},{"id":205,"question":"Norms are:","options":[{"value":"A","text":"Scientific laws"},{"value":"B","text":"Rules that guide behaviour"},{"value":"C","text":"Economic behaviour"},{"value":"D","text":"Personal opinions"}],"answer":"B"},{"id":206,"question":"Permissive norms refer to:","options":[{"value":"A","text":"Duties only"},{"value":"B","text":"Boundaries of acceptable behaviour"},{"value":"C","text":"Economic rules"},{"value":"D","text":"Religious beliefs"}],"answer":"B"},{"id":207,"question":"What does the term \"status\" refer to in sociology?","options":[{"value":"A","text":"A person's effort"},{"value":"B","text":"A person's Behaviour"},{"value":"C","text":"A person's ability"},{"value":"D","text":"A person's position in society"}],"answer":"D"},{"id":208,"question":"According to H. M. Johnson, status consists of:","options":[{"value":"A","text":"Rights and obligations"},{"value":"B","text":"Power and prestige"},{"value":"C","text":"Wealth and authority"},{"value":"D","text":"Roles and norms"}],"answer":"A"},{"id":209,"question":"Ascribed status is:","options":[{"value":"A","text":"Earned through effort"},{"value":"B","text":"Given at birth"},{"value":"C","text":"Temporary"},{"value":"D","text":"Based on education"}],"answer":"B"},{"id":210,"question":"Becoming a doctor is an example of:","options":[{"value":"A","text":"Ascribed status"},{"value":"B","text":"Social norm"},{"value":"C","text":"Achieved status"},{"value":"D","text":"Social value"}],"answer":"C"},{"id":211,"question":"In sociology, a role refers to:","options":[{"value":"A","text":"A person's self esteem"},{"value":"B","text":"A person's personal opinion"},{"value":"C","text":"A person's physical appearance"},{"value":"D","text":"The expected behaviour of a person in a position"}],"answer":"D"},{"id":212,"question":"A \"role set\" refers to:","options":[{"value":"A","text":"One role performed by many people"},{"value":"B","text":"Many roles linked to one status"},{"value":"C","text":"One role linked to one status"},{"value":"D","text":"Many statuses linked to one role"}],"answer":"B"},{"id":213,"question":"Role conflict occurs when:","options":[{"value":"A","text":"A person fails to perform any role"},{"value":"B","text":"A person performs only one role"},{"value":"C","text":"Two or more roles create conflicting demands"},{"value":"D","text":"A role is not clearly defined"}],"answer":"C"},{"id":214,"question":"Which of the following is a key characteristic of social change?","options":[{"value":"A","text":"It is static"},{"value":"B","text":"It is continuous"},{"value":"C","text":"It is predictable in all societies"},{"value":"D","text":"It only affects government"}],"answer":"B"},{"id":215,"question":"Which of the following is an example of diffusion in social change?","options":[{"value":"A","text":"Discovery of blood circulation"},{"value":"B","text":"Invention of the car"},{"value":"C","text":"Spread of the English language in India"},{"value":"D","text":"Industrialisation"}],"answer":"C"},{"id":216,"question":"Which statement about social change is correct?","options":[{"value":"A","text":"It is always negative"},{"value":"B","text":"It can be planned or unplanned"},{"value":"C","text":"It only affects rural societies"},{"value":"D","text":"It occurs at the same speed everywhere"}],"answer":"B"},{"id":217,"question":"Which country first experienced the Industrial Revolution?","options":[{"value":"A","text":"Germany"},{"value":"B","text":"France"},{"value":"C","text":"Italy"},{"value":"D","text":"United Kingdom"}],"answer":"D"},{"id":218,"question":"What is the shift from agrarian to industrial society called?","options":[{"value":"A","text":"Migration"},{"value":"B","text":"Industrialization"},{"value":"C","text":"Urbanization"},{"value":"D","text":"Socialization"}],"answer":"B"},{"id":219,"question":"The transformation from an agrarian economy to an industrial economy is called _________","options":[{"value":"A","text":"Industrialization"},{"value":"B","text":"Migration"},{"value":"C","text":"Industrial revolution"},{"value":"D","text":"Urbanization"}],"answer":"C"},{"id":220,"question":"Who developed the philosophy of positivism?","options":[{"value":"A","text":"Auguste Comte"},{"value":"B","text":"Emile Durkheim"},{"value":"C","text":"Max Weber"},{"value":"D","text":"Karl Marx"}],"answer":"A"},{"id":221,"question":"The book The Social Order was written by ______","options":[{"value":"A","text":"Charles Horton Cooley"},{"value":"B","text":"Robert Bierstedt"},{"value":"C","text":"Jean-Jacques Rousseau"},{"value":"D","text":"Auguste Comte"}],"answer":"B"},{"id":222,"question":"Sociology is the science of ________","options":[{"value":"A","text":"Mind"},{"value":"B","text":"Soul"},{"value":"C","text":"Society"},{"value":"D","text":"Individual"}],"answer":"C"},{"id":223,"question":"Alfred Vierkandt belonged to the ___________ school","options":[{"value":"A","text":"Synthetic School"},{"value":"B","text":"Specialistic or Formalistic School"},{"value":"C","text":"Historical School"},{"value":"D","text":"Behaviorist School"}],"answer":"B"},{"id":224,"question":"Gemeinschaft and Gesellshcaft were introduced by _______","options":[{"value":"A","text":"Max Weber"},{"value":"B","text":"Emile Durkheim"},{"value":"C","text":"Ferdinand Tonnies"},{"value":"D","text":"Karl Marx"}],"answer":"C"},{"id":225,"question":"Karl Mannheim divided sociology into systematic and general and _____ sociology","options":[{"value":"A","text":"Historical"},{"value":"B","text":"Structural"},{"value":"C","text":"Individual"},{"value":"D","text":"Empirical"}],"answer":"A"},{"id":226,"question":"Medial Sociology primarily studies","options":[{"value":"A","text":"Workplaces and industries"},{"value":"B","text":"Health, illness, and healthcare"},{"value":"C","text":"Village life and agriculture"},{"value":"D","text":"Urban development"}],"answer":"B"}]
const N=60,MIN=30;let test=[],answers={},pos=0,seconds=MIN*60,interval=null,studentName='',submitted=false;
const $=id=>document.getElementById(id);
const GREETINGS=['Welcome! 📚 Ready for Sociology? Think carefully and do your best! 🌟','Hello! 👋 Challenge yourself with 60 questions and stay confident! 💪','Good luck! 🎓 Read each question carefully and show what you know!','Welcome to your mock test! 🧠✨ Stay focused and keep going!'];function setGreeting(){$('greeting').textContent=GREETINGS[Math.floor(Math.random()*GREETINGS.length)]}function shuffle(arr){let x=arr.slice();for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function screen(id){['start','test','result'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}
function startTest(){studentName=$('name').value.trim();if(!studentName){$('msg').textContent='Please enter Student Name.';return}test=shuffle(QUESTIONS).slice(0,N);answers={};pos=0;seconds=MIN*60;submitted=false;screen('test');render();clearInterval(interval);interval=setInterval(tick,1000);tick()}
function tick(){seconds--;if(seconds<0)seconds=0;$('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds===0)submit(true)}
function render(){let q=test[pos];$('counter').textContent='Question '+(pos+1)+' of '+N;$('question').textContent=q.question;$('options').innerHTML=q.options.map(o=>'<label class="opt"><input type="radio" name="answer" value="'+o.value+'" '+(answers[pos]===o.value?'checked':'')+'> '+o.value+') '+o.text+'</label>').join('');document.querySelectorAll('input[name=answer]').forEach(x=>x.addEventListener('change',()=>{answers[pos]=x.value;renderNav()}));$('prev').disabled=pos===0;$('next').disabled=pos===N-1;$('submit').style.display=(pos>=N-3?'inline-block':'none');renderNav()}
function renderNav(){let h='';test.forEach((q,i)=>h+='<button class="'+(answers[i]?'answered ':'')+(i===pos?'current':'')+'" data-i="'+i+'">'+(i+1)+'</button>');$('nav').innerHTML=h;document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{pos=Number(b.dataset.i);render()})}
function submit(auto){if(submitted)return;if(!auto&&!confirm('Are you sure you want to submit the test?'))return;submitted=true;clearInterval(interval);let correct=0,wrong=0,unanswered=0;test.forEach((q,i)=>{if(!answers[i])unanswered++;else if(answers[i]===q.answer)correct++;else wrong++});let attempted=correct+wrong,pct=correct/N*100,accuracy=attempted?correct/attempted*100:0;showReport(correct,wrong,unanswered,attempted,pct,accuracy,auto)}
function showReport(correct,wrong,unanswered,attempted,pct,accuracy,auto){$('rname').textContent=studentName;$('score').textContent=correct+' / '+N;$('pct').textContent=pct.toFixed(1)+'%';$('attempted').textContent=attempted+' / '+N;$('correct').textContent=correct;$('wrong').textContent=wrong;$('unanswered').textContent=unanswered;$('accuracy').textContent=accuracy.toFixed(1)+'%';$('status').textContent=pct>=40?'PASS':'NEEDS IMPROVEMENT';$('message').textContent=auto?'Time expired — submitted automatically.':'Test submitted successfully.';let h='';test.forEach((q,i)=>{let your=answers[i]||'Not answered',ok=your===q.answer,res=ok?'Correct':your==='Not answered'?'Unanswered':'Wrong',co=q.options.find(o=>o.value===q.answer);h+='<div class="'+res.toLowerCase()+'"><b>Q'+(i+1)+'. '+q.question+'</b><br>Your answer: '+your+'<br>Correct answer: '+q.answer+') '+co.text+'<br><b>'+res+'</b></div>'});$('review').innerHTML=h;screen('result');window.scrollTo({top:0,behavior:'smooth'})}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function saveReport(){let rows=test.map((q,i)=>{let your=answers[i]||'Not answered',co=q.options.find(o=>o.value===q.answer);let res=your===q.answer?'Correct':your==='Not answered'?'Unanswered':'Wrong';return '<tr><td>'+(i+1)+'</td><td>'+escapeHtml(q.question)+'</td><td>'+escapeHtml(your)+'</td><td>'+escapeHtml(q.answer+') '+co.text)+'</td><td>'+res+'</td></tr>'}).join('');let html='<!doctype html><html><head><meta charset="utf-8"><title>Sociology Final Report</title></head><body><h1>Sociology Mock Test – Final Report</h1><p><b>Student:</b> '+escapeHtml(studentName)+'</p><p><b>Score:</b> '+$('score').textContent+' | <b>Percentage:</b> '+$('pct').textContent+' | <b>Status:</b> '+$('status').textContent+'</p><table border="1" cellpadding="7" cellspacing="0"><tr><th>No.</th><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th></tr>'+rows+'</table></body></html>';let blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Sociology_Final_Report.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function finish(){clearInterval(interval);submitted=false;test=[];answers={};pos=0;studentName='';$('name').value='';$('msg').textContent='';screen('start');window.scrollTo(0,0)}
setGreeting();$('startBtn').onclick=startTest;$('prev').onclick=()=>{if(pos>0){pos--;render()}};$('next').onclick=()=>{if(pos<N-1){pos++;render()}};$('submit').onclick=()=>submit(false);$('save').onclick=saveReport;$('print').onclick=()=>window.print();$('startAgain').onclick=finish;
</script></body></html>
