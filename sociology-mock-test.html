":"Population and structure"},{"value":"C","text":"Social control"},{"value":"D","text":"Social behaviour"}],"answer":"B"},{"id":49,"question":"Sociology helps in:","options":[{"value":"A","text":"Ignoring problems"},{"value":"B","text":"Solving social problems"},{"value":"C","text":"Creating conflicts"},{"value":"D","text":"Avoiding society"}],"answer":"B"},{"id":50,"question":"Sociology uses which method for study?","options":[{"value":"A","text":"Religious method"},{"value":"B","text":"Scientific method"},{"value":"C","text":"Mythological method"},{"value":"D","text":"Philosophical guessing"}],"answer":"B"},{"id":51,"question":"Observation in sociology means:","options":[{"value":"A","text":"Random watching"},{"value":"B","text":"Scientific and systematic watching"},{"value":"C","text":"Guessing facts"},{"value":"D","text":"Imagining reality"}],"answer":"B"},{"id":52,"question":"Experimental method in sociology is:","options":[{"value":"A","text":"Always easy"},{"value":"B","text":"Impossible"},{"value":"C","text":"Difficult to apply strictly"},{"value":"D","text":"Not used"}],"answer":"C"},{"id":53,"question":"Sociology is considered a general science because it studies:","options":[{"value":"A","text":"Only economy"},{"value":"B","text":"Only politics"},{"value":"C","text":"Society as a whole"},{"value":"D","text":"Only culture"}],"answer":"C"},{"id":54,"question":"Alfred Vierkandt belonged to the:","options":[{"value":"A","text":"Synthetic School"},{"value":"B","text":"Historical School"},{"value":"C","text":"Specialistic (Formalistic) School"},{"value":"D","text":"Positivist School"}],"answer":"C"},{"id":55,"question":"Medical Sociology primarily studies:","options":[{"value":"A","text":"Workplaces and industries"},{"value":"B","text":"Health, illness, and healthcare"},{"value":"C","text":"Village life and agriculture"},{"value":"D","text":"Urban development"}],"answer":"B"},{"id":56,"question":"Industrial Sociology originated in:","options":[{"value":"A","te lue":"B","text":"Human social behaviour and society"},{"value":"C","text":"Physical laws"},{"value":"D","text":"Biological systems"}],"answer":"B"},{"id":89,"question":"Which of the following is NOT a characteristic of sociological research?","options":[{"value":"A","text":"Objectivity"},{"value":"B","text":"Empirical basis"},{"value":"C","text":"Personal bias"},{"value":"D","text":"Verifiability"}],"answer":"C"},{"id":90,"question":"Pure research mainly aims at:","options":[{"value":"A","text":"Immediate problem-solving"},{"value":"B","text":"Profit making"},{"value":"C","text":"Knowledge creation"},{"value":"D","text":"Social control"}],"answer":"C"},{"id":91,"question":"Qualitative research deals with:","options":[{"value":"A","text":"Numbers"},{"value":"B","text":"Measurement"},{"value":"C","text":"Qualities and experiences"},{"value":"D","text":"Statistics only"}],"answer":"C"},{"id":92,"question":"The first step in the research process is:","options":[{"value":"A","text":"Data collection"},{"value":"B","text":"Hypothesis formulation"},{"value":"C","text":"Identification of research problem"},{"value":"D","text":"Reporting"}],"answer":"C"},{"id":93,"question":"A hypothesis is:","options":[{"value":"A","text":"Final result"},{"value":"B","text":"Proven fact"},{"value":"C","text":"Tentative statement"},{"value":"D","text":"Random guess"}],"answer":"C"},{"id":94,"question":"The final step in the research process is:","options":[{"value":"A","text":"Hypothesis"},{"value":"B","text":"Data collection"},{"value":"C","text":"Reporting"},{"value":"D","text":"Analysis"}],"answer":"C"},{"id":95,"question":"Ethics refers to:","options":[{"value":"A","text":"Scientific tools"},{"value":"B","text":"Moral principles guiding behavior"},{"value":"C","text":"Data collection methods"},{"value":"D","text":"Statistical analysis"}],"answer":"B"},{"id":96,"question":"Which of the following is an unethical practice?","options":[{"value":"A","text":"Informed consent"},{"value":"B","tex value":"A","text":"Herbert Blumer"},{"value":"B","text":"George Herbert Mead"},{"value":"C","text":"Harold Garfinkel"},{"value":"D","text":"Alfred Schutz"}],"answer":"B"},{"id":105,"question":"Symbolic Interactionism mainly focuses on:","options":[{"value":"A","text":"Large-scale social structures"},{"value":"B","text":"Economic systems"},{"value":"C","text":"Daily interactions and meanings"},{"value":"D","text":"Political institutions"}],"answer":"C"},{"id":106,"question":"Who is the founder of Ethnomethodology?","options":[{"value":"A","text":"George C. Homans"},{"value":"B","text":"Harold Garfinkel"},{"value":"C","text":"Alfred Schutz"},{"value":"D","text":"Herbert Blumer"}],"answer":"B"},{"id":107,"question":"Who developed Exchange Theory?","options":[{"value":"A","text":"Harold Garfinkel"},{"value":"B","text":"George C. Homans"},{"value":"C","text":"Alfred Schutz"},{"value":"D","text":"Charles Horton Cooley"}],"answer":"B"},{"id":62,"question":"Sociology is considered a general social science because it:","options":[{"value":"A","text":"Studies only politics"},{"value":"B","text":"Studies society as a whole"},{"value":"C","text":"Focuses only on economy"},{"value":"D","text":"Studies only history"}],"answer":"B"},{"id":63,"question":"Political Science mainly studies:","options":[{"value":"A","text":"Social relationships"},{"value":"B","text":"Cultural values"},{"value":"C","text":"Formal political institutions"},{"value":"D","text":"Family systems"}],"answer":"C"},{"id":64,"question":"Which of the following is studied by Political Science?","options":[{"value":"A","text":"Kinship"},{"value":"B","text":"Electoral systems"},{"value":"C","text":"Social norms"},{"value":"D","text":"Rituals"}],"answer":"B"},{"id":65,"question":"Economics is mainly concerned with:","options":[{"value":"A","text":"Religion"},{"value":"B","text":"Production, distribution, and consumption"},{"value":"C","text":"Social norms"},{"value":"D","text":"Political institutions"}],"answer":"B"}, const N=60,MIN=30;let test=[],answers={},pos=0,seconds=MIN*60,interval=null,studentName='',submitted=false;
const $=id=>document.getElementById(id);
function shuffle(arr){let x=arr.slice();for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function screen(id){['start','test','result'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}
function startTest(){studentName=$('name').value.trim();if(!studentName){$('msg').textContent='Please enter Student Name.';return}test=shuffle(QUESTIONS.filter(q=>q.id!==3)).slice(0,N);answers={};pos=0;seconds=MIN*60;submitted=false;screen('test');render();clearInterval(interval);interval=setInterval(tick,1000);tick()}
function tick(){seconds--;if(seconds<0)seconds=0;$('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds===0)submit(true)}
function render(){let q=test[pos];$('counter').textContent='Question '+(pos+1)+' of '+N;$('question').textContent=q.question;$('options').innerHTML=q.options.map(o=>'<label class="opt"><input type="radio" name="answer" value="'+o.value+'" '+(answers[pos]===o.value?'checked':'')+'> '+o.value+') '+o.text+'</label>').join('');document.querySelectorAll('input[name=answer]').forEach(x=>x.addEventListener('change',()=>{answers[pos]=x.value;renderNav()}));$('prev').disabled=pos===0;$('next').disabled=pos===N-1;$('submit').style.display=(pos>=N-3?'inline-block':'none');renderNav()}
function renderNav(){let h='';test.forEach((q,i)=>h+='<button class="'+(answers[i]?'answered ':'')+(i===pos?'current':'')+'" data-i="'+i+'">'+(i+1)+'</button>');$('nav').innerHTML=h;document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{pos=Number(b.dataset.i);render()})}
function submit(auto){if(submitted)return;if(!auto&&!confirm('Are you sure you want to submit the test?'))return;submitted=true;clearInterval(interval);let correct=0,wrong=0,unanswered=0;test.forEach((q,i)=>{if(!answers[i])unanswered++;else if(answers[i]===q.answer)correct++;else wrong++});let attempted=correct+wrong,pct=correct/N*100,accuracy=attempted?correct/attempted*100:0;showReport(correct,wrong,unanswered,attempted,pct,accuracy,auto)}
function showReport(correct,wrong,unanswered,attempted,pct,accuracy,auto){$('rname').textContent=studentName;$('score').textContent=correct+' / '+N;$('pct').textContent=pct.toFixed(1)+'%';$('attempted').textContent=attempted+' / '+N;$('correct').textContent=correct;$('wrong').textContent=wrong;$('unanswered').textContent=unanswered;$('accuracy').textContent=accuracy.toFixed(1)+'%';$('status').textContent=pct>=40?'PASS':'NEEDS IMPROVEMENT';$('message').textContent=auto?'Time expired — submitted automatically.':'Test submitted successfully.';let h='';test.forEach((q,i)=>{let your=answers[i]||'Not answered',ok=your===q.answer,res=ok?'Correct':your==='Not answered'?'Unanswered':'Wrong',co=q.options.find(o=>o.value===q.answer);h+='<div class="'+res.toLowerCase()+'"><b>Q'+(i+1)+'. '+q.question+'</b><br>Your answer: '+your+'<br>Correct answer: '+q.answer+') '+co.text+'<br><b>'+res+'</b></div>'});$('review').innerHTML=h;screen('result');window.scrollTo(0,0)}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function saveReport(){let rows=test.map((q,i)=>{let your=answers[i]||'Not answered',co=q.options.find(o=>o.value===q.answer);let res=your===q.answer?'Correct':your==='Not answered'?'Unanswered':'Wrong';return '<tr><td>'+(i+1)+'</td><td>'+escapeHtml(q.question)+'</td><td>'+escapeHtml(your)+'</td><td>'+escapeHtml(q.answer+') '+co.text)+'</td><td>'+res+'</td></tr>'}).join('');let html='<!doctype html><html><head><meta charset="utf-8"><title>Sociology Final Report</title></head><body><h1>Sociology Mock Test – Final Report</h1><p><b>Student:</b> '+escapeHtml(studentName)+'</p><p><b>Score:</b> '+$('score').textContent+' | <b>Percentage:</b> '+$('pct').textContent+' | <b>Status:</b> '+$('status').textContent+'</p><table border="1" cellpadding="7" cellspacing="0"><tr><th>No.</th><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th></tr>'+rows+'</table></body></html>';let blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Sociology_Final_Report.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function finish(){submitted=false;test=[];answers={};pos=0;studentName='';$('name').value='';$('msg').textContent='';screen('start');window.scrollTo(0,0)}
$('startBtn').onclick=startTest;$('prev').onclick=()=>{if(pos>0){pos--;render()}};$('next').onclick=()=>{if(pos<N-1){pos++;render()}};$('submit').onclick=()=>submit(false);$('save').onclick=saveReport;$('print').onclick=()=>window.print();$('finish').onclick=finish;
</script></body></html>
