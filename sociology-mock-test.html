<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sociology Mock Test</title><style>
body{font-family:"Segoe UI",Arial,sans-serif;background:#f4f7fb;margin:0;color:#17202a}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 5px 20px #0001}.hidden{display:none}.btn{border:0;border-radius:9px;padding:12px 18px;font-weight:bold;cursor:pointer}.primary{background:#2563eb;color:#fff}.danger{background:#dc2626;color:#fff}.secondary{background:#e2e8f0}.field input{width:100%;padding:13px;box-sizing:border-box;border:1px solid #ccd6e2;border-radius:9px;font-size:16px}.q{font-size:21px;font-weight:bold;margin:25px 0}.opt{display:block;padding:14px;margin:10px 0;border:1px solid #d7dee8;border-radius:10px}.top{display:flex;justify-content:space-between}.timer{color:#dc2626;font-weight:bold;font-size:20px}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:22px;flex-wrap:wrap}.result-actions{position:sticky;top:0;z-index:20;background:#fff;padding:12px 0;border-bottom:1px solid #e2e8f0;box-shadow:0 4px 12px #00000010;animation:slideDown .45s ease}.result-actions .btn{transition:transform .2s ease,box-shadow .2s ease}.result-actions .btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px #0002}@keyframes slideDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}.score{text-align:center;font-size:48px;font-weight:bold;color:#2563eb}.student-name{font-family:"Times New Roman",Times,serif;font-size:24px;font-weight:700;color:#1d4ed8;text-decoration:underline;background:linear-gradient(135deg,#eff6ff,#dbeafe);padding:9px 18px;border-radius:12px;border:1px solid #bfdbfe;box-shadow:0 4px 12px #2563eb22;background:#f8fafc;padding:7px 12px;border-radius:8px;display:inline-block}.status-badge{font-weight:900;padding:6px 12px;border-radius:8px;display:inline-block}.status-excellent{color:#166534;background:#dcfce7}.status-good{color:#1d4ed8;background:#dbeafe}.status-pass{color:#a16207;background:#fef3c7}.status-needs{color:#b91c1c;background:#fee2e2}.main-title{color:#7c3aed;font-weight:900}.greeting{text-align:center;margin:18px 0 22px;padding:18px 20px;border-radius:14px;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;font-size:20px;font-weight:800}.motivation{text-align:center;margin:18px 0;padding:16px 20px;border-radius:12px;background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;font-size:19px;font-weight:700}.review-card{padding:16px;margin:12px 0;border-radius:12px;background:#fff;border:1px solid #e2e8f0}.review-q{font-weight:700;font-size:17px;line-height:1.45;margin-bottom:12px}.review-line{display:flex;justify-content:space-between;gap:15px;padding:8px 0;border-top:1px solid #e2e8f0}.review-line span{color:#64748b}.result-badge{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:20px;font-weight:700}.review-card.correct{border-left:6px solid #16a34a;background:#f0fdf4}.review-card.wrong{border-left:6px solid #dc2626;background:#fef2f2}.review-card.not-answered{border-left:6px solid #f59e0b;background:#fffbeb}.nav{display:flex;gap:4px;flex-wrap:wrap;margin:15px 0}.nav button{width:34px;height:30px;border:1px solid #ccd6e2;background:#fff;border-radius:5px}.answered{background:#dcfce7!important}.current{outline:2px solid #2563eb}</style></head><body><div class="wrap">
<section id="start" class="card"><h1 class="main-title">Sociology Mock Test</h1><div id="greeting" class="greeting"></div><p><b>60 Questions • 30 Minutes</b></p><div class="field"><b>Student Name</b><input id="name"></div><br><button id="startBtn" class="btn primary">Start Mock Test</button><p id="msg"></p></section>
<section id="test" class="card hidden"><div class="top"><b id="counter"></b><span>Time: <span id="timer" class="timer">30:00</span></span></div><div id="nav" class="nav"></div><div id="question" class="q"></div><div id="options"></div><div class="actions"><button id="prev" class="btn secondary">Previous</button><button id="next" class="btn primary">Next</button><button id="submit" class="btn danger" style="display:none">Submit Test</button></div></section>
<section id="result" class="card hidden"><div class="result-actions actions"><button id="save" class="btn primary">Save Analysis Report</button><button id="print" class="btn secondary">Print / Save PDF</button><button id="startAgain" type="button" class="btn danger" onclick="finish()">Start Again</button></div><h1>Final Report</h1><p><b>Student:</b> <span id="rname" class="student-name"></span></p><div id="score" class="score"></div><p><b>Percentage:</b> <span id="pct"></span></p><p><b>Attempted:</b> <span id="attempted"></span> &nbsp; <b>Correct:</b> <span id="correct"></span> &nbsp; <b>Wrong:</b> <span id="wrong"></span> &nbsp; <b>Unanswered:</b> <span id="unanswered"></span></p><p><b>Accuracy:</b> <span id="accuracy"></span> &nbsp; <b>Status:</b> <span id="status"></span></p><p id="message"></p><div id="motivation" class="motivation"></div><h2>Question-wise Review</h2><div id="review"></div></section></div>
<script>
const QUESTIONS=;const N=60,MIN=30,API='https://ba-sociology-results.faiz0812.workers.dev';let test=[],answers={},pos=0,seconds=MIN*60,interval=null,studentName='',submitted=false;const $=id=>document.getElementById(id);
const GREETINGS=['Welcome! 📚 Ready for Sociology? Think carefully and do your best! 🌟','Hello! 👋 Challenge yourself with 60 questions and stay confident! 💪','Good luck! 🎓 Read each question carefully and show what you know!','Welcome to your mock test! 🧠✨ Stay focused and keep going!'];function setGreeting(){$('greeting').textContent=GREETINGS[Math.floor(Math.random()*GREETINGS.length)]}function shuffle(a){let x=a.slice();for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function screen(id){['start','test','result'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}function startTest(){studentName=$('name').value.trim();if(!studentName){$('msg').textContent='Please enter Student Name.';return}test=shuffle(QUESTIONS).slice(0,N);answers={};pos=0;seconds=MIN*60;submitted=false;screen('test');render();clearInterval(interval);interval=setInterval(tick,1000);tick()}function tick(){seconds--;if(seconds<0)seconds=0;$('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds===0)submit(true)}function render(){let q=test[pos];$('counter').textContent='Question '+(pos+1)+' of '+N;$('question').textContent=q.question;$('options').innerHTML=q.options.map(o=>'<label class="opt"><input type="radio" name="answer" value="'+o.value+'" '+(answers[pos]===o.value?'checked':'')+'> '+o.value+') '+o.text+'</label>').join('');document.querySelectorAll('input[name=answer]').forEach(x=>x.addEventListener('change',()=>{answers[pos]=x.value;renderNav()}));$('prev').disabled=pos===0;$('next').disabled=pos===N-1;if((pos+1)===60){$('submit').style.display='inline-block'}else{$('submit').style.display='none'};renderNav()}function renderNav(){let h='';test.forEach((q,i)=>h+='<button class="'+(answers[i]?'answered ':'')+(i===pos?'current':'')+'" data-i="'+i+'">'+(i+1)+'</button>');$('nav').innerHTML=h;document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{pos=Number(b.dataset.i);render()})}function submit(auto){if(submitted)return;if(!auto&&!confirm('Are you sure you want to Finish & Submit the test?'))return;submitted=true;clearInterval(interval);let correct=0,wrong=0,unanswered=0;test.forEach((q,i)=>{if(!answers[i])unanswered++;else if(answers[i]===q.answer)correct++;else wrong++});let attempted=correct+wrong,pct=correct/N*100,accuracy=attempted?correct/attempted*100:0;showReport(correct,wrong,unanswered,attempted,pct,accuracy,auto);sendToCloudflare(correct,wrong,unanswered,pct,auto)}function sendToCloudflare(correct,wrong,unanswered,pct,auto){let payload={name:studentName,reg:'N/A',subject:'Sociology Mock Test - 60Q',score:correct,total:N,percentage:Number(pct.toFixed(1)),wrong:wrong,unanswered:unanswered,status:pct>=40?'PASS':'NEEDS IMPROVEMENT',autoSubmitted:auto,submittedAt:new Date().toISOString()};fetch(API+'/submit',{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload)}).then(r=>{if(!r.ok)throw new Error('Cloudflare '+r.status);$('message').textContent='Test submitted successfully. Result saved to Cloudflare.'}).catch(e=>{$('message').textContent='Final report ready. Cloudflare save failed; local report is still available.'})}function showReport(correct,wrong,unanswered,attempted,pct,accuracy,auto){$('rname').textContent=studentName;$('score').textContent=correct+' / '+N;$('pct').textContent=pct.toFixed(1)+'%';$('attempted').textContent=attempted+' / '+N;$('correct').textContent=correct;$('wrong').textContent=wrong;$('unanswered').textContent=unanswered;$('accuracy').textContent=accuracy.toFixed(1)+'%';$('status').textContent=pct>=80?'EXCELLENT':pct>=60?'VERY GOOD':pct>=40?'PASS':'NEEDS IMPROVEMENT';$('status').className='status-badge '+(pct>=80?'status-excellent':pct>=60?'status-good':pct>=40?'status-pass':'status-needs');$('message').textContent=auto?'Time expired — submitted automatically.':'Test submitted successfully.';$('motivation').textContent=pct>=80?'Outstanding performance! 🌟':pct>=60?'Very good effort! 👏':pct>=40?'You passed! 🌟 Review the missed topics.':'Keep going! 💪 Review the weak areas and try again.';let h='';test.forEach((q,i)=>{let your=answers[i]||'Not answered',yourOpt=q.options.find(o=>o.value===your),ok=your===q.answer,res=ok?'Correct':your==='Not answered'?'Unanswered':'Wrong',co=q.options.find(o=>o.value===q.answer),cl=ok?'correct':your==='Not answered'?'not-answered':'wrong';h+='<div class="review-card '+cl+'"><div class="review-q">Q'+(i+1)+'. '+q.question+'</div>'+(ok?'<div class="review-line"><span>Your answer</span><b>'+esc(your+') '+yourOpt.text)+'</b></div><div class="review-line"><b style="color:#16a34a;font-size:18px">✓ Your answer is correct</b></div>':'<div class="review-line"><span>Your answer</span><b>'+esc(your==='Not answered'?'Not answered':your+') '+yourOpt.text)+'</b></div><div class="review-line"><span>Correct answer</span><b>'+q.answer+') '+co.text+'</b></div><div class="result-badge">'+res+'</div>')+'</div>'});$('review').innerHTML=h;screen('result');window.scrollTo({top:0,behavior:'smooth'})}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function saveReport(){let rows=test.map((q,i)=>{let your=answers[i]||'Not answered',yourOpt=q.options.find(o=>o.value===your),co=q.options.find(o=>o.value===q.answer),res=your===q.answer?'Correct':your==='Not answered'?'Unanswered':'Wrong';return '<tr><td>'+(i+1)+'</td><td>'+esc(q.question)+'</td><td>'+esc(your==='Not answered'?'Not answered':your+') '+yourOpt.text)+'</td><td>'+esc(q.answer+') '+co.text)+'</td><td>'+res+'</td></tr>'}).join('');let html='<!doctype html><html><body><h1>Sociology Mock Test – Final Report</h1><p><b>Student:</b> '+esc(studentName)+'</p><p><b>Score:</b> '+$('score').textContent+' | <b>Percentage:</b> '+$('pct').textContent+' | <b>Status:</b> '+$('status').textContent+'</p><table border="1" cellpadding="7"><tr><th>No.</th><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th></tr>'+rows+'</table></body></html>';let blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Philosophy_of_Education_Final_Report.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function finish(){clearInterval(interval);submitted=false;test=[];answers={};pos=0;studentName='';$('name').value='';screen('start');setGreeting()}setGreeting();$('startBtn').onclick=startTest;$('prev').onclick=()=>{if(pos>0){pos--;render()}};$('next').onclick=()=>{if(pos<N-1){pos++;render()}};$('submit').onclick=()=>submit(false);$('save').onclick=saveReport;$('print').onclick=()=>window.print();$('startAgain').onclick=finish;
</script></body></html>
