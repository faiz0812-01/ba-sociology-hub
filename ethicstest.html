<script>
const QUESTIONS=[{"id":1,"question":"The evolutionary view in concrete biological form was taught by","options":[{"value":"A","text":"Spencer"},{"value":"B","text":"Nietzsche"},{"value":"C","text":"Spinoza"},{"value":"D","text":"Leibniz"}],"answer":"A"},{"id":2,"question":"Who called casuistry the goal of ethical investigation?","options":[{"value":"A","text":"G.E. Moore"},{"value":"B","text":"Bradley"},{"value":"C","text":"Russell"},{"value":"D","text":"Wittgenstein"}],"answer":"A"},{"id":3,"question":"__________ is a reasonable extension of the province of ethics to examine how its principles work out in the actual circumstances of the moral life.","options":[{"value":"A","text":"Logic"},{"value":"B","text":"Casuistry"},{"value":"C","text":"Aesthetics"},{"value":"D","text":"Genomics"}],"answer":"B"},{"id":4,"question":"Applied ethics is a branch of philosophy whose subject matter is the application of moral rules, principles, or concepts to","options":[{"value":"A","text":"Real life issues"},{"value":"B","text":"Theoretical issues"},{"value":"C","text":"Imaginary issues"},{"value":"D","text":"Fictional issues"}],"answer":"A"},{"id":5,"question":"A Theory of Justice is a book written by","options":[{"value":"A","text":"John Rawls"},{"value":"B","text":"Kepler"},{"value":"C","text":"Kipling"},{"value":"D","text":"Aldous Huxley"}],"answer":"A"},{"id":6,"question":"A moral person, Rawls says, must have a sense of","options":[{"value":"A","text":"Justice"},{"value":"B","text":"Arrogance"},{"value":"C","text":"Rigidity"},{"value":"D","text":"Abnormality"}],"answer":"A"},{"id":7,"question":"It is argued that applied ethics “as the application of general ethical theories to particular moral problems” is a __________ deﬁnition which neither deﬁnes the appropriate method nor the content of applied ethics.","options":[{"value":"A","text":"Immediate"},{"value":"B","text":"Broad"},{"value":"C","text":"Narrow"},{"value":"D","text":"Appropriate"}],"answer":"C"},{"id":8,"question":"Applied ethics derives its intellectual stimulus from moral philosophy and aims to provide __________ to emerging moral problems in society.","options":[{"value":"A","text":"Descriptions"},{"value":"B","text":"Options"},{"value":"C","text":"Solutions"},{"value":"D","text":"Challenges"}],"answer":"C"},{"id":9,"question":"According to Gert, applied ethics is deﬁned as the systematic application of general ethical theories to particular __________.","options":[{"value":"A","text":"Professions"},{"value":"B","text":"Moral problems"},{"value":"C","text":"Deﬁnitions"},{"value":"D","text":"Resources"}],"answer":"B"},{"id":10,"question":"__________ Ethics comprises of rules followed by members of a profession to govern their own practice.","options":[{"value":"A","text":"Professional"},{"value":"B","text":"Comprehensive"},{"value":"C","text":"Virtue"},{"value":"D","text":"Theoretical"}],"answer":"A"},{"id":11,"question":"__________ and sexists point out that humans are not equal in abilities, talents, or character.","options":[{"value":"A","text":"Jurist"},{"value":"B","text":"Racist"},{"value":"C","text":"Spiritualist"},{"value":"D","text":"Democrats"}],"answer":"B"},{"id":12,"question":"Animals are part of the natural order; virtues like temperance and compassion may guide treatment, but __________ is not extended.","options":[{"value":"A","text":"Inequality"},{"value":"B","text":"Equality"},{"value":"C","text":"Hierarchy"},{"value":"D","text":"Segregation"}],"answer":"B"},{"id":13,"question":"Equality is not about sameness of abilities, but about equal __________ of interests.","options":[{"value":"A","text":"Consideration"},{"value":"B","text":"Evolution"},{"value":"C","text":"Negation"},{"value":"D","text":"Indi erence"}],"answer":"A"},{"id":14,"question":"Equality must be understood as a __________ principle: the principle of equal consideration of interests.","options":[{"value":"A","text":"Logical"},{"value":"B","text":"Mathematical"},{"value":"C","text":"Moral"},{"value":"D","text":"Vague"}],"answer":"C"},{"id":15,"question":"The principle that all humans are __________ is now part of mainstream political and ethical orthodoxy.","options":[{"value":"A","text":"Unequal"},{"value":"B","text":"Evil"},{"value":"C","text":"Bad"},{"value":"D","text":"Equal"}],"answer":"D"},{"id":16,"question":"Infants, severely intellectually disabled humans, or those lacking __________ awareness would fall outside Rawls’s circle.","options":[{"value":"A","text":"Moral"},{"value":"B","text":"Logical"},{"value":"C","text":"Abstract"},{"value":"D","text":"Technical"}],"answer":"A"},{"id":17,"question":"__________ argues that all humans share the property of moral personality.","options":[{"value":"A","text":"Nietzsche"},{"value":"B","text":"Rawls"},{"value":"C","text":"Sartre"},{"value":"D","text":"Hobbes"}],"answer":"B"},{"id":18,"question":"Equality must be understood as a __________ principle: the principle of equal consideration of interests.","options":[{"value":"A","text":"Logical"},{"value":"B","text":"Mathematical"},{"value":"C","text":"Moral"},{"value":"D","text":"Vague"}],"answer":"C"},{"id":19,"question":"Name the person associated with the following thought, “Sentience is the boundary; su ering must be weighed equally. Life’s value may vary with capacities.”","options":[{"value":"A","text":"Aristotle"},{"value":"B","text":"Kant"},{"value":"C","text":"Peter Singer"},{"value":"D","text":"Hegel"}],"answer":"C"},{"id":20,"question":"Generally, environmental ethics talks about the ethical relationship between __________ and the non-human world.","options":[{"value":"A","text":"technology"},{"value":"B","text":"animal"},{"value":"C","text":"humanity"},{"value":"D","text":"insects"}],"answer":"C"},{"id":21,"question":"A self-aware being capable of __________ thought, planning, and communication may have a richer life than a being without those capacities.","options":[{"value":"A","text":"Totalitarian"},{"value":"B","text":"Concrete"},{"value":"C","text":"Abstract"},{"value":"D","text":"Indi erent"}],"answer":"C"},{"id":22,"question":"Scientiﬁc agreement is that the increase in environmental crises was noticed since the start of the __________.","options":[{"value":"A","text":"religious"},{"value":"B","text":"spirituality"},{"value":"C","text":"stone age"},{"value":"D","text":"industrial era"}],"answer":"D"},{"id":23,"question":"According to Paul Taylor, environmental ethics is concerned with the moral relations that hold between humans and the __________.","options":[{"value":"A","text":"natural world"},{"value":"B","text":"artiﬁcial world"},{"value":"C","text":"parallel world"},{"value":"D","text":"impossible world"}],"answer":"A"},{"id":24,"question":"Environmental ethics was in a way for liberating philosophy from the __________ and overspecialization to which it had fallen.","options":[{"value":"A","text":"broadness"},{"value":"B","text":"solution"},{"value":"C","text":"narrowness"},{"value":"D","text":"vision"}],"answer":"C"},{"id":25,"question":"................ would reject the idea of universal equality altogether, emphasizing di erence and hierarchy","options":[{"value":"A","text":"Hegel"},{"value":"B","text":"Aristotle"},{"value":"C","text":"Nietzsche"},{"value":"D","text":"Marx"}],"answer":"C"},{"id":26,"question":"John Rawls’s view suggests that equality is based not on identical traits or outcomes but on the ................. moral capacity that makes humans participants in the ethical community.","options":[{"value":"A","text":"Shared"},{"value":"B","text":"Distinct"},{"value":"C","text":"Restricted"},{"value":"D","text":"Rare"}],"answer":"A"},{"id":27,"question":"The principle of equal consideration of interests is sometimes thought to be a purely formal principle, lacking in substance and too weak to exclude any ..................... practice.","options":[{"value":"A","text":"Equal"},{"value":"B","text":"Inegalitarian"},{"value":"C","text":"Similar"},{"value":"D","text":"Resemble."}],"answer":"B"},{"id":28,"question":"Who drafted the ringing assertion of independence with which the American Declaration of independence begins.","options":[{"value":"A","text":"Abraham Lincoln"},{"value":"B","text":"John Dewey"},{"value":"C","text":"Thomas Jefferson."},{"value":"D","text":"William James"}],"answer":"C"},{"id":29,"question":"........................ is an interdisciplinary field of study dealing with practical ethical issues roughly at the intersection of morality, medicine, and the life sciences.","options":[{"value":"A","text":"Physics"},{"value":"B","text":"Chemistry"},{"value":"C","text":"Bioethics"},{"value":"D","text":"Statistics"}],"answer":"C"},{"id":30,"question":"..................is one of several different areas of applied ethics.","options":[{"value":"A","text":"Mathematics"},{"value":"B","text":"Bioethics"},{"value":"C","text":"Chemistry"},{"value":"D","text":"Statistics"}],"answer":"B"},{"id":31,"question":"The task of bioethics is to resolve rationally the .................... problems faced by health care practitioners.","options":[{"value":"A","text":"Critical"},{"value":"B","text":"Hierarchical"},{"value":"C","text":"Mathematical"},{"value":"D","text":"Ethical."}],"answer":"D"},{"id":32,"question":"The first recorded evidence of induced abortion is from the .......................Ebers Papyrus in 1550 BC.","options":[{"value":"A","text":"Egyptian"},{"value":"B","text":"Indian"},{"value":"C","text":"African"},{"value":"D","text":"American"}],"answer":"A"},{"id":33,"question":"In his Theaetetus, Plato mentions a midwife's right to induce abortion in the ............ stages of pregnancy.","options":[{"value":"A","text":"Late"},{"value":"B","text":"Early"},{"value":"C","text":"Final"},{"value":"D","text":"Last"}],"answer":"B"},{"id":34,"question":"The ........................... Oath forbids the use of pessaries to induce abortion; it did not prohibit abortion.","options":[{"value":"A","text":"Aristocratic"},{"value":"B","text":"Platonic"},{"value":"C","text":"Hippocratic"},{"value":"D","text":"Archimedes"}],"answer":"C"},{"id":35,"question":"A ............................ abortion is the only form of abortion for which nobody may be morally responsible.","options":[{"value":"A","text":"Deliberate"},{"value":"B","text":"Spontaneous"},{"value":"C","text":"Forced"},{"value":"D","text":"Purposeful"}],"answer":"B"},{"id":36,"question":"Directly intended ................. occurs when a woman or some other agent desires to end a pregnancy and does so through either a surgical procedure or a chemical inducement.","options":[{"value":"A","text":"Abortion"},{"value":"B","text":"Relaxation"},{"value":"C","text":"Healing"},{"value":"D","text":"Racism"}],"answer":"A"},{"id":37,"question":"Philosopher ................... argues that it is seriously wrong to kill children and infants because we presume that children and infants have “futures of value\".","options":[{"value":"A","text":"Spinoza"},{"value":"B","text":"Leibniz"},{"value":"C","text":"Don Marquis"},{"value":"D","text":"Kant"}],"answer":"C"},{"id":38,"question":"Rosalind Hursthouse is critical of those who have abortions for frivolous reasons, but she argues that there may be some ............... reasons that a woman could choose to have an abortion.","options":[{"value":"A","text":"Virtuous"},{"value":"B","text":"Immoral"},{"value":"C","text":"Vice"},{"value":"D","text":"Evil"}],"answer":"A"},{"id":39,"question":"................... is the practice of voluntarily having a medically assisted death.","options":[{"value":"A","text":"Surgery"},{"value":"B","text":"Healing"},{"value":"C","text":"Euthanasia"},{"value":"D","text":"Relaxation."}],"answer":"C"},{"id":40,"question":".............euthanasia entails the withholding of common treatments knowing that it may also result in death.","options":[{"value":"A","text":"Active"},{"value":"B","text":"Passive"},{"value":"C","text":"Aggressive"},{"value":"D","text":"Forced"}],"answer":"B"},{"id":41,"question":"The term ................ comes from the Greek words \"eu” and “thanatos” which combined means “well death” or \"dying well\".","options":[{"value":"A","text":"Surgery"},{"value":"B","text":"Euthanasia"},{"value":"C","text":"Dementia"},{"value":"D","text":"Fetus"}],"answer":"B"},{"id":42,"question":"................... mentions euthanasia in the Hippocratic Oath, which was written between 400 and 300 B.C.","options":[{"value":"A","text":"Socrates"},{"value":"B","text":"Plato"},{"value":"C","text":"Aristotle"},{"value":"D","text":"Hippocrates"}],"answer":"D"},{"id":43,"question":"............... euthanasia involves taking a step that directly brings about a person’s death.","options":[{"value":"A","text":"Passive"},{"value":"B","text":"Indirect"},{"value":"C","text":"Active"},{"value":"D","text":"Unintentional"}],"answer":"C"},{"id":44,"question":"………………calls casuistry ‘the goal of ethical investigation’.","options":[{"value":"A","text":"Plato"},{"value":"B","text":"Spinoza"},{"value":"C","text":"G. E. Moore"},{"value":"D","text":"Leibniz"}],"answer":"C"},{"id":45,"question":"Whatever the cause of the difference in average IQs, it will provide no justification for ……………….segregation in education or any other field.","options":[{"value":"A","text":"Equal"},{"value":"B","text":"Same"},{"value":"C","text":"Racial"},{"value":"D","text":"Similar"}],"answer":"C"},{"id":46,"question":"……………………..is a principle-based, rationally grounded decision procedure for solving moral quandaries in health care.","options":[{"value":"A","text":"Physics"},{"value":"B","text":"Chemistry"},{"value":"C","text":"Bioethics"},{"value":"D","text":"Mathematics"}],"answer":"C"},{"id":47,"question":"………………………………..is the application of science and technology to living organisms and their parts, or products and models of living organisms, in the hope of producing understanding, goods, or services.","options":[{"value":"A","text":"Biotechnology"},{"value":"B","text":"Sociology"},{"value":"C","text":"Rhetoric"},{"value":"D","text":"Aerodynamics."}],"answer":"A"},{"id":48,"question":"……………………………….on animals and humans is accelerated because genetic engineering and cloning are developed for commercial purposes, anticipating enormous profits on the horizon for the biotech industry.","options":[{"value":"A","text":"Rhetoric"},{"value":"B","text":"Differentiation"},{"value":"C","text":"Experimentation"},{"value":"D","text":"Underestimating"}],"answer":"C"},{"id":49,"question":"According to Marquis, abortion is wrong for a similar reason, which is that it ………………….the fetus of obtaining the future good it would have if it were left alone and allowed to be born.","options":[{"value":"A","text":"Allows"},{"value":"B","text":"Grants"},{"value":"C","text":"Permits"},{"value":"D","text":"Deprives"}],"answer":"D"},{"id":50,"question":"……………………..euthanasia is euthanasia with the person’s direct consent.","options":[{"value":"A","text":"Voluntary"},{"value":"B","text":"Involuntary"},{"value":"C","text":"Accidental"},{"value":"D","text":"Unintentional"}],"answer":"A"},{"id":51,"question":"Critics worry that practice of …………………opens the door to killing those who feel they have become a financial burden on their families or who merely fear future suffering.","options":[{"value":"A","text":"Euthanasia"},{"value":"B","text":"Technology"},{"value":"C","text":"Medicine"},{"value":"D","text":"Sports"}],"answer":"A"},{"id":52,"question":"IVF (In Vitro Fertilisation) is now a routine procedure for certain types of…………………, and has given rise to thousands of healthy babies","options":[{"value":"A","text":"Fertility"},{"value":"B","text":"Infertility"},{"value":"C","text":"Confusion"},{"value":"D","text":"Tendency"}],"answer":"B"},{"id":53,"question":"The questions about the human relation to the natural world increased attention as a result of the growing ………………………..consciousness and social movements of the 1960s.","options":[{"value":"A","text":"Unethical"},{"value":"B","text":"Statistical"},{"value":"C","text":"Environmental"},{"value":"D","text":"Technological"}],"answer":"C"},{"id":54,"question":"According to Paul Taylor, environmental ethics is concerned with the moral relations that hold between humans and the ………………..world.","options":[{"value":"A","text":"Artificial"},{"value":"B","text":"Virtual"},{"value":"C","text":"Natural"},{"value":"D","text":"Dream"}],"answer":"C"},{"id":55,"question":"It was through the works of Richard Routley, John Passmore, Arne Naess, and Holmes Rolston that environmental ethics arose as a branch of ……………….","options":[{"value":"A","text":"Mathematics"},{"value":"B","text":"Philosophy"},{"value":"C","text":"Literature"},{"value":"D","text":"Chemistry"}],"answer":"B"},{"id":56,"question":"Today there is a need for an ………………………..approach to knowledge in countering the issue of global climate change.","options":[{"value":"A","text":"Interdisciplinary"},{"value":"B","text":"Chaotic"},{"value":"C","text":"Separate"},{"value":"D","text":"Divided"}],"answer":"A"},{"id":57,"question":"……………………. is a life-centered outlook, in this view moral standing of all living creatures is accepted and rejects the view that humanity only matters.","options":[{"value":"A","text":"Physics"},{"value":"B","text":"Biocentrism"},{"value":"C","text":"Mathematics"},{"value":"D","text":"Anthropocentricism"}],"answer":"B"},{"id":58,"question":"Schweitzer believed in the \"reverence for life\" and Gandhi regarded the …………………….of even vegetable life as himsa.","options":[{"value":"A","text":"Destruction"},{"value":"B","text":"Protection"},{"value":"C","text":"Safety"},{"value":"D","text":"Nurture"}],"answer":"A"},{"id":59,"question":"Arne Naess included living systems within the scope of ………………………..","options":[{"value":"A","text":"Art"},{"value":"B","text":"Biocentricism"},{"value":"C","text":"Design"},{"value":"D","text":"Sports"}],"answer":"B"},{"id":60,"question":"In the non-anthropocentric view natural world and its parts have value in their own right ………………………of their effects on human beings.","options":[{"value":"A","text":"Dependent"},{"value":"B","text":"Reliant"},{"value":"C","text":"Influenced"},{"value":"D","text":"Independent"}],"answer":"D"},{"id":61,"question":"According to Naess all living things have an equal right to flourish which is called biospherical ……………………….","options":[{"value":"A","text":"Egalitarianism"},{"value":"B","text":"Dictactorship"},{"value":"C","text":"Fascism"},{"value":"D","text":"Hegemony"}],"answer":"A"},{"id":62,"question":"The definition for ………………………..development according to the world commission for environment and development is the \"development that meets the needs of the present without compromising the ability of future generations to meet their own needs\".","options":[{"value":"A","text":"Hierarchical"},{"value":"B","text":"Disordered"},{"value":"C","text":"Sustainable"},{"value":"D","text":"Chaotic"}],"answer":"C"},{"id":63,"question":"Routley states that traditional western moral thinking did not allow natural things to have ……………….value.","options":[{"value":"A","text":"Extrinsic"},{"value":"B","text":"Intrinsic"},{"value":"C","text":"Zero"},{"value":"D","text":"External"}],"answer":"B"},{"id":64,"question":"When natural world is treated only as a means for human needs or ends then it is claimed to possess …………………. value.","options":[{"value":"A","text":"Inherent"},{"value":"B","text":"Intrinsic"},{"value":"C","text":"Instrumental"},{"value":"D","text":"Eternal"}],"answer":"C"},{"id":65,"question":"The core principle involved in deep ecology is the claim that along with humanity the living environment as a whole has the same …………….to live and flourish.","options":[{"value":"A","text":"Incompetence"},{"value":"B","text":"Right"},{"value":"C","text":"Disability"},{"value":"D","text":"Intolerance"}],"answer":"B"},{"id":66,"question":"According to Peter Singer ………………consideration of interests must be applied though human interest in jobs and energy security are of priority.","options":[{"value":"A","text":"Unequal"},{"value":"B","text":"Partial"},{"value":"C","text":"Equal"},{"value":"D","text":"Biased"}],"answer":"C"},{"id":67,"question":"The main objective of medical ethics is to provide ………………..understandings to students in the field of medicine and clinical practices.","options":[{"value":"A","text":"Unethical"},{"value":"B","text":"Ethical"},{"value":"C","text":"immoral"},{"value":"D","text":"illegal"}],"answer":"B"},{"id":68,"question":"………………….. in medical ethics means respecting the patient’s right to make decisions about their own care.","options":[{"value":"A","text":"Autonomy"},{"value":"B","text":"Dependence"},{"value":"C","text":"Enslavement"},{"value":"D","text":"Captivity"}],"answer":"A"},{"id":69,"question":"…………………….. in medical ethics means actively working to promote the well-being of patients.","options":[{"value":"A","text":"Beneficence"},{"value":"B","text":"Maleficence"},{"value":"C","text":"Selfishness"},{"value":"D","text":"Malice"}],"answer":"A"},{"id":70,"question":"Medical ethics provides a framework for moral reasoning in healthcare, especially when laws or clinical guidelines don’t give ………………answers.","options":[{"value":"A","text":"Unclear"},{"value":"B","text":"Confused"},{"value":"C","text":"Clear"},{"value":"D","text":"Vague"}],"answer":"C"},{"id":71,"question":"It was ……………………………(1803) who was the first made formal use of the term medical ethics, outlining professional expectations","options":[{"value":"A","text":"Thomas Percival"},{"value":"B","text":"Loius Pasteur"},{"value":"C","text":"Spinoza"},{"value":"D","text":"Newton"}],"answer":"A"},{"id":72,"question":"Medical ethics has shifted from professional codes to a ………………………..field that addresses dilemmas across life stages, cultural contexts, and emerging technologies","options":[{"value":"A","text":"Simple"},{"value":"B","text":"Multidimensional"},{"value":"C","text":"Restricted"},{"value":"D","text":"Linear"}],"answer":"B"},{"id":73,"question":"Patients can take ……………action if identifiable medical information is disclosed without consent.","options":[{"value":"A","text":"Legal"},{"value":"B","text":"Unfair"},{"value":"C","text":"illegal"},{"value":"D","text":"Unexpected"}],"answer":"A"},{"id":74,"question":"Just as confidentiality protects patient trust by safeguarding information, truth-telling protects trust by ensuring………………….","options":[{"value":"A","text":"Ambiguity"},{"value":"B","text":"Hidden"},{"value":"C","text":"Transparency"},{"value":"D","text":"Unclear"}],"answer":"C"},{"id":75,"question":"……………………… is a branch of applied ethics that deals with moral issues in acquisition, preparation, storage, and presentation of information.","options":[{"value":"A","text":"Bioethics"},{"value":"B","text":"Environmental ethics"},{"value":"C","text":"Medical ethics"},{"value":"D","text":"Media ethics"}],"answer":"D"},{"id":76,"question":"…………………. is the hallmark of media ethics, fairness and objectivity in reporting should be ensured.","options":[{"value":"A","text":"Impartiality"},{"value":"B","text":"Partiality"},{"value":"C","text":"Bias"},{"value":"D","text":"Prejudice"}],"answer":"A"},{"id":77,"question":"Journalists are expected to be …………………..observers.","options":[{"value":"A","text":"Partial"},{"value":"B","text":"Biased"},{"value":"C","text":"Prejudiced"},{"value":"D","text":"Neutral"}],"answer":"D"},{"id":78,"question":"Reporting can produce ………………..legitimate accounts of events, not always reducible to one consistent narrative.","options":[{"value":"A","text":"Single"},{"value":"B","text":"Multiple"},{"value":"C","text":"One"},{"value":"D","text":"Isolated"}],"answer":"B"},{"id":79,"question":"The ethical responsibility of media professionals extends beyond truth-telling to considering the ……………..consequences of media exposure.","options":[{"value":"A","text":"Individual"},{"value":"B","text":"Solitary"},{"value":"C","text":"Social"},{"value":"D","text":"Private"}],"answer":"C"},{"id":80,"question":"Even if abortion were in some cases thought to be immoral, one would need to give further reasons about the purpose of the law to conclude that it also ought to be..............","options":[{"value":"A","text":"Legal"},{"value":"B","text":"Right"},{"value":"C","text":"illegal"},{"value":"D","text":"Allowed"}],"answer":"C"},{"id":81,"question":"If the fetus would be thought to have something like a right to life then abortion would become morally .....................","options":[{"value":"A","text":"Easy"},{"value":"B","text":"Problematic"},{"value":"C","text":"Possible"},{"value":"D","text":"Allowed"}],"answer":"B"},{"id":82,"question":"Potentiality means “power.” According to this criterion, all beings that have the power to develop certain key characteristics have full ............. worth.","options":[{"value":"A","text":"Moral"},{"value":"B","text":"immoral"},{"value":"C","text":"Unknown"},{"value":"D","text":"Material"}],"answer":"A"},{"id":83,"question":"Some critics of abortion argue that abortion is wrong because it prevents a being from actualizing its .................","options":[{"value":"A","text":"Inertia"},{"value":"B","text":"Potential"},{"value":"C","text":"Resistance"},{"value":"D","text":"Regulation"}],"answer":"B"},{"id":84,"question":".....................means “theory of being,” so the ontological question asks what sort of being the fetus is.","options":[{"value":"A","text":"Epistemology"},{"value":"B","text":"Metaphysics"},{"value":"C","text":"Logic"},{"value":"D","text":"Ontology"}],"answer":"D"},{"id":85,"question":"Medical research is increasingly .................... and international, with growing numbers of research subjects recruited in developing countries.","options":[{"value":"A","text":"Multicentre"},{"value":"B","text":"Localised"},{"value":"C","text":"Traditional"},{"value":"D","text":"Monocentric"}],"answer":"A"},{"id":86,"question":"When a new technology has been developed in one country, it is possible to ............ the technology everywhere, even if some countries want to ban its use.","options":[{"value":"A","text":"Neglect"},{"value":"B","text":"Apply"},{"value":"C","text":"Avoid"},{"value":"D","text":"Ignore"}],"answer":"B"},{"id":87,"question":".......................is a reasonable extension of the province of ethics to examine how its principles work out in the actual circumstances of the moral life.","options":[{"value":"A","text":"Biology"},{"value":"B","text":"Chemistry"},{"value":"C","text":"Casuistry"},{"value":"D","text":"Metaphysics"}],"answer":"C"},{"id":88,"question":"The ......................of his age and country are likely to influence not only the theories of the moralists but the common moral opinions with which he begins.","options":[{"value":"A","text":"Imagination"},{"value":"B","text":"Dreams"},{"value":"C","text":"Tolerance"},{"value":"D","text":"Circumstances"}],"answer":"D"},{"id":89,"question":"One thing is certain and that is that moral practice is always .....................by more potent factors than moral theory","options":[{"value":"A","text":"Influenced"},{"value":"B","text":"Resistant"},{"value":"C","text":"Unmoved"},{"value":"D","text":"Discouraged"}],"answer":"A"},{"id":90,"question":"The utilitarian’s had certainly an advantage over most ethical schools in the matter of effecting ..................","options":[{"value":"A","text":"Theory"},{"value":"B","text":"Practice"},{"value":"C","text":"Dreams"},{"value":"D","text":"Speculation"}],"answer":"B"},{"id":91,"question":"The principle that all humans are ................ is now part of the prevailing political and ethical orthodoxy.","options":[{"value":"A","text":"Unequal"},{"value":"B","text":"Equal"},{"value":"C","text":"Seperate"},{"value":"D","text":"Distinct"}],"answer":"B"},{"id":92,"question":"When principle of human equality is applied to issues like affirmative action there are different opinions,some argue equality requires favoring disadvantaged minorities, while others insist equality forbids any racial ....................","options":[{"value":"A","text":"Rejection"},{"value":"B","text":"Aversion"},{"value":"C","text":"Indifference"},{"value":"D","text":"Preference"}],"answer":"D"},{"id":93,"question":"The principle of equal consideration of interests acts like a pair of scales, weighing interests ………………….","options":[{"value":"A","text":"Partially"},{"value":"B","text":"Impartially"},{"value":"C","text":"Unfair"},{"value":"D","text":"Biased"}],"answer":"B"},{"id":94,"question":"The opposition to genetic explanations of alleged racial differences in intelligence is only one manifestation of a more general opposition to genetic explanations in other …………………sensitive areas.","options":[{"value":"A","text":"Socially"},{"value":"B","text":"Individual"},{"value":"C","text":"Privately"},{"value":"D","text":"Solitarily"}],"answer":"A"},{"id":95,"question":"International scientific project that is designed to map the human genome has attracted protests because of …………………….over what such a map might reveal about genetic differences between humans, and the use to which such information might be put in.","options":[{"value":"A","text":"Clarity"},{"value":"B","text":"Transparency"},{"value":"C","text":"Apprehension"},{"value":"D","text":"Precision"}],"answer":"C"},{"id":96,"question":"To have value on its own right is to claim that it has ……………….value.","options":[{"value":"A","text":"Extrinsic"},{"value":"B","text":"Special"},{"value":"C","text":"External"},{"value":"D","text":"Intrinsic"}],"answer":"D"},{"id":97,"question":"According to many theorists to discover the intrinsic value in nature is a defining problem for…………………………..","options":[{"value":"A","text":"Artificial Intelligence"},{"value":"B","text":"Technology"},{"value":"C","text":"Environmental ethics"},{"value":"D","text":"Media ethics"}],"answer":"C"},{"id":98,"question":"J.S. Mill's conception of liberty states that the pursuit of liberty must be ……………………………with th s--;render()}};$('next').onclick=()=>{if(pos<N-1){pos++;render()}};$('submit').onclick=()=>submit(false);$('save').onclick=saveReport;$('print').onclick=()=>window.print();$('startAgain').onclick=finish;
