  $('counter').textContent='Question '+(pos+1)+' of '+N;
  $('question').textContent=q.question;
  $('options').innerHTML=q.options.map(o=>'<label class="opt"><input type="radio" name="answer" value="'+esc(o.value)+'" '+(answers[pos]===o.value?'checked':'')+'> '+esc(o.value)+') '+esc(o.text)+'</label>').join('');
  if(answers[questionIndex])lockAnswerOptions('#options');document.querySelectorAll('input[name="answer"]').forEach(x=>x.onchange=()=>{if(answers[questionIndex]){x.checked=x.value===answers[questionIndex];lockAnswerOptions('#options');return}answers[questionIndex]=x.value;lockAnswerOptions('#options');paintAnswerFeedback(q,'#options',x.value);renderNav();});
  $('prev').disabled=pos===0;
  $('next').disabled=pos===N-1;
  $('submit').style.display=pos===N-1?'inline-block':'none';
  renderNav();
}
function renderNav(){
  $('nav').innerHTML=test.map((q,i)=>'<button type="button" class="'+(answers[i]?'answered ':'')+(i===pos?'current':'')+'" data-i="'+i+'">'+(i+1)+'</button>').join('');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{pos=Number(b.dataset.i);render();});
}
function submit(auto){
  if(submitted)return;
  if(!auto&&!confirm('Are you sure you want to Finish & Submit the test?'))return;
  submitted=true; clearInterval(interval);
  let correct=0,wrong=0,unanswered=0;
  test.forEach((q,i)=>{if(!answers[i])unanswered++;else if(answers[i]===q.answer)correct++;else wrong++;});
  const attempted=correct+wrong,pct=correct/N*100,accuracy=attempted?correct/attempted*100:0;
  showReport(correct,wrong,unanswered,attempted,pct,accuracy,auto);
  sendToCloudflare(correct,wrong,unanswered,pct,auto);
}
function sendToCloudflare(correct,wrong,unanswered,pct,auto){
  const payload={name:studentName,reg:'N/A',subject:'BA Hindi AEC Internal Exam - 60Q',score:correct,total:N,percentage:Number(pct.toFixed(1)),wrong,unanswered,status:pct>=40?'PASS':'NEEDS IMPROVEMENT',autoSubmitted:auto,submittedAt:new Date().toISOString()};
  fetch(API+'/submit',{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload)}).catch(()=>{});
}
function showReport(correct,wrong,unanswered,attempted,pct,accuracy,auto){
  $('rname').textContent=studentName;$('score').textContent=correct+' / '+N;$('pct').textContent=pct.toFixed(1)+'%';
  $('attempted').textContent=attempted+' / '+N;$('correct').textContent=correct;$('wrong').textContent=wrong;$('unanswered').textContent=unanswered;$('accuracy').textContent=accuracy.toFixed(1)+'%';
  const status=pct>=80?'EXCELLENT':pct>=60?'VERY GOOD':pct>=40?'PASS':'NEEDS IMPROVEMENT';
  $('status').textContent=status;$('status').className='status-badge '+(pct>=80?'status-excellent':pct>=60?'status-good':pct>=40?'status-pass':'status-needs');
  $('message').textContent=auto?'Time expired — submitted automatically.':'Test submitted successfully.';
  $('motivation').textContent=pct>=80?'Outstanding performance! 🌟':pct>=60?'Very good effort! 👏':pct>=40?'You passed! 🌟 Review the missed topics.':'Keep going! 💪 Review the weak areas and try again.';
  let h='';
  test.forEach((q,i)=>{
    const your=answers[i]||'Not answered',yourOpt=q.options.find(o=>o.value===your),co=q.options.find(o=>o.value===q.answer);
    const ok=your===q.answer,cl=ok?'correct':your==='Not answered'?'not-answered':'wrong';
    h+='<div class="review-card '+cl+'"><div class="review-q">Q'+(i+1)+'. '+esc(q.question)+'</div>';
    h+='<div class="review-line"><span>Your answer</span><b>'+esc(your==='Not answered'?'Not answered':your+') '+(yourOpt?yourOpt.text:'') )+'</b></div>';
    if(ok)h+='<div class="review-line"><b style="color:#16a34a;font-size:18px">✓ Your answer is correct</b></div>';
    else h+='<div class="review-line"><span>Correct answer</span><b>'+esc(q.answer+') '+(co?co.text:'') )+'</b></div>';
    h+='<div class="result-badge">'+(ok?'Correct':your==='Not answered'?'Unanswered':'Wrong')+'</div></div>';
  });
  $('review').innerHTML=h;screen('result');window.scrollTo({top:0,behavior:'smooth'});
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function saveReport(){
  let rows=test.map((q,i)=>{
    const your=answers[i]||'Not answered',yourOpt=q.options.find(o=>o.value===your),co=q.options.find(o=>o.value===q.answer);
    const res=your===q.answer?'Correct':your==='Not answered'?'Unanswered':'Wrong';
    return '<tr><td>'+(i+1)+'</td><td>'+esc(q.question)+'</td><td>'+esc(your==='Not answered'?'Not answered':your+') '+(yourOpt?yourOpt.text:'') )+'</td><td>'+esc(q.answer+') '+(co?co.text:'') )+'</td><td>'+res+'</td></tr>';
  }).join('');
  const html='<!doctype html><html><body><h1>BA Hindi AEC Internal Exam – Final Report</h1><p><b>Student:</b> '+esc(studentName)+'</p><p><b>Score:</b> '+$('score').textContent+' | <b>Percentage:</b> '+$('pct').textContent+' | <b>Status:</b> '+$('status').textContent+'</p><table border="1" cellpadding="7"><tr><th>No.</th><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th></tr>'+rows+'</table></body></html>';
  const blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='BA_Hindi_AEC_Final_Report.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function finish(){clearInterval(interval);submitted=false;test=[];answers={};pos=0;studentName='';$('name').value='';screen('start');setGreeting();}
setGreeting();
$('startBtn').addEventListener('click',startTest);
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')startTest();});
$('prev').addEventListener('click',()=>{if(pos>0){pos--;render();}});
$('next').addEventListener('click',()=>{if(pos<N-1){pos++;render();}});
$('submit').addEventListener('click',()=>submit(false));
$('save').addEventListener('click',saveReport);
$('print').addEventListener('click',()=>window.print());
$('startAgain').addEventListener('click',finish);

function lockAnswerOptions(selector){const box=document.querySelector(selector);if(!box)return;box.querySelectorAll('input[type="radio"]').forEach(input=>input.disabled=true);box.querySelectorAll('.opt,.option').forEach(label=>label.classList.add('locked'));}
function paintAnswerFeedback(q,selector,selected){const box=document.querySelector(selector);if(!box)return;box.querySelectorAll('.opt,.option').forEach(label=>label.classList.remove('correct-reveal'));if(!selected||selected===q.answer)return;box.querySelectorAll('input[type="radio"]').forEach(input=>{if(input.value===q.answer){const label=input.closest('.opt,.option');if(label)label.classList.add('correct-reveal');}});}
</script></body></html>
