":"रारच"},{"value":"B","text":"ईभानदायी औय कतटव्मतनष्ठा"},{"value":"C","text":"अहॊकाय"},{"value":"D","text":"चतुयाई"}],"answer":"B"},{"id":92,"question":"ऩॊडडत अरोऩीदीन ककसका प्रतीक हैं?","options":[{"value":"A","text":"गयीफी"},{"value":"B","text":"धन औय प्रबाि की शक्क्त"},{"value":"C","text":"त्माग"},{"value":"D","text":"देशबक्क्त"}],"answer":"B"},{"id":93,"question":"‘नभक का दयोगा’ कहानी का भ ु ख्म सॊदेश क्मा है?","options":[{"value":"A","text":"धन ही जीिन का आधाय है"},{"value":"B","text":"ईभानदायी औय कतटव्मतनष्ठा का भहत्ि"},{"value":"C","text":"नौकयी कयना फ ुया है"},{"value":"D","text":"व्माऩाय कयना सफसे अच्छा है"}],"answer":"B"},{"id":94,"question":"कहानी के अॊत भें ऩॊडडत अरोऩीदीन िॊशीधय से क्मों प्रबावित ह ु ए?","options":[{"value":"A","text":"िॊशीधय ने रयमित स्िीकाय की"},{"value":"B","text":"िॊशीधय ने उनकी सॊऩवत्त फचाई"},{"value":"C","text":"िॊशीधय की ईभानदायी औय दृ़िता से"},{"value":"D","text":"िॊशीधय ने उनसे सभत्रता की"}],"answer":"C"}],N=60,MIN=30,API='https://ba-sociology-results.faiz0812.workers.dev';let test=[],answers={},pos=0,seconds=MIN*60,interval=null,studentName='',submitted=false;const $=id=>document.getElementById(id);const GREETINGS=['Welcome! 📚 All the best for your Hindi AEC Internal Exam!','Read every question carefully and stay confident! 🌟','Good luck! 🎓 You have 30 minutes for 60 questions!'];function setGreeting(){$('greeting').textContent=GREETINGS[Math.floor(Math.random()*GREETINGS.length)]}function shuffle(a){let x=a.slice();for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function screen(id){['start','test','result'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}function startTest(){studentName=$('name').value.trim();if(!studentName){$('msg').textContent='Please enter Student Name.';return}test=shuffle(QUESTIONS).slice(0,N);answers={};pos=0;seconds=MIN*60;submitted=false;screen('test');render();clearInterval(interval);interval=setInterval(tick,1000)}function tick(){seconds--;if(seconds<0)seconds=0;$('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds===0)submit(true)}function render(){let q=test[pos];$('counter').textContent='Question '+(pos+1)+' of '+N;$('question').textContent=q.question;$('options').innerHTML=q.options.map(o=>'<label class="opt"><input type="radio" name="answer" value="'+o.value+'" '+(answers[pos]===o.value?'checked':'')+'> '+o.value+') '+o.text+'</label>').join('');document.querySelectorAll('input[name=answer]').forEach(x=>x.addEventListener('change',()=>{answers[pos]=x.value;renderNav()}));$('prev').disabled=pos===0;$('next').disabled=pos===N-1;$('submit').style.display=pos===N-1?'inline-block':'none';renderNav()}function renderNav(){let h='';test.forEach((q,i)=>h+='<button class="'+(answers[i]?'answered ':'')+(i===pos?'current':'')+'" data-i="'+i+'">'+(i+1)+'</button>');$('nav').innerHTML=h;document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{pos=Number(b.dataset.i);render()})}function submit(auto){if(submitted)return;if(!auto&&!confirm('Are you sure you want to Finish & Submit the test?'))return;submitted=true;clearInterval(interval);let correct=0,wrong=0,unanswered=0;test.forEach((q,i)=>{if(!answers[i])unanswered++;else if(answers[i]===q.answer)correct++;else wrong++});let attempted=correct+wrong,pct=correct/N*100;showReport(correct,wrong,unanswered,attempted,pct);send(correct,wrong,unanswered,pct,auto)}function send(correct,wrong,unanswered,pct,auto){let payload={name:studentName,reg:'N/A',subject:'BA Hindi AEC Internal Exam - 60Q',score:correct,total:N,percentage:Number(pct.toFixed(1)),wrong,unanswered,status:pct>=40?'PASS':'NEEDS IMPROVEMENT',autoSubmitted:auto,submittedAt:new Date().toISOString()};fetch(API+'/submit',{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload)}).catch(()=>{})}function showReport(correct,wrong,unanswered,attempted,pct){$('rname').textContent=studentName;$('score').textContent=correct+' / '+N;$('pct').textContent=pct.toFixed(1)+'%';$('attempted').textContent=attempted+' / '+N;$('correct').textContent=correct;$('wrong').textContent=wrong;$('unanswered').textContent=unanswered;$('status').textContent=pct>=40?'PASS':'NEEDS IMPROVEMENT';$('motivation').textContent=pct>=80?'Outstanding performance! 🌟':pct>=60?'Very good effort! 👏':pct>=40?'You passed! 🌟':'Keep going! 💪 Review and try again.';let h='';test.forEach((q,i)=>{let your=answers[i]||'Not answered',yourOpt=q.options.find(o=>o.value===your),co=q.options.find(o=>o.value===q.answer),ok=your===q.answer,cl=ok?'correct':your==='Not answered'?'not-answered':'wrong';h+='<div class="review-card '+cl+'"><b>Q'+(i+1)+'. '+esc(q.question)+'</b><p>Your answer: <b>'+esc(your==='Not answered'?'Not answered':your+') '+(yourOpt?yourOpt.text:'')+'</b></p><p>Correct answer: <b>'+esc(q.answer+') '+co.text)+'</b></p><p><b>'+ (ok?'✓ Correct':your==='Not answered'?'Unanswered':'✗ Wrong')+'</b></p></div>'});$('review').innerHTML=h;screen('result');window.scrollTo({top:0,behavior:'smooth'})}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function finish(){clearInterval(interval);submitted=false;test=[];answers={};pos=0;studentName='';$('name').value='';screen('start');setGreeting()}setGreeting();$('startBtn').onclick=startTest;$('prev').onclick=()=>{if(pos>0){pos--;render()}};$('next').onclick=()=>{if(pos<N-1){pos++;render()}};$('submit').onclick=()=>submit(false);$('print').onclick=()=>window.print();$('startAgain').onclick=finish;
</script></body></html>
