<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>English MCQ Internal Test</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Segoe UI,sans-serif;background:linear-gradient(135deg,#eef4ff,#f8fbff);color:#172033}
.wrap{max-width:1000px;margin:auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 28px rgba(15,23,42,.10);border:1px solid #e5e7eb}
.hidden{display:none}
.main-title{margin:0;color:#2563eb;font-size:30px;text-align:center}
.greeting{text-align:center;color:#475569;font-weight:700;margin:10px 0 16px}
.field b{display:block;margin-bottom:7px}
.field input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
.btn{border:0;border-radius:11px;padding:12px 18px;font-size:16px;font-weight:800;cursor:pointer}
.primary{background:#2563eb;color:white}.secondary{background:#e2e8f0;color:#0f172a}.danger{background:#dc2626;color:white}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.timer{color:#dc2626;font-weight:900;font-size:20px}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
.nav button{width:36px;height:34px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;font-weight:800;cursor:pointer}
.nav button.answered{background:#dcfce7;border-color:#86efac}
.nav button.current{outline:2px solid #2563eb;outline-offset:1px}
.q{font-size:22px;line-height:1.5;font-weight:800;margin:18px 0}
.opt{display:block;background:#f8fafc;border:2px solid #e2e8f0;padding:14px;border-radius:12px;margin:10px 0;font-size:18px;cursor:pointer}
.opt:has(input:checked){background:#eff6ff;border-color:#2563eb}
.opt input{margin-right:8px;width:18px;height:18px}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px}
.result-actions{justify-content:flex-end}
.result-title{text-align:center;color:#2563eb}
.subject-line{text-align:center;font-size:18px;margin-top:-4px;color:#334155}
.score{text-align:center;font-size:48px;font-weight:900;color:#2563eb;margin:10px 0}
.status-badge{font-weight:900;padding:5px 10px;border-radius:999px}
.status-excellent{color:#166534;background:#dcfce7}.status-good{color:#0369a1;background:#e0f2fe}
.status-pass{color:#854d0e;background:#fef9c3}.status-needs{color:#991b1b;background:#fee2e2}
.motivation{text-align:center;background:#eff6ff;color:#1d4ed8;padding:14px;border-radius:12px;font-weight:900;margin:14px 0}
.review-card{border-radius:14px;padding:14px;margin:11px 0;border-left:6px solid #94a3b8;background:#f8fafc}
.review-card.correct{border-left-color:#16a34a;background:#f0fdf4}
.review-card.wrong{border-left-color:#dc2626;background:#fef2f2}
.review-card.not-answered{border-left-color:#f59e0b;background:#fffbeb}
.review-q{font-weight:800;line-height:1.5}
.review-line{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:7px}
.result-badge{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:8px;background:#fff;font-weight:800}
#message{text-align:center;font-weight:800}
@media(max-width:600px){.wrap{padding:8px}.card{padding:14px}.main-title{font-size:24px}.q{font-size:19px}.opt{font-size:16px}.nav button{width:34px}.score{font-size:40px}}
@media print{body{background:#fff}.noPrint{display:none!important}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<div class="wrap">
<section id="start" class="card">
  <h1 class="main-title">English MCQ Internal Test</h1>
  <div id="greeting" class="greeting"></div>
  <p style="text-align:center"><b>60 Questions • 30 Minutes</b></p>
  <div class="field"><b>Student Name</b><input id="name" type="text" placeholder="Enter your name" autocomplete="name"></div>
  <div id="msg" style="color:#b91c1c;font-weight:800;text-align:center;min-height:24px;margin-top:8px"></div>
  <div style="text-align:center"><button id="startBtn" class="btn primary" type="button">Start Test</button></div>
</section>

<section id="test" class="card hidden">
  <div class="top"><b id="counter"></b><span>Time: <span id="timer" class="timer">30:00</span></span></div>
  <div id="nav" class="nav"></div>
  <div id="question" class="q"></div>
  <div id="options"></div>
  <div class="actions noPrint">
    <button id="prev" class="btn secondary" type="button">Previous</button>
    <button id="next" class="btn primary" type="button">Next</button>
    <button id="submit" class="btn danger" style="display:none" type="button">Submit Test</button>
  </div>
</section>

<section id="result" class="card hidden">
  <div class="result-actions actions noPrint">
    <button id="save" class="btn primary" type="button">Save Analysis Report</button>
    <button id="print" class="btn secondary" type="button">Print / Save PDF</button>
    <button id="startAgain" class="btn danger" type="button">Start Again</button>
  </div>
  <h1 class="result-title">Final Report</h1>
  <p style="text-align:center"><b>Student:</b> <span id="rname"></span></p>
  <p class="subject-line"><b>Subject:</b> <span id="rsubject">English</span></p>
  <div id="score" class="score"></div>
  <p style="text-align:center"><b>Percentage:</b> <span id="pct"></span></p>
  <p style="text-align:center"><b>Attempted:</b> <span id="attempted"></span> &nbsp; <b>Correct:</b> <span id="correct"></span> &nbsp; <b>Wrong:</b> <span id="wrong"></span> &nbsp; <b>Unanswered:</b> <span id="unanswered"></span></p>
  <p style="text-align:center"><b>Accuracy:</b> <span id="accuracy"></span> &nbsp; <b>Status:</b> <span id="status" class="status-badge"></span></p>
  <p id="message"></p>
  <div id="motivation" class="motivation"></div>
  <h2>Question-wise Review</h2>
  <div id="review"></div>
</section>
</div>

<script>
const QUESTIONS="";
const N=60,MIN=30,API='https://ba-sociology-results.faiz0812.workers.dev';
let test=[],answers={},pos=0,seconds=MIN*60,interval=null,studentName='',submitted=false;
const GREETINGS=['Welcome! 📚 Read carefully, stay focused, and give it your best!','Ready for English? ✨ Think clearly and answer confidently!','Good luck! 🧠📖 You have 30 minutes—use them wisely!','Welcome to your English MCQ test! 🌟 Stay calm and do your best!'];
const $=id=>document.getElementById(id);
function setGreeting(){$('greeting').textContent=GREETINGS[Math.floor(Math.random()*GREETINGS.length)]}
function shuffle(a){let x=a.slice();for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function screen(id){['start','test','result'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}
function startTest(){studentName=$('name').value.trim();if(!studentName){$('msg').textContent='Please enter Student Name.';return}test=shuffle(QUESTIONS).slice(0,N);answers={};pos=0;seconds=MIN*60;submitted=false;$('msg').textContent='';screen('test');render();clearInterval(interval);interval=setInterval(tick,1000);tick()}
function tick(){seconds--;if(seconds<0)seconds=0;$('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds===0)submit(true)}
function render(){let q=test[pos];$('counter').textContent='Question '+(pos+1)+' of '+N;$('question').textContent=q.question;$('options').innerHTML=q.options.map(o=>'<label class="opt"><input type="radio" name="answer" value="'+o.value+'" '+(answers[pos]===o.value?'checked':'')+'> '+o.value+') '+o.text+'</label>').join('');document.querySelectorAll('input[name=answer]').forEach(x=>x.addEventListener('change',()=>{answers[pos]=x.value;renderNav()}));$('prev').disabled=pos===0;$('next').disabled=pos===N-1;$('submit').style.display=(pos+1)===N?'inline-block':'none';renderNav()}
function renderNav(){let h='';test.forEach((q,i)=>h+='<button type="button" class="'+(answers[i]?'answered ':'')+(i===pos?'current':'')+'" data-i="'+i+'">'+(i+1)+'</button>');$('nav').innerHTML=h;document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{pos=Number(b.dataset.i);render()})}
function submit(auto){if(submitted)return;if(!auto&&!confirm('Are you sure you want to Finish & Submit the test?'))return;submitted=true;clearInterval(interval);let correct=0,wrong=0,unanswered=0;test.forEach((q,i)=>{if(!answers[i])unanswered++;else if(answers[i]===q.answer)correct++;else wrong++});let attempted=correct+wrong,pct=correct/N*100,accuracy=attempted?correct/attempted*100:0;showReport(correct,wrong,unanswered,attempted,pct,accuracy,auto);sendToCloudflare(correct,wrong,unanswered,pct,auto)}
function sendToCloudflare(correct,wrong,unanswered,pct,auto){let payload={name:studentName,reg:'N/A',subject:'English',score:correct,total:N,percentage:Number(pct.toFixed(1)),wrong:wrong,unanswered:unanswered,status:pct>=40?'PASS':'NEEDS IMPROVEMENT',autoSubmitted:auto,submittedAt:new Date().toISOString()};fetch(API+'/submit',{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload)}).then(r=>{if(!r.ok)throw new Error('Cloudflare '+r.status);$('message').textContent=auto?'Time expired — submitted automatically.':'Test submitted successfully.'}).catch(e=>{$('message').textContent=auto?'Time expired — report ready locally.':'Final report ready. Cloud save failed; local report is still available.'})}
function showReport(correct,wrong,unanswered,attempted,pct,accuracy,auto){$('rname').textContent=studentName;$('rsubject').textContent='English';$('score').textContent=correct+' / '+N;$('pct').textContent=pct.toFixed(1)+'%';$('attempted').textContent=attempted+' / '+N;$('correct').textContent=correct;$('wrong').textContent=wrong;$('unanswered').textContent=unanswered;$('accuracy').textContent=accuracy.toFixed(1)+'%';let status=pct>=80?'EXCELLENT':pct>=60?'VERY GOOD':pct>=40?'PASS':'NEEDS IMPROVEMENT';$('status').textContent=status;$('status').className='status-badge '+(pct>=80?'status-excellent':pct>=60?'status-good':pct>=40?'status-pass':'status-needs');$('message').textContent=auto?'Time expired — submitting your report...':'Submitting your report...';$('motivation').textContent=pct>=80?'Outstanding performance! 🌟':pct>=60?'Very good effort! 👏':pct>=40?'You passed! 🌟 Review the missed topics.':'Keep going! 💪 Review the weak areas and try again.';let h='';test.forEach((q,i)=>{let your=answers[i]||'Not answered',yourOpt=q.options.find(o=>o.value===your),ok=your===q.answer,co=q.options.find(o=>o.value===q.answer),res=ok?'Correct':your==='Not answered'?'Unanswered':'Wrong',cl=ok?'correct':your==='Not answered'?'not-answered':'wrong';h+='<div class="review-card '+cl+'"><div class="review-q">Q'+(i+1)+'. '+esc(q.question)+'</div><div class="review-line"><span>Your answer</span><b>'+esc(your==='Not answered'?'Not answered':your+') '+yourOpt.text)+'</b></div>'+(ok?'<div class="review-line"><b style="color:#15803d;font-size:18px">✓ Your answer is correct</b></div>':'<div class="review-line"><span>Correct answer</span><b>'+esc(q.answer+') '+co.text)+'</b></div><div class="result-badge">'+res+'</div>')+'</div>'});$('review').innerHTML=h;screen('result');window.scrollTo({top:0,behavior:'smooth'})}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function saveReport(){let rows=test.map((q,i)=>{let your=answers[i]||'Not answered',yourOpt=q.options.find(o=>o.value===your),co=q.options.find(o=>o.value===q.answer),res=your===q.answer?'Correct':your==='Not answered'?'Unanswered':'Wrong';return '<tr><td>'+(i+1)+'</td><td>'+esc(q.question)+'</td><td>'+esc(your==='Not answered'?'Not answered':your+') '+yourOpt.text)+'</td><td>'+esc(q.answer+') '+co.text)+'</td><td>'+res+'</td></tr>'}).join('');let html='<!doctype html><html><body><h1>English MCQ Internal Test – Final Report</h1><p><b>Student:</b> '+esc(studentName)+'</p><p><b>Subject:</b> English</p><p><b>Score:</b> '+$('score').textContent+' | <b>Percentage:</b> '+$('pct').textContent+' | <b>Status:</b> '+$('status').textContent+'</p><table border="1" cellpadding="7"><tr><th>No.</th><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th></tr>'+rows+'</table></body></html>';let blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='English_MCQ_Final_Report.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function finish(){clearInterval(interval);submitted=false;test=[];answers={};pos=0;studentName='';$('name').value='';screen('start');setGreeting()}
setGreeting();$('startBtn').onclick=startTest;$('name').addEventListener('keydown',e=>{if(e.key==='Enter')startTest()});$('prev').onclick=()=>{if(pos>0){pos--;render()}};$('next').onclick=()=>{if(pos<N-1){pos++;render()}};$('submit').onclick=()=>submit(false);$('save').onclick=saveReport;$('print').onclick=()=>window.print();$('startAgain').onclick=finish;
</script>
</body>
</html>
