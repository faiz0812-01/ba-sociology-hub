<script>
const QUESTIONS=[{"id":24,"question":"The type of cooperation occurs when people perform different task to achieve a common goal, it is termed as …………….?","options":[{"value":"A","text":"Indirect cooperation"},{"value":"B","text":"Primary cooperation"},{"value":"C","text":"Direct cooperation"},{"value":"D","text":"Tertiary cooperation"}],"answer":"A"},{"id":25,"question":"Which type of cooperative behaviour exist in business organization, churches and government agencies?","options":[{"value":"A","text":"Secondary cooperation"},{"value":"B","text":"Tertiary cooperation"},{"value":"C","text":"Direct cooperation"},{"value":"D","text":"Primary cooperation"}],"answer":"A"},{"id":26,"question":"The division of labour and specialization serves as the foundation for ……………. cooperation.","options":[{"value":"A","text":"Indirect cooperation"},{"value":"B","text":"Tertiary cooperation"},{"value":"C","text":"Direct cooperation"},{"value":"D","text":"Primary cooperation"}],"answer":"A"},{"id":27,"question":"Which type of cooperation is seen in groups like family or friendship groups?","options":[{"value":"A","text":"Primary cooperation"},{"value":"B","text":"Indirect cooperation"},{"value":"C","text":"Secondary cooperation"},{"value":"D","text":"Direct cooperation"}],"answer":"A"},{"id":28,"question":"Opportunistic attitudes is one of the characteristics of ………………. Cooperation","options":[{"value":"A","text":"Tertiary co-operation"},{"value":"B","text":"Indirect cooperation"},{"value":"C","text":"Secondary cooperation"},{"value":"D","text":"All of the above"}],"answer":"A"},{"id":29,"question":"Who defined \"Competition is an interaction without social contact\"?","options":[{"value":"A","text":"Park and Burgess"},{"value":"B","text":"Bogardus"},{"value":"C","text":"Green"},{"value":"D","text":"Horton and Hunt"}],"answer":"A"},{"id":30,"question":"Which of the following is not a characteristics of competition?","options":[{"value":"A","text":"Competition is endless"},{"value":"B","text":"Competition is static"},{"value":"C","text":"Competition causes social change"},{"value":"D","text":"competition is sub/conscious process"}],"answer":"B"},{"id":31,"question":"Which of the following is an example of economic competition?","options":[{"value":"A","text":"Individual fight for jobs"},{"value":"B","text":"people struggle for political power"},{"value":"C","text":"Cultural groups preserving traditions"},{"value":"D","text":"Political parties competing for votes"}],"answer":"A"},{"id":32,"question":"Which of the following is not a positive function of competition?","options":[{"value":"A","text":"Proper positioning of people"},{"value":"B","text":"Sources of motivation"},{"value":"C","text":"Fostering progress"},{"value":"D","text":"It leads to monopoly"}],"answer":"D"},{"id":33,"question":"Who defined “Conflict as ‘the deliberate attempt to oppose, resist or coerce the will of another or others”?","options":[{"value":"A","text":"W. Green"},{"value":"B","text":"Bogardus"},{"value":"C","text":"Anderson and Parker"},{"value":"D","text":"Gist NP"}],"answer":"A"},{"id":34,"question":"Which of the following sociologists considered human history as the history of class struggle?","options":[{"value":"A","text":"Karl Marx"},{"value":"B","text":"W Green"},{"value":"C","text":"CH Cooley"},{"value":"D","text":"Gillin and Gillin"}],"answer":"A"},{"id":35,"question":"Which of the following is not a type of conflict mentioned by George Simmel?","options":[{"value":"A","text":"War"},{"value":"B","text":"Feud conflict"},{"value":"C","text":"Litigation"},{"value":"D","text":"Personal Conflict"}],"answer":"D"},{"id":36,"question":"Which of the following is a type of conflict mentioned by Gillin and Gillin?","options":[{"value":"A","text":"Litigation"},{"value":"B","text":"Class conflict"},{"value":"C","text":"War"},{"value":"D","text":"Factional conflict"}],"answer":"B"},{"id":37,"question":"The term accommodation coined by ……………….?","options":[{"value":"A","text":"IM Baldwin"},{"value":"B","text":"Mac Iver"},{"value":"C","text":"Lundberg"},{"value":"D","text":"CH Cooley"}],"answer":"A"},{"id":38,"question":"………………. continuous adjustments that humans have to make to adapt to each other and to cope with situations","options":[{"value":"A","text":"Accommodation"},{"value":"B","text":"Assimilation"},{"value":"C","text":"Competition"},{"value":"D","text":"Conflict"}],"answer":"A"},{"id":39,"question":"“Accommodation is the adjustment of hostile individuals or groups”, defined by?","options":[{"value":"A","text":"Ogburn and Nimkoff"},{"value":"B","text":"Anderson and Parker"},{"value":"C","text":"Lundberg"},{"value":"D","text":"MacIver"}],"answer":"A"},{"id":40,"question":"Which of the following is not a method of accommodation?","options":[{"value":"A","text":"Tolerance"},{"value":"B","text":"Compromise"},{"value":"C","text":"Conflict"},{"value":"D","text":"Conversion"}],"answer":"C"},{"id":41,"question":"The process of adjusting or compromising after a conflict is known as:","options":[{"value":"A","text":"Competition"},{"value":"B","text":"Accommodation"},{"value":"C","text":"Cooperation"},{"value":"D","text":"Opposition"}],"answer":"B"},{"id":42,"question":"Which type of social interaction involves rivalry for scarce resources?","options":[{"value":"A","text":"Cooperation"},{"value":"B","text":"Competition"},{"value":"C","text":"Accommodation"},{"value":"D","text":"Assimilation"}],"answer":"B"},{"id":43,"question":"When a minority group gradually adopts the culture of the dominant group, it is termed as","options":[{"value":"A","text":"Assimilation"},{"value":"B","text":"Cooperation"},{"value":"C","text":"Conflict"},{"value":"D","text":"Accommodation"}],"answer":"A"},{"id":44,"question":"Which type of interaction refers to the deliberate attempt to oppose, resist, or coerce the will of another or others, often involving violence or threats?","options":[{"value":"A","text":"Competition"},{"value":"B","text":"Accommodation"},{"value":"C","text":"Conflict"},{"value":"D","text":"Exchange"}],"answer":"C"},{"id":45,"question":"The process by which one culture is absorbed and integrated into another is called","options":[{"value":"A","text":"Assimilation"},{"value":"B","text":"Cooperation"},{"value":"C","text":"Accommodation"},{"value":"D","text":"All of the above"}],"answer":"A"},{"id":46,"question":"Which of the following is not a characteristics of accommodation?","options":[{"value":"A","text":"Assimilation is not restricted to one area"},{"value":"B","text":"Assimilation is very fast process"},{"value":"C","text":"Assimilation is unconscious"},{"value":"D","text":"Assimilation is mutual"}],"answer":"B"},{"id":47,"question":"Who defined “By group, we mean any collection of human beings who are brought into social relationship with one another”?","options":[{"value":"A","text":"MacIver"},{"value":"B","text":"Gillin and Gillin"},{"value":"C","text":"GH Mead"},{"value":"D","text":"Karl Manheim"}],"answer":"A"},{"id":48,"question":"Which of the following is not a characteristics of social group?","options":[{"value":"A","text":"we feeling"},{"value":"B","text":"Common interests"},{"value":"C","text":"Different interests"},{"value":"D","text":"Groups are dynamics"}],"answer":"C"},{"id":49,"question":"George Simmel classified social groups into ………………","options":[{"value":"A","text":"Small groups and large groups"},{"value":"B","text":"Voluntary and Involuntary groups"},{"value":"C","text":"Primary and secondary groups"},{"value":"D","text":"Vertical and Horizontal groups"}],"answer":"A"},{"id":50,"question":"Which of the following not a social groups classified by Sanderson?","options":[{"value":"A","text":"Involuntary groups"},{"value":"B","text":"Voluntary groups"},{"value":"C","text":"Delegated groups"},{"value":"D","text":"Vertical groups"}],"answer":"D"},{"id":51,"question":"Who introduced the concept of primary groups?","options":[{"value":"A","text":"CH Cooley"},{"value":"B","text":"W Green"},{"value":"C","text":"Lundberg"},{"value":"D","text":"Nimkoff"}],"answer":"A"},{"id":52,"question":"Find out an example for primary group","options":[{"value":"A","text":"Family"},{"value":"B","text":"Factories"},{"value":"C","text":"Labour Union"},{"value":"D","text":"National political party"}],"answer":"A"},{"id":53,"question":"Which of the following book written by CH Cooley?","options":[{"value":"A","text":"Social organization: Human nature and social order"},{"value":"B","text":"Psychology of human society"},{"value":"C","text":"Folkways"},{"value":"D","text":"An outline of social psychology"}],"answer":"A"},{"id":54,"question":"Which of the following is a characteristics of secondary groups?","options":[{"value":"A","text":"Sense of belonging"},{"value":"B","text":"Emotional attachments"},{"value":"C","text":"Impersonal relationship"},{"value":"D","text":"Cooperation"}],"answer":"C"},{"id":55,"question":"The book ‘Folkways’ written by","options":[{"value":"A","text":"WG Sumner"},{"value":"B","text":"CH Cooley"},{"value":"C","text":"Muzafer Sherif"},{"value":"D","text":"MacIver"}],"answer":"A"},{"id":56,"question":"Pitirim Sorokin classified social group into","options":[{"value":"A","text":"Horizontal and vertical groups"},{"value":"B","text":"Primary and Secondary groups"},{"value":"C","text":"Organized and Unorganized groups"},{"value":"D","text":"Voluntary and Involuntary groups"}],"answer":"A"},{"id":57,"question":"A person becomes a member of a group based on his own will, it refers to","options":[{"value":"A","text":"Voluntary group"},{"value":"B","text":"In group"},{"value":"C","text":"Primary Group"},{"value":"D","text":"All of the above"}],"answer":"A"},{"id":58,"question":"Delegated groups refers to","options":[{"value":"A","text":"A group of individual only as representative of others"},{"value":"B","text":"A group formed on the basis of intimacy level"},{"value":"C","text":"Member of a group on the basis of his own will"},{"value":"D","text":"A group formed on the basis of incidental interactions"}],"answer":"A"},{"id":59,"question":"The …………….. is primarily used for explain the members who are alike in their status or positions in the society.","options":[{"value":"A","text":"Horizontal group"},{"value":"B","text":"Out groups"},{"value":"C","text":"Unorganized groups"},{"value":"D","text":"Vertical group"}],"answer":"A"},{"id":60,"question":"Which of the following is a groups depicts the interactions of members with a sense of unity and support?","options":[{"value":"A","text":"In groups"},{"value":"B","text":"Out groups"},{"value":"C","text":"Unorganized groups"},{"value":"D","text":"Ephemeral groups"}],"answer":"A"},{"id":61,"question":"Find out an example for Horizontal groups","options":[{"value":"A","text":"Occupational groups"},{"value":"B","text":"Family"},{"value":"C","text":"Social classes"},{"value":"D","text":"Bureaucracy"}],"answer":"C"},{"id":62,"question":"…………………. are temporary groups formed through short-term or incidental interactions","options":[{"value":"A","text":"Ephemeral group"},{"value":"B","text":"In group"},{"value":"C","text":"Involuntary group"},{"value":"D","text":"Enduring group"}],"answer":"A"},{"id":63,"question":"The term ‘reference group’ introduced by?","options":[{"value":"A","text":"Muzafer Sherif"},{"value":"B","text":"WG Sumner"},{"value":"C","text":"CH Cooley"},{"value":"D","text":"MacIver"}],"answer":"A"},{"id":64,"question":"The book 'An Outline of Social Psychology' written by?","options":[{"value":"A","text":"Muzafer Sherif"},{"value":"B","text":"WG Sumner"},{"value":"C","text":"MacIver"},{"value":"D","text":"Bogardus"}],"answer":"A"},{"id":65,"question":"Ferdinand Tonnies classified social groups into ……………..?","options":[{"value":"A","text":"Gemeinschaft and Gesellschaft"},{"value":"B","text":"Genetic and Congregate groups"},{"value":"C","text":"Natural and Formed groups"},{"value":"D","text":"Voluntary and Involuntary groups"}],"answer":"A"},{"id":66,"question":"Find out an example for congregate groups","options":[{"value":"A","text":"Family"},{"value":"B","text":"Religious group"},{"value":"C","text":"Caste"},{"value":"D","text":"Political Party"}],"answer":"B"},{"id":67,"question":"Find out an example for secondary socialization","options":[{"value":"A","text":"Family"},{"value":"B","text":"Peer groups and school"},{"value":"C","text":"Religious institutions only"},{"value":"D","text":"All of the above"}],"answer":"B"},{"id":68,"question":"Anticipatory socialization refers to","options":[{"value":"A","text":"Learning to human behaviour"},{"value":"B","text":"Preparation for future roles"},{"value":"C","text":"Learning through education only"},{"value":"D","text":"All of the above"}],"answer":"B"},{"id":69,"question":"The term anticipatory socialization developed by","options":[{"value":"A","text":"Robert K Merton"},{"value":"B","text":"Kimball Young"},{"value":"C","text":"Bogardus"},{"value":"D","text":"Anthony Giddens"}],"answer":"A"},{"id":70,"question":"……………… is a change of behaviour process where one gives up the old behaviour patterns and social roles to take up the new ones.","options":[{"value":"A","text":"Re-socialization"},{"value":"B","text":"Anticipatory socialization"},{"value":"C","text":"Primary socialization"},{"value":"D","text":"Developmental socialization"}],"answer":"A"},{"id":71,"question":"It is the process where individuals acquire gender roles and expectations that are socially constructed.","options":[{"value":"A","text":"Gender socialization"},{"value":"B","text":"Developmental socialization"},{"value":"C","text":"Resocialization"},{"value":"D","text":"Anticipatory socialization"}],"answer":"A"},{"id":72,"question":"Who defined “Socialization is a process through which social nature of human is formed from natural human nature, and an individual turns into a person.”?","options":[{"value":"A","text":"H. T. Majumdar"},{"value":"B","text":"Macionis.JJ"},{"value":"C","text":"Peter Worsley"},{"value":"D","text":"Lundberg"}],"answer":"A"},{"id":73,"question":"The primary agents of early socialization?","options":[{"value":"A","text":"Peer group"},{"value":"B","text":"Family"},{"value":"C","text":"Media"},{"value":"D","text":"Religion"}],"answer":"B"},{"id":74,"question":"Which of the following is considered an formal agent of socialization?","options":[{"value":"A","text":"School"},{"value":"B","text":"Family"},{"value":"C","text":"Peer group"},{"value":"D","text":"Mass media"}],"answer":"A"},{"id":75,"question":"Which of the following is considered an informal agent of socialization?","options":[{"value":"A","text":"School"},{"value":"B","text":"Media"},{"value":"C","text":"Workplace"},{"value":"D","text":"Government"}],"answer":"B"},{"id":76,"question":"The process by which individuals learn ideas, values and norms through mass communication is called:","options":[{"value":"A","text":"Anticipatory socialization"},{"value":"B","text":"Secondary socialization"},{"value":"C","text":"Media socialization"},{"value":"D","text":"Resocialization"}],"answer":"C"},{"id":77,"question":"It is an organized part of the personality structure and which organize our thoughts as well as makes a sense of the reality around us.","options":[{"value":"A","text":"Ego"},{"value":"B","text":"Id"},{"value":"C","text":"Super ego"},{"value":"D","text":"Repression"}],"answer":"A"},{"id":78,"question":"The ……………… is mainly a logical and conscious part of the mind","options":[{"value":"A","text":"Ego"},{"value":"B","text":"Super ego"},{"value":"C","text":"Id"},{"value":"D","text":"Sublimation"}],"answer":"A"},{"id":79,"question":"Which structure of the personality operated on the morality principle","options":[{"value":"A","text":"Super ego"},{"value":"B","text":"Id"},{"value":"C","text":"Rationalization"},{"value":"D","text":"Ego"}],"answer":"A"},{"id":80,"question":"According to the Freud, which of the following is a primary stage of personality development?","options":[{"value":"A","text":"Anal Stage"},{"value":"B","text":"Phallic Stage"},{"value":"C","text":"Oral Stage"},{"value":"D","text":"Genital stage"}],"answer":"C"},{"id":81,"question":"What is the approximate age range for the Anal Stage of psychosexual development?","options":[{"value":"A","text":"Birth to 1 year"},{"value":"B","text":"3 to 6 years"},{"value":"C","text":"1 to 3 years"},{"value":"D","text":"2 to 4 years"}],"answer":"C"},{"id":82,"question":"The conflict that arises in the Phallic Stage, where a boy develops sexual desires for his mother and views his father as a rival, is known as the…………","options":[{"value":"A","text":"Oedipus complex"},{"value":"B","text":"Regression"},{"value":"C","text":"Moral anxiety"},{"value":"D","text":"Electra complex"}],"answer":"A"},{"id":83,"question":"A female child could develop that love for the father and the jealousy against the mother, considering the latter to be a rival. It is known as …………..","options":[{"value":"A","text":"Electra complex"},{"value":"B","text":"Realistic anxiety"},{"value":"C","text":"Oedipus complex"},{"value":"D","text":"Moral anxiety"}],"answer":"A"},{"id":84,"question":"According to Freud, Which of the following stage is characterised that a people develop skills, values and relationship with peers and adults outside the family","options":[{"value":"A","text":"Latent stage"},{"value":"B","text":"Phallic stage"},{"value":"C","text":"Genital stage"},{"value":"D","text":"Realistic stage"}],"answer":"A"},{"id":85,"question":"Which of the following sociologists suggest that self is not inborn but rather it comes from social experience or continuous interaction with other people","options":[{"value":"A","text":"GH Mead"},{"value":"B","text":"Jean Piaget"},{"value":"C","text":"Sigmund Freud"},{"value":"D","text":"Cooley"}],"answer":"A"},{"id":86,"question":"According to GH mead, the self as comprising two inter related elements, that are …………..","options":[{"value":"A","text":"I and Me"},{"value":"B","text":"Oedipus and Electra complex"},{"value":"C","text":"You and Me"},{"value":"D","text":"Emotion and Cognition"}],"answer":"A"},{"id":87,"question":"According to Mead, which of the following is an first stage of socialization?","options":[{"value":"A","text":"Oral stage"},{"value":"B","text":"Imitation"},{"value":"C","text":"Game stage"},{"value":"D","text":"Genital stage"}],"answer":"B"},{"id":88,"question":"Which of the following is not a stage of socialization proposed by GH Mead?","options":[{"value":"A","text":"Imitation"},{"value":"B","text":"Play stage"},{"value":"C","text":"Game stage"},{"value":"D","text":"Genital stage"}],"answer":"D"},{"id":89,"question":"Theory of cognitive development proposed by?","options":[{"value":"A","text":"Jean Piaget"},{"value":"B","text":"GH Mead"},{"value":"C","text":"Sigmund Freud"},{"value":"D","text":"Skinner"}],"answer":"A"},{"id":90,"question":"Which of the following theorist proposed that ability of children learning is limited and influenced by their stage of cognitive neutrality?","options":[{"value":"A","text":"Jean Piaget"},{"value":"B","text":"Sigmund Freud"},{"value":"C","text":"Albert Bandura"},{"value":"D","text":"GH mead"}],"answer":"A"},{"id":91,"question":"According to Piaget, which of the following is a primary stage of socialization?","options":[{"value":"A","text":"Sensorimotor stage"},{"value":"B","text":"Preoperational stage"},{"value":"C","text":"Concrete operational stage"},{"value":"D","text":"Formal operational stage"}],"answer":"A"}];
const N=60,MIN=30,API='https://ba-sociology-results.faiz0812.workers.dev';let test=[],answers={},pos=0,seconds=MIN*60,interval=null,studentName='',submitted=false;
const $=id=>document.getElementById(id);
const GREETINGS=['Hello! 👋 Welcome to your Sociology Mock Test! 🌟 All the best — believe in yourself and give it your best shot! 💪📚','Hi there! 😊 Ready to challenge yourself? 🧠✨ Stay calm, think carefully, and enjoy the test! 🎯','Welcome! 🎉 Your learning journey continues here. 📚🌱 Give your best effort and make yourself proud! 💪😊','Good to see you! 👋 Let’s begin this learning challenge. 🧠🚀 Read each question carefully and stay confident! 🌟','Hello, future achiever! 🌟😊 Take a deep breath, stay focused, and show what you know! 📖💪','Welcome to the test! 🎓✨ Every question is an opportunity to learn. Do your best and keep smiling! 😄📚'];function setGreeting(){$('greeting').textContent=GREETINGS[Math.floor(Math.random()*GREETINGS.length)]}function shuffle(arr){let x=arr.slice();for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function screen(id){['start','test','result'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}
function startTest(){studentName=$('name').value.trim();if(!studentName){$('msg').textContent='Please enter Student Name.';return}test=shuffle(QUESTIONS).slice(0,N);answers={};pos=0;seconds=MIN*60;submitted=false;screen('test');render();clearInterval(interval);interval=setInterval(tick,1000);tick()}
setGreeting();function tick(){seconds--;if(seconds<0)seconds=0;$('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds===0)submit(true)}
function render(){let questionIndex=pos;let q=test[pos];$('counter').textContent='Question '+(pos+1)+' of '+N;$('question').textContent=q.question;$('options').innerHTML=q.options.map(o=>'<label class="opt"><input type="radio" name="answer" value="'+o.value+'" '+(answers[pos]===o.value?'checked':'')+'> '+o.value+') '+o.text+'</label>').join('');if(answers[questionIndex])lockAnswerOptions('#options');document.querySelectorAll('input[name=answer]').forEach(x=>x.addEventListener('change',()=>{if(answers[questionIndex]){x.checked=x.value===answers[questionIndex];lockAnswerOptions('#options');return}answers[questionIndex]=x.value;lockAnswerOptions('#options');paintAnswerFeedback(q,'#options',x.value);renderNav()}));$('prev').disabled=pos===0;$('next').disabled=pos===N-1;$('submit').style.display=(pos>=N-3?'inline-block':'none');renderNav()}
function renderNav(){let h='';test.forEach((q,i)=>h+='<button class="'+(answers[i]?'answered ':'')+(i===pos?'current':'')+'" data-i="'+i+'">'+(i+1)+'</button>');$('nav').innerHTML=h;document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{pos=Number(b.dataset.i);render()})}
function submit(auto){if(submitted)return;if(!auto&&!confirm('Are you sure you want to Finish & Submit the test?'))return;submitted=true;clearInterval(interval);let correct=0,wrong=0,unanswered=0;test.forEach((q,i)=>{if(!answers[i])unanswered++;else if(answers[i]===q.answer)correct++;else wrong++});let attempted=correct+wrong,pct=correct/N*100,accuracy=attempted?correct/attempted*100:0;showReport(correct,wrong,unanswered,attempted,pct,accuracy,auto);sendToCloudflare(correct,wrong,unanswered,pct,auto)}
function sendToCloudflare(correct,wrong,unanswered,pct,auto){let payload={name:studentName,reg:'N/A',subject:'Sociology mod-3,4 Mock Test - 60Q',score:correct,total:N,percentage:Number(pct.toFixed(1)),wrong:wrong,unanswered:unanswered,status:pct>=40?'PASS':'NEEDS IMPROVEMENT',autoSubmitted:auto,submittedAt:new Date().toISOString()};fetch(API+'/submit',{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload)}).then(r=>{if(!r.ok)throw new Error('Cloudflare '+r.status);$('message').textContent=''}).catch(e=>{$('message').textContent='Final report ready. Cloudflare save failed; local report is still available.';console.warn(e)})}
function showReport(correct,wrong,unanswered,attempted,pct,accuracy,auto){$('rname').textContent=studentName;$('motivation').textContent=pct>=80?['Outstanding performance! 🌟 You have shown strong preparation. Keep this momentum going!','Excellent result! 💪 You are clearly building strong command of the subject. Aim even higher in the next test!','Fantastic work! 🎯 Your preparation is paying off. Keep challenging yourself!'][Math.floor(Math.random()*3)]:pct>=60?['Very good effort! 👏 You have a strong foundation. Review your mistakes and push towards the next level!','Good progress! 📚 Your understanding is developing well. Keep practicing the difficult areas!','Well done! 🚀 You are on the right track. A little more focused revision can take you even higher!'][Math.floor(Math.random()*3)]:pct>=40?['You passed — well done! 🌟 Now let us strengthen the areas you missed. Review your mistakes and try again!','Good effort! 💪 You have crossed the pass level. As your mentor, I suggest revising the weak topics before your next attempt.','You are making progress! 📖 Do not stop here. Practice the questions you got wrong and aim for a higher score next time!'][Math.floor(Math.random()*3)]:['Do not be discouraged. ❤️ This result is a starting point, not a final judgment. As your mentor, I recommend reviewing the wrong answers and trying the test again.','Keep going! 💪 A low score simply shows where more preparation is needed. Study the weak areas step by step and come back stronger!','No worries — every mistake is a learning opportunity. 📚 Let us use this result to identify your weak areas and improve your score next time!'][Math.floor(Math.random()*3)];$('score').textContent=correct+' / '+N;$('pct').textContent=pct.toFixed(1)+'%';$('attempted').textContent=attempted+' / '+N;$('correct').textContent=correct;$('wrong').textContent=wrong;$('unanswered').textContent=unanswered;$('accuracy').textContent=accuracy.toFixed(1)+'%';$('status').textContent=pct>=80?'EXCELLENT':pct>=60?'VERY GOOD':pct>=40?'PASS':'NEEDS IMPROVEMENT';$('status').className='status-badge '+(pct>=80?'status-excellent':pct>=60?'status-good':pct>=40?'status-pass':'status-needs');$('message').textContent=auto?'Time expired — submitted automatically.':'Test submitted successfully.';let h='';test.forEach((q,i)=>{let your=answers[i]||'Not answered',ok=your===q.answer,res=ok?'Correct':your==='Not answered'?'Unanswered':'Wrong',co=q.options.find(o=>o.value===q.answer);let cls=res==='Correct'?'correct':res==='Wrong'?'wrong':'not-answered';h+='<div class="review-card '+cls+'"><div class="review-q">Q'+(i+1)+'. '+q.question+'</div><div class="review-line"><span>Your answer</span><b>'+your+'</b></div><div class="review-line"><span>Correct answer</span><b>'+q.answer+') '+co.text+'</b></div><div class="result-badge">'+res+'</div></div>'});$('review').innerHTML=h;screen('result');window.scrollTo({top:0,behavior:'smooth'})}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function saveReport(){let rows=test.map((q,i)=>{let your=answers[i]||'Not answered',co=q.options.find(o=>o.value===q.answer);let res=your===q.answer?'Correct':your==='Not answered'?'Unanswered':'Wrong';return '<tr><td>'+(i+1)+'</td><td>'+escapeHtml(q.question)+'</td><td>'+escapeHtml(your)+'</td><td>'+escapeHtml(q.answer+') '+co.text)+'</td><td>'+res+'</td></tr>'}).join('');let html='<!doctype html><html><head><meta charset="utf-8"><title>Sociology Final Report</title></head><body><h1>Sociology mod-3,4 Mock Test – Final Report</h1><p><b>Student:</b> '+escapeHtml(studentName)+'</p><p><b>Score:</b> '+$('score').textContent+' | <b>Percentage:</b> '+$('pct').textContent+' | <b>Status:</b> '+$('status').textContent+'</p><table border="1" cellpadding="7" cellspacing="0"><tr><th>No.</th><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th></tr>'+rows+'</table></body></html>';let blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Sociology_mod-3-4_Final_Report.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function finish(){clearInterval(interval);submitted=false;test=[];answers={};pos=0;studentName='';$('name').value='';$('msg').textContent='';screen('start');window.scrollTo(0,0)}
$('startBtn').onclick=startTest;$('prev').onclick=()=>{if(pos>0){pos--;render()}};$('next').onclick=()=>{if(pos<N-1){pos++;render()}};$('submit').onclick=()=>submit(false);$('save').onclick=saveReport;$('print').onclick=()=>window.print();$('startAgain').onclick=finish;

function lockAnswerOptions(selector){const box=document.querySelector(selector);if(!box)return;box.querySelectorAll('input[type="radio"]').forEach(input=>input.disabled=true);box.querySelectorAll('.opt,.option').forEach(label=>label.classList.add('locked'));}
function paintAnswerFeedback(q,selector,selected){const box=document.querySelector(selector);if(!box)return;box.querySelectorAll('.opt,.option').forEach(label=>label.classList.remove('correct-reveal'));if(!selected||selected===q.answer)return;box.querySelectorAll('input[type="radio"]').forEach(input=>{if(input.value===q.answer){const label=input.closest('.opt,.option');if(label)label.classList.add('correct-reveal');}});}
</script></body></html>
