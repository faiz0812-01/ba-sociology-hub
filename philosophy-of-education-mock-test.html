const QUESTIONS=[{"id":1,"question":"The word \"education\" is derived from…….","options":[{"value":"A","text":"Latin word"},{"value":"B","text":"Greek"},{"value":"C","text":"English"},{"value":"D","text":"None of the above"}],"answer":"A"},{"id":2,"question":"According to Socrates education is an intellectual………………","options":[{"value":"A","text":"Midwifery"},{"value":"B","text":"Actualize Human Potential"},{"value":"C","text":"Formation of Personality"},{"value":"D","text":"None of the above"}],"answer":"A"},{"id":3,"question":"The philosophical view that all that exists is physical……...….","options":[{"value":"A","text":"Materialism"},{"value":"B","text":"Idealism"},{"value":"C","text":"Pragmatism"},{"value":"D","text":"None of the above"}],"answer":"A"},{"id":4,"question":"The concept of Eudaimonia is related to:","options":[{"value":"A","text":"Aristotle"},{"value":"B","text":"Plato"},{"value":"C","text":"Socrates"},{"value":"D","text":"None of the above"}],"answer":"A"},{"id":5,"question":"“Education is not a preparation for life but life itself” who said it?","options":[{"value":"A","text":"Dewey"},{"value":"B","text":"Aristotle"},{"value":"C","text":"Plato"},{"value":"D","text":"None of the above"}],"answer":"A"},{"id":6,"question":"Western educational philosophy was laid in ancient………","options":[{"value":"A","text":"Dewey"},{"value":"B","text":"Plato"},{"value":"C","text":"Aristotle"},{"value":"D","text":"None of the above"}],"answer":"B"},{"id":8,"question":"The fundamental axiom of ……………. education is that the child is not a miniature adult, but a unique being with distinct stages of growth.","options":[{"value":"A","text":"Naturalistic"},{"value":"B","text":"Idealistic"},{"value":"C","text":"Pragmatistic"},{"value":"D","text":"None of the above"}],"answer":"A"},{"id":9,"question":"According to …………… the primary aim of education is the development of the individual’s personality and the realization of their highest potential.","options":[{"value":"A","text":"Pragmatism"},{"value":"B","text":"Idealism"},{"value":"C","text":"Naturalism"},{"value":"D","text":"None of the above"}],"answer":"B"},{"id":10,"question":"The quintessential Idealist method is………... pioneered by Socrates and refined by Plato and Hegel.","options":[{"value":"A","text":"Dialectical method"},{"value":"B","text":"Doing and learning method"},{"value":"C","text":"Lecturing"},{"value":"D","text":"None of the above Part 2: Modern Indian Educational Thinkers"}],"answer":"A"},{"id":11,"question":"The ultimate aim of education according to……………is the manifestation of the perfection already inherent within the individual.","options":[{"value":"A","text":"Vivekananda"},{"value":"B","text":"Gandhi"},{"value":"C","text":"Ambedkar"},{"value":"D","text":"None of the above"}],"answer":"A"},{"id":12,"question":"The most evocative term in Vivekananda’s educational lexicon is…….","options":[{"value":"A","text":"Man-making"},{"value":"B","text":"Social"},{"value":"C","text":"Citizen"},{"value":"D","text":"None of the above"}],"answer":"A"},{"id":13,"question":"Aurobindo’s philosophy of education is a call for a ………….","options":[{"value":"A","text":"Spiritualized humanity"},{"value":"B","text":"Personality oriented"},{"value":"C","text":"Industrial oriented"},{"value":"D","text":"None of the above"}],"answer":"A"},{"id":14,"question":"Aurobindo’s Integral Education is challenging the dominant …………concept of education.","options":[{"value":"A","text":"Banking concept"},{"value":"B","text":"Idealistic concept"},{"value":"C","text":"Naturalistic concept"},{"value":"D","text":"None of the above"}],"answer":"A"},{"id":15,"question":"According to who, the daily engagement in a productive craft provided rigorous and purposeful physical training.","options":[{"value":"A","text":"Gandhi"},{"value":"B","text":"Vivekananda"},{"value":"C","text":"Aurobindo"},{"value":"D","text":"None of the above LMS Video MCQs: Module 1"}],"answer":"A"},{"id":16,"question":"The word education is derived from the Latin term educare, which means:","options":[{"value":"A","text":"To instruct formally"},{"value":"B","text":"To lead out or draw forth"},{"value":"C","text":"To discipline strictly"},{"value":"D","text":"To examine critically"}],"answer":"B"},{"id":17,"question":"According to Plato, education is primarily the process of:","options":[{"value":"A","text":"Memorizing facts and information"},{"value":"B","text":"Preparing for employment"},{"value":"C","text":"Turning the soul toward the light of truth"},{"value":"D","text":"Training for political leadership only"}],"answer":"C"},{"id":18,"question":"Aristotle believed that the main aim of education is:","options":[{"value":"A","text":"Economic productivity"},{"value":"B","text":"Development of sound mind in sound body"},{"value":"C","text":"Religious obedience alone"},{"value":"D","text":"Technical specialization"}],"answer":"B"},{"id":19,"question":"The term education is derived from the Latin words educare and educere, which primarily mean:","options":[{"value":"A","text":"Training for economic productivity"},{"value":"B","text":"Preparation for political power"},{"value":"C","text":"Turning the soul towards the light of truth"},{"value":"D","text":"Memorization of established doctrines"}],"answer":"B"},{"id":21,"question":"In Democracy and Education, John Dewey argues that education is:","options":[{"value":"A","text":"Preparation for examinations"},{"value":"B","text":"Life itself and rooted in experience"},{"value":"C","text":"Limited to moral instruction"},{"value":"D","text":"Must focus only on vocational skills"}],"answer":"B"},{"id":22,"question":"The concept of conscientization in education is mainly associated with:","options":[{"value":"A","text":"Aristotle"},{"value":"B","text":"Mahatma Gandhi"},{"value":"C","text":"Paulo Freire"},{"value":"D","text":"Plato"}],"answer":"C"},{"id":23,"question":"According to UNESCO, one of the major contemporary aims of education is to promote:","options":[{"value":"A","text":"Military expansion"},{"value":"B","text":"Cultural isolation"},{"value":"C","text":"Peace and sustainable development"},{"value":"D","text":"Social hierarchy"}],"answer":"C"},{"id":24,"question":"The primary aim of the philosophy of education is to:","options":[{"value":"A","text":"Provide technical training methods"},{"value":"B","text":"Critically examine the aims, values and foundations of education"},{"value":"C","text":"Replace classroom teaching with research"},{"value":"D","text":"Focus only on administrative management"}],"answer":"B"},{"id":25,"question":"The normative function of the philosophy of education mainly deals with:","options":[{"value":"A","text":"Plato"},{"value":"B","text":"Aristotle"},{"value":"C","text":"John Dewey"},{"value":"D","text":"Thomas Aquinas"}],"answer":"B"},{"id":27,"question":"The analytical function of philosophy of education primarily involves:","options":[{"value":"A","text":"Memorizing educational theories"},{"value":"B","text":"Examining logical inconsistencies in educational arguments"},{"value":"C","text":"Increasing classroom discipline"},{"value":"D","text":"Preparing students for examinations"}],"answer":"B"},{"id":28,"question":"The philosophy of education helps in curriculum development by:","options":[{"value":"A","text":"Ignoring social values"},{"value":"B","text":"Providing a rational basis for selecting subjects and content"},{"value":"C","text":"Eliminating teacher responsibilities"},{"value":"D","text":"Focusing only on vocational subjects"}],"answer":"B"},{"id":29,"question":"Which of the following best describes the primary functions of philosophy?","options":[{"value":"A","text":"To conduct laboratory experiments"},{"value":"B","text":"To collect statistical data"},{"value":"C","text":"To critically examine fundamental questions about reality, knowledge, and values"},{"value":"D","text":"To provide technical training"}],"answer":"C"},{"id":30,"question":"The branch of philosophy that deals with the nature and limits of knowledge is called:","options":[{"value":"A","text":"Ethics"},{"value":"B","text":"Metaphysics"},{"value":"C","text":"Epistemology"},{"value":"D","text":"Aesthetics"}],"answer":"C"},{"id":31,"question":"Who is known for developing the method of systematic questioning known as the Socratic method?","options":[{"value":"A","text":"Logic"},{"value":"B","text":"Aesthetics"},{"value":"C","text":"Ethics"},{"value":"D","text":"Epistemology"}],"answer":"B"},{"id":33,"question":"The scope of philosophy includes all of the following except:","options":[{"value":"A","text":"Studying ultimate reality"},{"value":"B","text":"Analysis of reasoning"},{"value":"C","text":"Examination of moral values"},{"value":"D","text":"Manufacturing of industrial goods LMS Video MCQs: Module 2"}],"answer":"D"},{"id":34,"question":"According to Idealism, the ultimate aim of education is:","options":[{"value":"A","text":"Development of physical strength"},{"value":"B","text":"Preparation for employment"},{"value":"C","text":"Development of the mind and realization of the self"},{"value":"D","text":"Acquisition of technical skills"}],"answer":"C"},{"id":35,"question":"Who is regarded as an important philosopher associated with Idealism in educational philosophy?","options":[{"value":"A","text":"John Dewey"},{"value":"B","text":"Plato"},{"value":"C","text":"Karl Marx"},{"value":"D","text":"Herbert Spencer"}],"answer":"B"},{"id":36,"question":"Sri Aurobindo's concept of education emphasizes:","options":[{"value":"A","text":"Only vocational training"},{"value":"B","text":"Memorization of textbooks"},{"value":"C","text":"Integral development of the individual"},{"value":"D","text":"Physical education alone"}],"answer":"C"},{"id":37,"question":"What is considered the most important aim of idealistic education?","options":[{"value":"A","text":"Collection of facts"},{"value":"B","text":"Memorization of information"},{"value":"C","text":"Concentration of mind"},{"value":"D","text":"Preparation for examinations"}],"answer":"B"},{"id":39,"question":"Who is regarded as the founder of the kindergarten system?","options":[{"value":"A","text":"John Dewey"},{"value":"B","text":"Plato"},{"value":"C","text":"Friedrich Froebel"},{"value":"D","text":"Swami Vivekananda"}],"answer":"C"},{"id":40,"question":"Which of the following is emphasized by idealism in education?","options":[{"value":"A","text":"Material success alone"},{"value":"B","text":"Mental, moral and spiritual development"},{"value":"C","text":"Specialized vocational learning only"},{"value":"D","text":"Memorization of facts"}],"answer":"B"},{"id":41,"question":"Which teaching method did Plato consider the best method of learning?","options":[{"value":"A","text":"Lecture method"},{"value":"B","text":"Imitation method"},{"value":"C","text":"Dialectic method"},{"value":"D","text":"Drill method"}],"answer":"C"},{"id":42,"question":"According to idealism, the teacher is primarily regarded as:","options":[{"value":"A","text":"An examiner"},{"value":"B","text":"A spiritual and moral guide"},{"value":"C","text":"A classroom administrator"},{"value":"D","text":"A technical instructor"}],"answer":"B"},{"id":43,"question":"According to Naturalism, the ultimate reality is:","options":[{"value":"A","text":"Plato"},{"value":"B","text":"Jean-Jacques Rousseau"},{"value":"C","text":"John Dewey"},{"value":"D","text":"Aristotle"}],"answer":"C"},{"id":45,"question":"According to Rousseau, the best teacher of the child is:","options":[{"value":"A","text":"The school"},{"value":"B","text":"The textbook"},{"value":"C","text":"Nature"},{"value":"D","text":"The parent"}],"answer":"C"},{"id":46,"question":"Which method of education is strongly associated with Rousseau's Naturalism?","options":[{"value":"A","text":"Rote learning"},{"value":"B","text":"Play-way method"},{"value":"C","text":"Lecture method"},{"value":"D","text":"Dictation method"}],"answer":"B"},{"id":47,"question":"According to Naturalism, the senses are regarded as:","options":[{"value":"A","text":"Obstacles to knowledge"},{"value":"B","text":"The gateway to knowledge"},{"value":"C","text":"Sources of moral values only"},{"value":"D","text":"Means of memorization"}],"answer":"B"},{"id":48,"question":"Which of the following is an important aim of Naturalistic education?","options":[{"value":"A","text":"Memorization of facts"},{"value":"B","text":"Preparation only for examinations"},{"value":"C","text":"Adjustment with the environment"},{"value":"D","text":"Strict discipline and obedience"}],"answer":"C"},{"id":49,"question":"What is the slogan “Back to Nature” associated with in education?","options":[{"value":"A","text":"Development according to the child’s nature"},{"value":"B","text":"Memorization of textbooks"},{"value":"C","text":"Strict discipline"},{"value":"D","text":"Teacher-centered learning"}],"answer":"B"},{"id":51,"question":"Which type of curriculum is preferred by Naturalism?","options":[{"value":"A","text":"Rigid and fixed curriculum"},{"value":"B","text":"Teacher-centered curriculum"},{"value":"C","text":"Child-centered curriculum"},{"value":"D","text":"Examination-centered curriculum"}],"answer":"C"},{"id":52,"question":"Which of the following is emphasized in Naturalistic education?","options":[{"value":"A","text":"Rote learning"},{"value":"B","text":"Learning through experience"},{"value":"C","text":"Verbal instruction only"},{"value":"D","text":"Memorization"}],"answer":"B"},{"id":53,"question":"Which book by Rousseau is associated with his educational philosophy?","options":[{"value":"A","text":"The Republic"},{"value":"B","text":"Democracy and Education"},{"value":"C","text":"Emile, or On Education"},{"value":"D","text":"The School and Society"}],"answer":"C"},{"id":54,"question":"Rousseau’s concept of “negative education” emphasizes:","options":[{"value":"A","text":"Giving children more textbooks"},{"value":"B","text":"Filling the child's mind with information"},{"value":"C","text":"Minimal interference in the child’s natural development"},{"value":"D","text":"Strict teacher control"}],"answer":"C"},{"id":55,"question":"According to Naturalism, the central position in education is given to the:","options":[{"value":"A","text":"Authoritative instructor"},{"value":"B","text":"Non-interfering observer and facilitator"},{"value":"C","text":"Strict disciplinarian"},{"value":"D","text":"Examiner"}],"answer":"D"},{"id":57,"question":"Which method does Naturalism emphasize for acquiring knowledge?","options":[{"value":"A","text":"Learning by doing"},{"value":"B","text":"Rote memorization"},{"value":"C","text":"Dictation"},{"value":"D","text":"Repetition of textbook content"}],"answer":"A"},{"id":58,"question":"Which of the following is emphasized by Naturalism in education?","options":[{"value":"A","text":"Freedom, initiative and self-expression"},{"value":"B","text":"Strict discipline and punishment"},{"value":"C","text":"Fixed curriculum and textbooks"},{"value":"D","text":"Teacher authority"}],"answer":"A"},{"id":59,"question":"Naturalistic education primarily emphasizes the development of the child through:","options":[{"value":"A","text":"Bookish knowledge"},{"value":"B","text":"Direct experience with nature and environment"},{"value":"C","text":"Examination preparation"},{"value":"D","text":"Teacher lectures"}],"answer":"B"},{"id":60,"question":"The term “Pragmatism” is derived from the Greek word pragma, which means:","options":[{"value":"A","text":"Truth"},{"value":"B","text":"Activity, practice or action"},{"value":"C","text":"Knowledge"},{"value":"D","text":"Nature"}],"answer":"B"},{"id":61,"question":"Who is considered the father of pragmatism in education?","options":[{"value":"A","text":"Learning through memorization"},{"value":"B","text":"Learning through lectures"},{"value":"C","text":"Learning by doing"},{"value":"D","text":"Learning through textbooks"}],"answer":"C"},{"id":63,"question":"According to pragmatism, the curriculum should primarily be:","options":[{"value":"A","text":"Fixed and rigid"},{"value":"B","text":"Teacher-centered"},{"value":"C","text":"Child-centered, dynamic and flexible"},{"value":"D","text":"Based only on theoretical knowledge"}],"answer":"C"},{"id":64,"question":"According to John Dewey, education is primarily:","options":[{"value":"A","text":"Preparation for examinations"},{"value":"B","text":"Reconstruction of experience"},{"value":"C","text":"Memorization of facts"},{"value":"D","text":"Transmission of fixed truths"}],"answer":"B"},{"id":65,"question":"According to pragmatism, the role of the teacher is primarily that of a:","options":[{"value":"A","text":"Strict authority"},{"value":"B","text":"Guide and facilitator"},{"value":"C","text":"Source of all knowledge"},{"value":"D","text":"Disciplinarian"}],"answer":"B"},{"id":66,"question":"According to pragmatism, discipline develops mainly through:","options":[{"value":"A","text":"Punishment and rewards"},{"value":"B","text":"Strict rules and regulations"},{"value":"C","text":"Active participation in group and purposeful activities"},{"value":"D","text":"Memorization of moral principles"}],"answer":"C"},{"id":67,"question":"According to John Dewey, education is:","options":[{"value":"A","text":"Rote memorization"},{"value":"B","text":"Learning by doing"},{"value":"C","text":"Lecture and dictation"},{"value":"D","text":"Textbook-based learning"}],"answer":"C"},{"id":69,"question":"According to pragmatism, the school should function as a:","options":[{"value":"A","text":"Separate institution from society"},{"value":"B","text":"Miniature society"},{"value":"C","text":"Religious institution"},{"value":"D","text":"Examination centre"}],"answer":"B"},{"id":70,"question":"Which principle of curriculum development emphasizes combining subjects to form a cohesive body of knowledge?","options":[{"value":"A","text":"Principle of utility"},{"value":"B","text":"Principle of child's interest"},{"value":"C","text":"Principle of experience"},{"value":"D","text":"Principle of integration Indian Educational Philosophy: Vedanta, Vivekananda & Aurobindo"}],"answer":"D"},{"id":71,"question":"Among the five layers of existence, the physical layer is known as:","options":[{"value":"A","text":"Anamaya (Annamaya)"},{"value":"B","text":"Pranamaya"},{"value":"C","text":"Mana"},{"value":"D","text":"Vanameaya"}],"answer":"A"},{"id":72,"question":"Among the five layers of existence, the vital layer is known as:","options":[{"value":"A","text":"Anamaya"},{"value":"B","text":"Pranamaya"},{"value":"C","text":"Manomaya"},{"value":"D","text":"Anamaya"}],"answer":"B"},{"id":73,"question":"Among the five layers of existence, the mental layer is known as:","options":[{"value":"A","text":"Anandaya (Anandamaya)"},{"value":"B","text":"Pranamaya"},{"value":"C","text":"Manaya"},{"value":"D","text":"Pityaya"}],"answer":"C"},{"id":75,"question":"According to Indian educational philosophy, the highest aim of education is:","options":[{"value":"A","text":"Acquisition of employment skills"},{"value":"B","text":"Accumulation of material wealth"},{"value":"C","text":"Self-realization (Atmajnana)"},{"value":"D","text":"Social competition"}],"answer":"C"},{"id":76,"question":"Which concept refers to the realization of the true nature of the self in Indian educational philosophy?","options":[{"value":"A","text":"Karma"},{"value":"B","text":"Atmajnana"},{"value":"C","text":"Aparavidya"},{"value":"D","text":"Sanskar"}],"answer":"B"},{"id":77,"question":"Which sequence represents the three stages of learning leading towards deeper understanding?","options":[{"value":"A","text":"Karma → Yoga → Meditation"},{"value":"B","text":"Shravana → Manana → Nididhyasana"},{"value":"C","text":"Dharma → Artha → Kama"},{"value":"D","text":"Reading → Writing → Examination"}],"answer":"B"},{"id":78,"question":"In Indian educational philosophy, the integration of spiritual and secular knowledge is expressed through:","options":[{"value":"A","text":"Guru and disciple"},{"value":"B","text":"Karma and Dharma"},{"value":"C","text":"Paravidya and Aparavidya"},{"value":"D","text":"Shravana and Manana"}],"answer":"C"},{"id":79,"question":"For Vivekananda, the ultimate test of education was ______.","options":[{"value":"A","text":"Advaita"},{"value":"B","text":"Buddhism"},{"value":"C","text":"Jainism"},{"value":"D","text":"None of the above"}],"answer":"A"},{"id":81,"question":"Whose message was a radical reimagining of education which he famously termed “man-making”?","options":[{"value":"A","text":"Dr. B. R. Ambedkar"},{"value":"B","text":"Vivekananda"},{"value":"C","text":"Gandhi"},{"value":"D","text":"None of the above"}],"answer":"B"},{"id":82,"question":"According to Swami Vivekananda, the true aim of education is:","options":[{"value":"A","text":"Accumulation of information"},{"value":"B","text":"Preparation for examinations"},{"value":"C","text":"Manifestation of the perfection already within the individual"},{"value":"D","text":"Development of vocational skills alone"}],"answer":"C"},{"id":83,"question":"According to Vivekananda, education as character-making primarily develops:","options":[{"value":"A","text":"Memorization and examination skills"},{"value":"B","text":"Strength of mind, intellect, character, and self-reliance"},{"value":"C","text":"Technical knowledge alone"},{"value":"D","text":"Competitive ability"}],"answer":"B"},{"id":84,"question":"According to Sri Aurobindo, integral development means:","options":[{"value":"A","text":"Focusing mainly on intellectual excellence"},{"value":"B","text":"Developing only moral and religious habits"},{"value":"C","text":"Nurturing every part of the human being — physical, vital, mental and spiritual"},{"value":"D","text":"Preparing students for competitive examinations 85."}],"answer":"C"},{"id":85,"question":"The aim of physical education in Aurobindo's system is to:","options":[{"value":"A","text":"Completely suppressed"},{"value":"B","text":"Left uncontrolled"},{"value":"C","text":"Educated and sublimated through art, music and disciplined activity"},{"value":"D","text":"Ignored in education"}],"answer":"C"},{"id":87,"question":"Aurobindo distinguishes the true development of the mind from rote learning by emphasizing:","options":[{"value":"A","text":"Memorization of facts"},{"value":"B","text":"Examination success"},{"value":"C","text":"Accumulation of information"},{"value":"D","text":"Concentration, clarity, creativity, intuition and inner silence"}],"answer":"D"},{"id":88,"question":"The statement “Nothing can be taught” implies that the teacher should:","options":[{"value":"A","text":"Strictly control and discipline students"},{"value":"B","text":"Lecture continuously"},{"value":"C","text":"Act as a guide who helps the child discover knowledge within"},{"value":"D","text":"Avoid interacting with the students"}],"answer":"C"},{"id":89,"question":"Education according to the nature of the child means that:","options":[{"value":"A","text":"All students should follow the same curriculum"},{"value":"B","text":"Competition should be increased"},{"value":"C","text":"Each child's unique tendencies and inner law of development must be respected"},{"value":"D","text":"Only gifted students should receive attention"}],"answer":"C"},{"id":90,"question":"Why did Aurobindo stress the primacy of the mother tongue as the medium of instruction?","options":[{"value":"A","text":"It is easier to control students"},{"value":"B","text":"It promotes foreign cultural values"},{"value":"C","text":"It enables natural, spontaneous expression of thought and originality"},{"value":"D","text":"It reduces the need for books 91."}],"answer":"C"},{"id":91,"question":"According to Sri Aurobindo's philosophy, education is primarily understood as:","options":[{"value":"A","text":"Humans are biologically incomplete"},{"value":"B","text":"Human life is only socially determined"},{"value":"C","text":"Humans are evolving towards a higher spiritual consciousness"},{"value":"D","text":"Education must focus only on physical development"}],"answer":"C"},{"id":93,"question":"The integral aspect of education in Aurobindo's thought refers to:","options":[{"value":"A","text":"Specialization in many academic subjects"},{"value":"B","text":"Training only the intellect"},{"value":"C","text":"Combining science and technology"},{"value":"D","text":"Developing the body, emotions, mind and inner spiritual core together"}],"answer":"D"},{"id":94,"question":"According to Sri Aurobindo, why must the mind be consulted in its growth?","options":[{"value":"A","text":"To impose a uniform curriculum"},{"value":"B","text":"To respect the learner’s natural development, interests and capacities"},{"value":"C","text":"To increase examination performance"},{"value":"D","text":"To encourage rote memorization"}],"answer":"B"},{"id":95,"question":"What is the role of the teacher according to Sri Aurobindo’s educational philosophy?","options":[{"value":"A","text":"Authoritarian instructor"},{"value":"B","text":"Controller of students"},{"value":"C","text":"Guide, helper and facilitator"},{"value":"D","text":"Examiner only"}],"answer":"C"},{"id":96,"question":"Which of the following best represents Sri Aurobindo’s view of mental education?","options":[{"value":"A","text":"Accumulation of information"},{"value":"B","text":"Development of mental faculties such as reasoning, imagination, memory and creativity"},{"value":"C","text":"Memorization of textbooks"},{"value":"D","text":"Preparation only for examinations"}],"answer":"B"},{"id":97,"question":"According to Sri Aurobindo, education should proceed:","options":[{"value":"A","text":"From abstract to concrete"},{"value":"B","text":"From difficult to easy"},{"value":"C","text":"From near to far, from what is to what shall be"},{"value":"D","text":"From teacher to student only Philosophy of Education MCQs Page 16Mahatma Gandhi's Educational Philosophy"}],"answer":"C"},{"id":98,"question":"According to Gandhi, the primary aim of education is to:","options":[{"value":"A","text":"Produce clerks and professionals"},{"value":"B","text":"Develop morally strong, socially responsible and spiritually awakened individuals"},{"value":"C","text":"Promote competition"},{"value":"D","text":"Prepare students only for examinations"}],"answer":"B"},{"id":99,"question":"According to Gandhi, “knowledge without character” is:","options":[{"value":"A","text":"Essential for progress"},{"value":"B","text":"Dangerous"},{"value":"C","text":"The highest form of education"},{"value":"D","text":"Unnecessary for society"}],"answer":"B"},{"id":100,"question":"Which of the following is central to Gandhian education as service?","options":[{"value":"A","text":"Personal advancement"},{"value":"B","text":"Competition"},{"value":"C","text":"Welfare of society and the common good"},{"value":"D","text":"Economic success alone"}],"answer":"C"},{"id":101,"question":"In Gandhian education, productive work and manual labour primarily help develop:","options":[{"value":"A","text":"Dependence"},{"value":"B","text":"Dignity of labour and self-reliance"},{"value":"C","text":"Competition"},{"value":"D","text":"Intellectual superiority"}],"answer":"B"},{"id":102,"question":"According to Gandhi, the teacher should primarily act as a:","options":[{"value":"A","text":"Strict authoritarian"},{"value":"B","text":"Moral guide and role model"},{"value":"C","text":"Government officer"},{"value":"D","text":"Passive observer"}],"answer":"B"},{"id":103,"question":"According to Gandhian education, true service should be:","options":[{"value":"A","text":"Preparation for government employment"},{"value":"B","text":"Intellectual excellence alone"},{"value":"C","text":"Liberation of the individual at personal and social levels (Harmonious development)"},{"value":"D","text":"Mastery of Western scientific knowledge"}],"answer":"C"},{"id":105,"question":"In Gandhian educational philosophy, true Swaraj primarily means:","options":[{"value":"A","text":"Political independence alone"},{"value":"B","text":"Economic globalization"},{"value":"C","text":"Self-rule and mastery over one's own desires"},{"value":"D","text":"Industrial development"}],"answer":"C"},{"id":106,"question":"The integration of head, heart and hand in Gandhian education signifies:","options":[{"value":"A","text":"Separation of theory and practice"},{"value":"B","text":"Holistic development of intellectual, moral and practical faculties"},{"value":"C","text":"Preference for manual labour over intellectual work"},{"value":"D","text":"Elimination of classroom teaching 107."}],"answer":"B"},{"id":107,"question":"Gandhi emphasized education through the mother tongue mainly to:","options":[{"value":"A","text":"Reject all foreign languages"},{"value":"B","text":"Promote cultural self-respect and deeper understanding"},{"value":"C","text":"Limit global interaction"},{"value":"D","text":"Simplify examinations"}],"answer":"B"},{"id":108,"question":"In Gandhian philosophy, productive manual work in education is intended to:","options":[{"value":"A","text":"Replace academic subjects completely"},{"value":"B","text":"Reduce the cost of schooling"},{"value":"C","text":"Promote dignity of labour and economic self-reliance"},{"value":"D","text":"Punish students through hard work"}],"answer":"C"},{"id":109,"question":"According to Mahatma Gandhi, self-discipline in education primarily aims at:","options":[{"value":"A","text":"Imposed by authority"},{"value":"B","text":"Based on fear of punishment"},{"value":"C","text":"Voluntary and internally motivated"},{"value":"D","text":"Dependent on examination rules"}],"answer":"B"},{"id":111,"question":"The integration of productive manual work in education helps cultivate:","options":[{"value":"A","text":"Physical strength alone"},{"value":"B","text":"Economic profit for schools"},{"value":"C","text":"Habits of patience, responsibility and self￾control"},{"value":"D","text":"Replacement of a "value":"D","text":"Urban industrial training only"}],"answer":"C"},{"id":119,"question":"Gandhi believed that educating women would have a multiplying effect on society because:","options":[{"value":"A","text":"Women controlled political institutions"},{"value":"B","text":"Women were the primary educators of children at home"},{"value":"C","text":"Women dominated economic markets"},{"value":"D","text":"Women were excluded from religion"}],"answer":"B"},{"id":120,"question":"In Gandhian philosophy, women were considered especially suited for nonviolent resistance because of their:","options":[{"value":"A","text":"Physical strength"},{"value":"B","text":"Legal authority"},{"value":"C","text":"Moral courage and patience"},{"value":"D","text":"Military training"}],"answer":"C"},{"id":121,"question":"Gandhi opposed the blind imitation of Western education for women because he believed education should:","options":[{"value":"A","text":"Focus only on religious instruction"},{"value":"B","text":"Ignore vocational training"},{"value":"C","text":"Be rooted in cultural values and moral development"},{"value":"D","text":"Eliminate community life"}],"answer":"C"},{"id":7,"question":"According to……………… the ultimate aim of Progressive education was the cultivation of democratic citizenship.","options":[{"value":"A","text":"Dewey"},{"value":"B","text":"Plato"},{"value":"C","text":"Aristotle"},{"value":"D","text":"None of the above"}],"answer":"A"},{"id":20,"question":"According to Plato, education is essentially:","options":[{"value":"A","text":"Training for economic productivity"},{"value":"B","text":"Preparation for political power"},{"value":"C","text":"Turning the soul towards the light of truth"},{"value":"D","text":"Memorization of established doctrines"}],"answer":"C"},{"id":26,"question":"Who emphasized education as growth and reconstruction of experience?","options":[{"value":"A","text":"Plato"},{"value":"B","text":"Aristotle"},{"value":"C","text":"John Dewey"},{"value":"
